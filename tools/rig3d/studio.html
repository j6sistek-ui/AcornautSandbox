<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rig studio</title>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body style="margin:0;background:#1d1a2e">
<script type="module">
// Headless studio for render.mjs: loads ?model=..., auto-rigs it, frames it once for
// every move, and exposes window.studio for the renderer to drive.
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadRig } from './autorig.js';
import { MOVES as ALL_MOVES, RIG_OPTS } from './moves.js';

const q = new URLSearchParams(location.search);
const SIZE = +(q.get('size') || 512);
// ?frames=tap:12,desc:4,asc:0 overrides a bank's frame count; 0 leaves the move out
const counts = Object.fromEntries((q.get('frames') || '').split(',').filter(Boolean).map(kv => kv.split(':')).map(([k, v]) => [k, +v]));
const MOVES = Object.fromEntries(Object.entries(ALL_MOVES).filter(([k]) => counts[k] !== 0).map(([k, m]) => [k, { ...m, frames: counts[k] ?? m.frames }]));
const R = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(SIZE, SIZE);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
document.body.appendChild(R.domElement);

const rig = await loadRig(q.get('model'), { ...(RIG_OPTS || {}), ...(q.get('head') ? { map: { head: q.get('head') } } : {}) });
const scene = new THREE.Scene(); scene.add(rig.pivot);
// a soft studio room for metal to reflect: Tripo's materials are metallic-roughness, and with
// nothing around them their metal parts rendered near black
scene.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xfff4fb, 0x3a2f55, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.4); scene.add(key);
const rim = new THREE.DirectionalLight(0xb9a6ff, 1.6); scene.add(rim);

// one frame for all moves: every posed vertex of every move, seen from the camera's side,
// so all banks share one framing and nothing is cropped
// three-quarter view, about 33 degrees round toward the face, a touch from above
const dir = rig.LAT.clone().addScaledVector(rig.FWD, 0.65).addScaledVector(rig.UP, 0.06).normalize();
const right = new THREE.Vector3().crossVectors(dir.clone().negate(), rig.UP).normalize(), up = new THREE.Vector3().crossVectors(right, dir.clone().negate()).normalize();
const v = new THREE.Vector3(); let minR = Infinity, maxR = -Infinity, minU = Infinity, maxU = -Infinity, minD = Infinity, maxD = -Infinity;
const pos = rig.mesh.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 6000));
for (const m of Object.values(MOVES)) for (let i = 0; i <= 10; i++) {
  rig.apply({ ...m.pose(i / 10), lift: 0 }); rig.mesh.updateMatrixWorld(true);
  for (let k = 0; k < pos.count; k += step) { rig.mesh.getVertexPosition(k, v).applyMatrix4(rig.mesh.matrixWorld);
    const r = v.dot(right), u = v.dot(up), d = v.dot(dir); minR = Math.min(minR, r); maxR = Math.max(maxR, r); minU = Math.min(minU, u); maxU = Math.max(maxU, u); minD = Math.min(minD, d); maxD = Math.max(maxD, d); }
}
// FRAMED BY THE BODY, so every model's body lands the same size in the same place: the
// body's own length (head to rump, no tail) sets the scale, and its centre sits a fixed
// distance right of the frame's centre, leaving the tail room behind it. The extents of
// every pose are still measured, to report anything the frame clips.
const tailIdx = new Set(rig.tailBones.map(b => rig.mesh.skeleton.bones.indexOf(b)));
const tsi = rig.mesh.geometry.attributes.skinIndex, tsw = rig.mesh.geometry.attributes.skinWeight, bodyVerts = [];
for (let k = 0; k < pos.count; k += step) { let t = 0; for (let c = 0; c < 4; c++) if (tailIdx.has(tsi.getComponent(k, c))) t += tsw.getComponent(k, c); if (t < 0.5) bodyVerts.push(k); }
rig.apply({ ...MOVES.tap.pose(0), lift: 0 }); rig.mesh.updateMatrixWorld(true);
let b0 = Infinity, b1 = -Infinity, c0 = Infinity, c1 = -Infinity, dd = 0;
for (const k of bodyVerts) { rig.mesh.getVertexPosition(k, v).applyMatrix4(rig.mesh.matrixWorld); const r = v.dot(right), u = v.dot(up); b0 = Math.min(b0, r); b1 = Math.max(b1, r); c0 = Math.min(c0, u); c1 = Math.max(c1, u); dd += v.dot(dir); }
const BODY = +(q.get('body') || 0.42), RIGHT = +(q.get('right') || 0.16), FOV = 28;   // body length as a share of the frame; its centre's offset right
const half = (b1 - b0) / 2 / BODY;
const target = right.clone().multiplyScalar((b0 + b1) / 2 - RIGHT * 2 * half).addScaledVector(up, (c0 + c1) / 2).addScaledVector(dir, dd / bodyVerts.length);
// how far each pose reaches past each frame edge, as a share of half the frame (> 0 = clipped)
const tr = target.dot(right), tu = target.dot(up), past = x => +(x / half).toFixed(2);
const framing = { bodyShare: BODY, past: { left: past(tr - half - minR), right: past(maxR - tr - half), top: past(maxU - tu - half), bottom: past(tu - half - minU) } };
const cam = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);
const dist = half / Math.tan(THREE.MathUtils.degToRad(FOV / 2)) + (maxD - minD) / 2;
cam.position.copy(target).addScaledVector(dir, dist); cam.up.copy(rig.UP); cam.lookAt(target);
key.position.copy(target).addScaledVector(dir, 3).addScaledVector(rig.UP, 2.5).addScaledVector(rig.FWD, 1.5);
rim.position.copy(target).addScaledVector(dir, -2).addScaledVector(rig.UP, 1.5);

// THE HELMET ANCHOR, measured, not placed by eye: the head bone's own vertices projected
// through the camera give the head's centre and size on the frame, and its forward vector
// gives the tilt. [x, y, r, deg] in 256 px frame space, the game's DOME format.
const headBone = rig.mesh.skeleton.bones.find(b => b.name === rig.info.head);
const headIdx = rig.mesh.skeleton.bones.indexOf(headBone);
const hsi = rig.mesh.geometry.attributes.skinIndex, hsw = rig.mesh.geometry.attributes.skinWeight, headVerts = [];
for (let i = 0; i < hsi.count; i++) { let b = -1, w = 0; for (let k = 0; k < 4; k++) if (hsw.getComponent(i, k) > w) { w = hsw.getComponent(i, k); b = hsi.getComponent(i, k); } if (b === headIdx) headVerts.push(i); }
const hstep = Math.max(1, Math.floor(headVerts.length / 800));
function headAnchor() {
  rig.mesh.updateMatrixWorld(true); const pv = new THREE.Vector3(); let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let n = 0; n < headVerts.length; n += hstep) { rig.mesh.getVertexPosition(headVerts[n], pv).applyMatrix4(rig.mesh.matrixWorld).project(cam);
    const px = (pv.x + 1) / 2 * 256, py = (1 - pv.y) / 2 * 256; x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  const q = headBone.getWorldQuaternion(new THREE.Quaternion());
  const fw = rig.FWD.clone().applyQuaternion(q.clone().multiply(headRest.clone().invert())), o = rig.centre.clone(), t = o.clone().add(fw);
  o.project(cam); t.project(cam); const deg = Math.atan2(-(t.y - o.y), t.x - o.x) * 180 / Math.PI;
  return [+((x0 + x1) / 2).toFixed(2), +((y0 + y1) / 2).toFixed(2), +(Math.max(x1 - x0, y1 - y0) / 2).toFixed(2), +deg.toFixed(2)];
}
rig.apply({ ...MOVES.tap ? MOVES.tap.pose(0) : {}, lift: 0 }); rig.pivot.updateMatrixWorld(true);
const headRest = headBone.getWorldQuaternion(new THREE.Quaternion());
function frame(move, u, lift) { const p = MOVES[move].pose(u); if (!lift) p.lift = 0; rig.apply(p); R.render(scene, cam); return R.domElement.toDataURL('image/png'); }

window.studio = {
  info: { ...rig.info, framing },
  moves: Object.fromEntries(Object.entries(MOVES).map(([k, m]) => [k, { frames: m.frames, loop: m.loop }])),
  // bank frame i of a move, as the game will see it (sprite stays centred; the game moves it)
  bank(move, i) { const m = MOVES[move]; return frame(move, m.loop ? i / m.frames : i / (m.frames - 1), false); },
  // the helmet anchor of the frame bank() just drew
  anchor() { return headAnchor(); },
  // a sample at any u, with the move's own lift so a preview shows the motion
  sample(move, u) { return frame(move, u, true); },
  // the rig with every move baked in as a clip `seconds` long, for Blender or any glTF viewer
  async glb(seconds = 2, fps = 30) {
    const clips = [];
    for (const [name, m] of Object.entries(MOVES)) {
      const n = Math.round(seconds * fps) + 1, times = [], tracks = new Map();
      for (let i = 0; i < n; i++) {
        const u = m.loop ? i / (n - 1) : i / (n - 1); rig.apply(m.pose(u)); times.push(seconds * i / (n - 1));
        for (const b of rig.all) { if (!tracks.has(b)) tracks.set(b, []); tracks.get(b).push(...b.quaternion.toArray()); }
        if (!tracks.has('pq')) { tracks.set('pq', []); tracks.set('pp', []); }
        tracks.get('pq').push(...rig.pivot.quaternion.toArray()); tracks.get('pp').push(...rig.pivot.position.toArray());
      }
      const kt = [];
      for (const [b, v] of tracks) if (typeof b !== 'string') kt.push(new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, v));
      kt.push(new THREE.QuaternionKeyframeTrack('flightPivot.quaternion', times, tracks.get('pq')));
      kt.push(new THREE.VectorKeyframeTrack('flightPivot.position', times, tracks.get('pp')));
      clips.push(new THREE.AnimationClip(name, seconds, kt));
    }
    rig.apply(MOVES.tap.pose(0));
    const buf = new Uint8Array(await new GLTFExporter().parseAsync(rig.pivot, { binary: true, animations: clips }));
    let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode(...buf.subarray(i, i + 0x8000));
    return btoa(s);
  },
};
window.studioReady = true;
</script>
</body>
</html>
