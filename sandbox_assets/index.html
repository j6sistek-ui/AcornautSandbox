<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Acornaut — Illustrated v14</title>
  <meta name="description" content="Illustrated Acornaut rewrite. Fly the gaps. Grab the acorns." />
  <meta name="theme-color" content="#070b16" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070b16; color: #f3efe4; font-family: Figtree, system-ui, sans-serif; touch-action: none; user-select: none; }
    #app, .ac-root { width: 100%; height: 100%; display: flex; justify-content: center; }
    .ac-stage { position: relative; width: 100%; max-width: 480px; height: 100%; background: #0c1224; overflow: hidden; }
    .ac-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .ac-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
    .ac-overlay > * { pointer-events: auto; }
    .ac-sheet { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px 18px 18px; background: rgba(7,11,22,0.9); overflow: hidden; }
    .ac-center { align-items: center; justify-content: center; text-align: center; }
    .ac-head { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    h1 { font-family: Fraunces, serif; font-size: 42px; line-height: 0.95; }
    h2 { font-family: Fraunces, serif; font-size: 28px; }
    .ac-kicker { letter-spacing: .32em; text-transform: uppercase; color: #e8a44a; font-size: 11px; }
    .ac-sub, .ac-fine { color: #8b95b0; font-size: 12px; }
    .ac-fine { text-align: center; font-size: 10px; }
    .ac-gold { color: #e8a44a; font-weight: 700; }
    .ac-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .ac-chip { border: 1px solid rgba(232,164,74,.4); border-radius: 999px; padding: 6px 12px; color: #e8a44a; font-weight: 700; }
    .ac-hero { display: block; height: 32%; width: auto; max-width: 78%; margin: 8px auto; object-fit: contain; }
    button { font: inherit; cursor: pointer; border: 0; }
    .ac-primary { background: #4ab4ff; color: #0c1224; border-radius: 16px; padding: 14px 16px; font-weight: 800; font-size: 18px; }
    .ac-ghost { background: #141b30; color: #f3efe4; border: 1px solid #2a3454; border-radius: 16px; padding: 12px 16px; font-weight: 700; }
    .ac-dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
    .ac-dockbtn { background: #141b30; color: #f3efe4; border: 1px solid #2a3454; border-radius: 16px; padding: 12px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .ac-tabs { display: flex; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
    .ac-tab { background: #141b30; color: #8b95b0; border: 1px solid #2a3454; border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; min-height: 36px; }
    .ac-tab.on { background: #4ab4ff; color: #0c1224; border-color: transparent; }
    .ac-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ac-card { min-height: 156px; background: #141b30; color: #f3efe4; border: 1px solid #2a3454; border-radius: 16px; padding: 10px 6px 10px; font-size: 11px; font-weight: 700; white-space: pre-line; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; overflow: visible; }
    .ac-card img, .ac-card canvas { width: 80px; height: 80px; object-fit: contain; flex-shrink: 0; }
    .ac-sheet-scroll { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; padding-top: 6px; }
    .ac-loadout { display: flex; align-items: center; gap: 12px; background: #141b30; border: 1px solid #2a3454; border-radius: 16px; padding: 10px 12px; }
    .ac-loadout canvas { width: 64px; height: 64px; }
    .ac-helm { width: 36px; height: 28px; border-radius: 18px 18px 8px 8px; display: block; margin-bottom: 4px; }
    .ac-trail { width: 48px; height: 10px; border-radius: 999px; display: block; margin-bottom: 6px; }
    .ac-card.on { border-color: #4ab4ff; background: rgba(74,180,255,.15); }
    .ac-log { border: 1px solid #2a3454; border-radius: 16px; padding: 10px 12px; }
    .ac-coin { width: 20px; height: 20px; vertical-align: -4px; margin-right: 5px; }
    .ac-ctrls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .ac-ctrl { border-radius: 16px; padding: 12px 8px; text-align: center; border: 1px solid; }
    .ac-tap { background: rgba(58,140,255,.14); border-color: rgba(90,160,255,.6); }
    .ac-swipe { background: rgba(255,150,60,.12); border-color: rgba(255,170,80,.55); }
    .ac-glyph { font-size: 20px; line-height: 1; margin-bottom: 6px; }
    .ac-tap .ac-glyph { color: #5aa0ff; }
    .ac-swipe .ac-glyph { color: #ffb060; }
    .ac-ctrltitle { font-weight: 800; font-size: 15px; }
    .ac-tap .ac-ctrlsub { color: #9cc4ff; font-size: 11px; font-weight: 700; }
    .ac-swipe .ac-ctrlsub { color: #ffc080; font-size: 11px; font-weight: 700; }
    .ac-mid { text-align: center; }
    .ac-helprow { display: flex; align-items: center; gap: 12px; padding: 7px 2px; }
    .ac-dock2 { margin-top: auto; display: flex; justify-content: space-around; padding: 6px 0 2px; }
    .ac-dockicon { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #8b95b0; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .ac-dockicon .ac-ring { width: 52px; height: 52px; border-radius: 50%; background: #141b30; border: 1px solid #2a3454; display: flex; align-items: center; justify-content: center; }
    .ac-dockicon svg { width: 24px; height: 24px; fill: none; stroke: #cfd8ee; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .ac-road { position: relative; padding-left: 30px; }
    .ac-road::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(#2a3454, rgba(232,164,74,.5), #2a3454); }
    .ac-roaditem { position: relative; display: flex; align-items: center; gap: 12px; border: 1px solid #2a3454; border-radius: 16px; padding: 8px 12px; margin: 10px 0; background: rgba(12,18,36,.55); }
    .ac-roaditem::before { content: ""; position: absolute; left: -25px; top: 50%; width: 10px; height: 10px; background: #2a3454; transform: translateY(-50%) rotate(45deg); border-radius: 2px; }
    .ac-roaditem.on { border-color: rgba(93,255,158,.45); }
    .ac-roaditem.on::before { background: #5dff9e; }
    .ac-roaditem.next { border-color: rgba(232,164,74,.8); box-shadow: 0 0 14px rgba(232,164,74,.25); animation: ac-pulse 1.6s ease-in-out infinite; }
    .ac-roaditem.next::before { background: #e8a44a; }
    .ac-roaditem.future { opacity: .55; }
    .ac-roadtxt p { margin: 0; }
    .ac-roadlvl { font-size: 10px; font-weight: 800; color: #8b95b0; letter-spacing: .06em; }
    .ac-check { margin-left: auto; color: #5dff9e; font-weight: 900; }
    .ac-togo { margin-left: auto; color: #e8a44a; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .ac-xpbar { width: 100%; max-width: 260px; height: 10px; border-radius: 999px; background: #141b30; border: 1px solid #2a3454; overflow: hidden; margin: 8px auto; }
    .ac-xpbar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #e8a44a, #ffd080); transition: width 1.1s cubic-bezier(.2,.8,.3,1); }
    @keyframes ac-pulse { 0%,100% { box-shadow: 0 0 8px rgba(232,164,74,.18); } 50% { box-shadow: 0 0 18px rgba(232,164,74,.4); } }
    .ac-log.on { border-color: rgba(232,164,74,.4); background: #141b30; }
    .ac-playbar { display: flex; justify-content: flex-end; padding: 12px; }
    .ac-iconbtn { width: 40px; height: 40px; border-radius: 12px; background: rgba(20,27,48,.8); color: #f3efe4; border: 1px solid #2a3454; font-weight: 800; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
    window.__ACORNAUT_ART__ = "./art";
  </script>
  <script type="module">
    import { bootStandalone } from "./js37/standalone.js";
    bootStandalone(document.getElementById("app"));
  </script>
</body>
</html>
