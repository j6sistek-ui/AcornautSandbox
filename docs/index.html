<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Acornaut</title>
  <meta name="description" content="Acornaut: fly a squirrel through the gaps, grab the acorns, and earn your way across a 260-mission star chart. Free to play." />
  <meta name="theme-color" content="#070b16" />
  <meta property="og:title" content="Acornaut" />
  <meta property="og:description" content="Fly the gaps. Grab the acorns." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://acornaut.app/" />
  <meta property="og:image" content="https://acornaut.app/art/menu-splash.jpg?v=145" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://acornaut.app/art/menu-splash.jpg?v=145" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=4" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=4" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <style>
    /* Long-press must never become a text selection: a held thrust in
       Hyper Run was painting the whole screen selection-blue on phones.
       The prefixed rules are what iOS Safari actually honours, and the
       touch-callout kill stops the copy/look-up bubble. Inputs opt back
       in so the access code can still be typed and pasted. */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070b16; color: #f3efe4; font-family: Figtree, system-ui, sans-serif; touch-action: none; user-select: none; }
    #app, .ac-root { width: 100%; height: 100%; display: flex; justify-content: center; }
    .ac-stage { position: relative; width: 100%; max-width: 480px; height: 100%; background: #0c1224; overflow: hidden;
      /* the notch, published for the canvas HUD to read (engine resize) */
      --sat: env(safe-area-inset-top, 0px); }
    .ac-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .ac-backplate { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
    /* the beta flight lab on the pause sheet */
    .ac-lab { margin: 6px 0 4px; text-align: left; }
    .ac-labhead { text-align: center; margin-bottom: 4px; }
    .ac-labrow { display: grid; grid-template-columns: 9.5em 1fr 3.6em; align-items: center; gap: 8px; margin: 3px 0; font-size: 11px; }
    .ac-labname { color: #cfd8ea; letter-spacing: .04em; text-transform: uppercase; }
    .ac-labval { text-align: right; color: #ffe299; font-variant-numeric: tabular-nums; }
    .ac-labslider { width: 100%; accent-color: #b876ff; }
    .ac-lab .ac-modes { margin: 6px 0 2px; }
    /* a built-in wake is shown, not chosen: full strength while disabled */
    .ac-builtintrail, .ac-builtintrail:disabled { opacity: 1; cursor: default; }
    .ac-suit-pitch { margin: 6px 0 2px; }
    .ac-suit-pitch .ac-modes { margin: 6px 0; }
    /* WIDESCREEN MODE: the stage sheds the phone cap and menus take the
       whole screen — panels and art run full-bleed while the content
       holds a centred, readable column instead of stretching. */
    body.ac-wide .ac-stage { max-width: none; }
    body.ac-wide .ac-sheet { padding-left: max(18px, calc(50% - 360px)); padding-right: max(18px, calc(50% - 360px)); }
    .ac-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
    .ac-overlay > * { pointer-events: auto; }
    .ac-sheet { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px 18px 18px; background: rgba(7,11,22,0.9); overflow: hidden; }
    .ac-center { align-items: center; justify-content: center; text-align: center; }
    .ac-result { overflow-y: auto; justify-content: safe center; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    @media (max-height: 540px) { .ac-result { justify-content: flex-start; } }
    h1 { font-family: Fraunces, serif; font-size: 42px; line-height: 0.95; }
    h2 { font-family: Fraunces, serif; font-size: 28px; }
    .ac-kicker { letter-spacing: .32em; text-transform: uppercase; color: #e8a44a; font-size: 11px; }
    .ac-sub, .ac-fine { color: #8b95b0; font-size: 12px; }
    .ac-fine { text-align: center; font-size: 10px; }
    .ac-gold { color: #e8a44a; font-weight: 700; }
    .ac-row { display: flex; justify-content: space-between; align-items: flex-start; }
    /* ================= THE MENU SHELL =================
       Five tabs on one bar, every tab its own full screen. Two button
       materials: HELMET GLASS on the home screen (the visor off the
       suit, so the launch button belongs to the art) and GALAXY on the
       side menus. Gold is reserved for what you EARN — acorn counts,
       prices, the Flight Log's rungs and its XP bar.            */

    /* --- 1 · the cold open: loading --- */
    .ac-boot { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
      background: radial-gradient(120% 62% at 50% 42%, #16123a 0%, #0a0620 52%, #05020e 100%); }
    .ac-bootnut { position: relative; width: 150px; height: 150px; }
    /* the drained shell, waiting to be filled */
    .ac-bootshell { position: absolute; inset: 0; width: 150px; height: 150px; object-fit: contain;
      filter: grayscale(1) brightness(.8) contrast(.75); opacity: .44; }
    /* THIS BOX'S HEIGHT IS THE PROGRESS VALUE. It is masked by the
       acorn's own alpha so the waterline stops at the shell instead of
       running off as a rectangle. */
    .ac-bootfill { position: absolute; left: 0; bottom: 0; width: 150px; height: 8%; overflow: hidden;
      transition: height .28s ease;
      -webkit-mask-image: var(--nut); mask-image: var(--nut);
      -webkit-mask-size: 150px 150px; mask-size: 150px 150px;
      -webkit-mask-position: center bottom; mask-position: center bottom;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .ac-bootfill img { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; object-fit: contain; }
    .ac-bootline { position: absolute; left: 0; right: 0; top: 0; height: 26px;
      background: linear-gradient(rgba(255,230,163,.45), transparent); border-top: 2px solid #fff2cf; }
    .ac-boottitle { margin-top: 14px; font-family: Fraunces, serif; font-weight: 800; font-size: 40px; line-height: .95;
      background: linear-gradient(#ffe6a3 12%, #e8a44a 54%, #a86a1f 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ac-bootsub { margin-top: 9px; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; color: #8b95b0; }
    .ac-bootfine { position: absolute; left: 0; right: 0; bottom: 22px; }

    /* --- 2 · tap to start. The tap also unlocks audio. --- */
    .ac-splash { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
      background-color: #05020e; background-size: cover; background-position: center; cursor: pointer; overflow: hidden; }
    .ac-splash-ink { position: absolute; left: 0; right: 0; bottom: 0; height: 54%;
      background: linear-gradient(transparent, rgba(5,2,14,.55) 42%, rgba(5,2,14,.9) 78%, #05020e 100%); }
    .ac-splash-stack { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px 92px; }
    .ac-splash-title { font-family: Fraunces, serif; font-weight: 800; font-size: 51px; line-height: .92; color: #fff;
      text-shadow: 0 3px 22px rgba(5,2,14,.9), 0 0 44px rgba(120,150,220,.35); }
    .ac-splash-tap { display: flex; align-items: center; gap: 9px; margin-top: 18px; color: #ffd76a;
      animation: ac-tappulse 1.9s ease-in-out infinite; }
    .ac-splash-tap span { font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #fff;
      text-shadow: 0 1px 10px rgba(5,2,14,.95); }
    .ac-splash-fine { position: relative; padding-bottom: 22px; }
    @keyframes ac-tappulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    /* --- 2b · the launch film. Runs once between the tap and the menu,
       then holds its last frame and dissolves into the home plate, which
       is that same frame painted larger. The dissolve is what hides the
       seam: the film is 1088x1920 and the plate 1206x2622, so their cover
       crops do not land on identical pixels. --- */
    .ac-filmhost { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
    .ac-filmhost > * { pointer-events: auto; }
    .ac-film { position: absolute; inset: 0; background: #05020e; cursor: pointer; z-index: 40; }
    .ac-film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    /* a wide window (desktop, landscape phone): the portrait film is shown
       whole on the dark plate instead of a zoomed crop of its middle
       (owner, 7 Sep 2026: "super zoomed in and missing a lot") */
    @media (min-aspect-ratio: 1/1) {
      .ac-film video { object-fit: contain; }
      /* the owner's wide plate behind the letterboxed film, so the sides
         are a horizon rather than black; the film's own edge falls into a
         soft shadow instead of a hard cut */
      .ac-film { background: #05020e url("./art/film-backdrop-wide.jpg?v=224") center / cover no-repeat; }
      .ac-film::before { content: ""; position: absolute; inset: 0; background: rgba(5,2,14,.28); pointer-events: none; }
      .ac-film video { filter: drop-shadow(0 0 60px rgba(0,0,0,.85)); }
    }
    .ac-film.out { opacity: 0; transition: opacity .38s ease; pointer-events: none; }
    .ac-filmskip { position: absolute; right: 14px; bottom: 18px; z-index: 2;
      background: rgba(10,16,32,.6); border: 1px solid rgba(150,166,200,.3); color: #cdd6ea;
      border-radius: 999px; padding: 7px 15px; font: 700 10px/1 Figtree, system-ui, sans-serif;
      letter-spacing: .18em; opacity: 0; transition: opacity .4s ease .7s; }
    .ac-film.ready .ac-filmskip { opacity: 1; }
    /* MENU ANIMATION OFF. One switch, one class on <body>, every menu
       animation and transition stops - including the ones behind the
       pulse, the fade and the moving dust badge. Canvas motion is the
       game and is not touched. */
    body.ac-nomotion *, body.ac-nomotion *::before, body.ac-nomotion *::after {
      animation: none !important; transition: none !important; }
    /* the settings list: a label with a quiet second line, the switch on the right */
    .ac-setrow { gap: 12px; }
    .ac-settxt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .ac-settxt b { font-weight: 800; }
    .ac-setsub { font-size: 10.5px; font-weight: 600; color: #7d869f; letter-spacing: .02em; }

    /* --- 3 · HOME --- */
    /* full-bleed, like the film that dissolves into it: the plate is a
       whole-phone composition and the old 74% band cropped the pilot's
       head up under the wordmark */
    /* a touch of ink so the pills and wordmark hold on any frame */
    .ac-pill { display: flex; align-items: center; gap: 6px; background: rgba(10,16,32,.72);
      border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 800; color: #fff; }
    .ac-pill-gold { color: #ffdf9a; }

    /* the second door into the Hangar */

    /* HELMET GLASS — home only */
    .ac-mode { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; }
    .ac-modes { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px;
      background: rgba(16,22,42,.9); border: 1px solid #2a3454; border-radius: 14px; padding: 4px; }
    .ac-mode { min-height: 44px; border-radius: 10px; background: transparent; color: #98a2bd; font-size: 10px;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .ac-mode.on { color: #17203A; font-weight: 800;
      background: linear-gradient(196deg, #F4F8FF, #C4D5EC); box-shadow: inset 0 1px 0 rgba(255,255,255,1); }

    /* --- the tab bar, on every menu --- */
    /* HOME is the raised dome: the biggest target, and glass on EVERY
       screen because it is the home button — the white is its identity,
       not the current screen's colour. */

    /* --- the four side menus --- */
    .ac-menu { display: flex; flex-direction: column; height: 100%; background: #070b16; overflow: hidden; }

    /* Help left the tab bar for the "?" every other game puts in a corner.
       44px so it clears the touch-target floor on a phone. */
    .ac-helpdot { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center;
      background: rgba(10,16,32,.72); border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
      color: #cfd8ea; cursor: pointer; }
    .ac-helpdot:active { transform: scale(.94); }
    .ac-headaside { display: flex; align-items: center; gap: 8px; flex: none; }

    /* a mod or bundle card is a row, not a tile: it has to carry a
       sentence of explanation that a 3-up grid cannot hold */
    .ac-bundlestrip { display: flex; align-items: center; gap: 4px; }
    .ac-bundlestrip img, .ac-bundlestrip canvas { width: 40px; height: 40px; }
    .ac-bundlemore { font-size: 11px; font-weight: 800; color: #8b95b0; }
    .ac-bundlecount { position: absolute; right: 12px; bottom: 8px; font-size: 9px;
      letter-spacing: .14em; color: #6f7ba0; }
    .ac-labnote { text-align: center; margin-top: 6px; color: #5d6885; }

    /* ---- star chart ---- */
    .ac-pips { display: inline-flex; gap: 2px; }
    .ac-pip { color: #3a4468; font-size: 13px; line-height: 1; }
    .ac-pip.on { color: #ffd060; text-shadow: 0 0 8px rgba(255,208,96,.55); }
    .ac-pips.sm .ac-pip { font-size: 10px; }
    .ac-lvlsheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(5,8,18,.72); }
    .ac-lvlcard { width: 100%; border-radius: 18px 18px 0 0; border-top: 1px solid #3a4468; background: #101830; padding: 18px 18px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
    .ac-lvlcard.ac-racecard { width: min(760px, 100%); max-height: min(94vh, 820px); margin-inline: auto; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .ac-racecard > * { flex-shrink: 0; }
    .ac-racecard .ac-lvlname { font-weight: 800; }
    .ac-briefhead { display: flex; align-items: center; gap: 12px; }
    .ac-briefhead > div { flex: 1; min-width: 0; }
    .ac-raceactions { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); padding: 10px 0 calc(16px + env(safe-area-inset-bottom)); background: #101830; }
    body.ac-beta .ac-raceactions { background: #191036; }
    .ac-raceactions .ac-primary { width: 100%; }
    .ac-racebrief { display: grid; gap: 10px; }
    .ac-racebriefblock { border: 1px solid rgba(170,140,240,.28); border-radius: 14px; padding: 12px 13px; background: rgba(8,13,31,.38); }
    .ac-racebriefblock h3 { margin: 0 0 8px; font: 900 14px/1 Figtree, sans-serif; letter-spacing: .12em; color: #ffe086; }
    .ac-racebriefblock p { margin: 0; color: #d7def0; font: 600 14px/1.45 Figtree, sans-serif; }
    .ac-racecontrols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ac-racecontrol { display: grid; grid-template-columns: minmax(118px, .9fr) 1.1fr; gap: 10px; align-items: baseline; padding: 5px 0; color: #d7def0; font: 600 14px/1.3 Figtree, sans-serif; }
    .ac-racecontrol + .ac-racecontrol { border-top: 1px solid rgba(170,140,240,.13); }
    .ac-racecontrol b { color: #a9f5ff; font-size: 14px; letter-spacing: .035em; }
    @media (max-width: 619px), (max-height: 699px) {
      .ac-lvlcard.ac-racecard { max-height: 96vh; gap: 8px; padding-top: 14px; }
      .ac-racecontrols { grid-template-columns: 1fr; }
      .ac-racebriefblock { padding: 10px 12px; }
      .ac-racebriefblock p, .ac-racecontrol { font-size: 14px; }
    }
    .ac-lvlname { font-family: Fraunces, Georgia, serif; font-size: 26px; margin: 0; }
    .ac-lvltags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ac-lvltag { font: 800 9px/1 Figtree, sans-serif; letter-spacing: .1em; color: #9fb0d0; border: 1px solid #3a4468; border-radius: 999px; padding: 5px 9px; }
    .ac-lvltag.mode { color: #ffd060; border-color: rgba(255,208,96,.5); }
    .ac-lvlgoals { display: flex; flex-direction: column; gap: 6px; }
    .ac-goal { display: flex; align-items: center; gap: 9px; font: 600 13px/1.3 Figtree, sans-serif; color: #b9c4dc; }
    .ac-goal.on { color: #fff; }
    .ac-goal.kept { color: #d7c9a0; }
    .ac-bigpips { display: flex; justify-content: center; gap: 10px; margin: 6px 0 2px; }
    .ac-bigpip { font-size: 34px; color: #2c3554; }
    .ac-bigpip.earned { color: #ffd060; text-shadow: 0 0 16px rgba(255,208,96,.7); }
    .ac-bigpip.kept { color: #a08b52; }
    .ac-menuhead { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 10px; }
    .ac-menuheadtext { min-width: 0; }
    .ac-menutitle { font-family: Fraunces, serif; font-weight: 800; font-size: 24px; line-height: 1.1; }
    .ac-menu .ac-kicker { color: #8b95b0; font-size: 9px; }
    .ac-menu .ac-sheet-scroll { padding: 0 16px 10px; }
    .ac-secthead { margin: 12px 0 8px; letter-spacing: .24em; }

    /* the equipped rig, pinned above the categories so the preview is
       never a mystery while you shop */
    .ac-rigtags { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .ac-tagpill { background: #141b30; border: 1px solid #2a3454; border-radius: 999px; padding: 4px 8px;
      font-size: 9px; font-weight: 700; letter-spacing: .08em; color: #98a2bd; }
    .ac-tagblue { background: rgba(74,180,255,.12); border-color: rgba(74,180,255,.4); color: #4ab4ff; }
    .ac-taggold { background: rgba(212,175,55,.12); border-color: rgba(212,175,55,.4); color: #d4af37; }

    /* GALAXY — the side menus' material */
    .ac-cats { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; padding: 12px 16px 10px; }
    .ac-cat { min-height: 36px; border-radius: 999px; background: #141b30; border: 1px solid #2a3454; color: #98a2bd;
      font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .ac-cat.on { color: #fff; font-weight: 800; border-color: transparent;
      background:
        radial-gradient(120% 180% at 18% -20%, rgba(116,150,255,.34), transparent 60%),
        linear-gradient(180deg, #6C5FB6, #463C86);
      box-shadow: inset 0 1px 0 rgba(206,214,255,.55); }

    .ac-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .ac-tile { background: #0c1224; border: 1px solid #2a3454; border-radius: 14px; padding: 10px 8px; text-align: center; }
    .ac-tilenum { font-size: 18px; font-weight: 800; }
    .ac-tilelabel { font-size: 9px; letter-spacing: .1em; color: #8b95b0; margin-top: 3px; }
    .ac-rows { background: #0c1224; border: 1px solid #2a3454; border-radius: 16px; padding: 2px 14px; margin-top: 8px; }
    .ac-rows .ac-row { align-items: center; padding: 11px 0; border-bottom: 1px solid #1a2238; font-size: 13px; font-weight: 700; width: 100%; }
    .ac-rowbtn { background: transparent; color: inherit; text-align: left; }
    .ac-rows .ac-row:last-child { border-bottom: 0; }
    .ac-rowbtn { background: transparent; color: #f3efe4; text-align: left; }
    .ac-rownote { font-weight: 400; }
    .ac-rowgold { color: #ffd76a; font-weight: 800; }
    .ac-switch { width: 42px; height: 25px; flex: none; border-radius: 999px; background: #1a2238; border: 1px solid #2a3454;
      display: flex; align-items: center; padding: 0 3px; }
    .ac-switch.on { border-color: transparent; justify-content: flex-end;
      background: radial-gradient(120% 180% at 18% -20%, rgba(116,150,255,.34), transparent 60%), linear-gradient(180deg, #6C5FB6, #463C86);
      box-shadow: inset 0 1px 0 rgba(206,214,255,.55); }
    .ac-knob { width: 19px; height: 19px; border-radius: 999px; background: #4d5674; }
    .ac-switch.on .ac-knob { background: #fff8ea; }
    .ac-idcard { display: flex; align-items: center; gap: 13px; background: linear-gradient(#0f1730, #0b1124);
      border: 1px solid #2a3454; border-radius: 16px; padding: 13px; }
    .ac-idface { width: 66px; height: 66px; flex: none; border-radius: 999px; border: 1px solid #2a3454;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 36%, #1b2547 0%, #0a1024 74%); }
    .ac-idface canvas { width: 58px; height: 58px; }
    .ac-idtxt { min-width: 0; }
    .ac-idname { font-size: 18px; font-weight: 800; }
    .ac-replay { width: 100%; margin: 12px 0 4px; }
    .ac-reset { width: 100%; margin: 10px 0 2px; }
    .ac-resetarmed { color: #ff8a8a; border-color: #a84444; }
    .ac-resetnote { margin-bottom: 72px; }
    /* PREMIUM. The gold border used to be !important, which meant a premium
       card could never also show the equipped ring - one state silently ate
       the other. The gold is now a hairline INSET, so the card's own border
       stays free for equipped and both can be true at once.
       --pg is the item's own glow, fed in from catalog.ts, so Cyber blooms
       magenta and Cryostar ice-blue rather than twenty identical gold cards. */
    .ac-premium { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55),
      inset 0 -18px 26px -18px var(--pg, #c9b6ff); }
    .ac-premium::after { content: "★"; position: absolute; top: 6px; right: 8px; color: #ffd76a; font-size: 12px; }
    /* an unowned premium card is dimmed, so :not(.ac-cardoff) is exactly
       "premium AND yours" - the lettering lifts only on what you actually own */
    .ac-premium:not(.ac-cardoff) { text-shadow: 0 0 7px color-mix(in srgb, var(--pg, #c9b6ff) 70%, transparent); }
    .ac-premium:not(.ac-cardoff).on { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55),
      inset 0 -18px 26px -18px var(--pg, #c9b6ff), 0 0 0 2px #A99BE8; }
    .ac-card { position: relative; }
    button { font: inherit; cursor: pointer; border: 0; }
    .ac-primary { background: #4ab4ff; color: #0c1224; border-radius: 16px; padding: 14px 16px; font-weight: 800; font-size: 18px; }
    .ac-ghost { background: #141b30; color: #f3efe4; border: 1px solid #2a3454; border-radius: 16px; padding: 12px 16px; font-weight: 700; }
    /* a suit that wears its own head closes the helmet shelf rather than
       offering picks that would change nothing you can see */
    .ac-cardoff { opacity: .34; filter: grayscale(.6); cursor: default; }

    /* the pack row: give the words the space, cap the faces */
    .ac-bundlestrip { flex-wrap: nowrap; max-width: 148px; overflow: hidden; }
    .ac-bundlestrip img, .ac-bundlestrip canvas { width: 34px; height: 34px; }


    /* GRID VIEW. The same groupings and the same headings - the rows simply
       stop scrolling and wrap, so a whole group is on screen at once
       instead of behind a swipe. One class flips the Loadout's shelves and
       the shop's PREVIEW alike, because both are built from ac-shelfrow. */
    .ac-viewrow { display: flex; justify-content: flex-end; margin: 2px 2px -2px; }
    .ac-viewseg { display: flex; gap: 2px; padding: 2px; border-radius: 10px;
      background: rgba(20,14,44,.72); border: 1px solid rgba(203,180,255,.22); }
    .ac-viewbtn { width: 30px; height: 26px; padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: #98a2bd; font-size: 14px; line-height: 1; }
    .ac-viewbtn.on { background: rgba(143,107,255,.35); color: #f0ebff; }
    .ac-asgrid .ac-shelfrow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
      overflow-x: visible; }
    .ac-asgrid .ac-shelfrow > .ac-card { flex: initial; min-width: 0; }
    .ac-asgrid .ac-shelfrow > .ac-card.ac-modcard { min-width: 0; }
    /* the PREVIEW cards are bigger, so they get three across rather than four */
    .ac-tostage ~ .ac-shelfrow, .ac-asgrid .ac-shelfrow > .ac-tocard { min-width: 0; }
    .ac-asgrid .ac-shelfrow:has(> .ac-tocard) { grid-template-columns: repeat(3, minmax(0,1fr)); }

    /* THE PAUSE SHEET CAN BE TALLER THAN THE PHONE. With the Spill settings
       open it runs well past a short screen, and .ac-sheet is a fixed-height flex
       column with overflow:hidden and justify-content:center — so it spilled
       off BOTH ends and RESUME went with it. You could read every dial and
       have no way to leave. .ac-result already solved exactly this; the pause
       sheet never got it. `safe center` centres while it fits and falls back
       to the top when it does not, instead of clipping symmetrically. */
    .ac-pausesheet { overflow-y: auto; justify-content: safe center;
      padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .ac-pausesheet > * { flex: none; }
    /* and the way out never scrolls away, whatever is above it */
    .ac-pauseact { position: sticky; bottom: 0; z-index: 3; width: 100%;
      display: grid; gap: 8px; margin-top: 4px;
      padding: 12px 0 max(2px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7,11,22,.97) 64%, rgba(7,11,22,0)); }
    body.ac-beta .ac-pauseact {
      background: linear-gradient(to top, rgba(16,8,36,.97) 64%, rgba(16,8,36,0)); }

    /* THE ROTATING SHELF. A pack whose contents the pilot part-owns shows
       what it costs THEM, with the sticker struck through beside it, so a
       discount reads as a discount rather than as an inconsistent price. */
    /* the sticker sits UNDER the price, not beside it: side by side it
       widened the price column enough to squeeze the blurb back into the
       five wrapped lines that were fixed two versions ago */
    .ac-wasprice { flex: 0 0 100%; margin: 1px 0 0; font-size: 10.5px;
      opacity: .5; text-decoration-thickness: 1px; line-height: 1.1; }

    /* the daily badge, the disc from the key art */
    .ac-dailybadge { flex: none; width: 46px; height: 46px;
      filter: drop-shadow(0 3px 9px rgba(120,80,220,.7)); }
    .ac-dailybadgebig { display: block; width: 96px; height: 96px; margin: 2px auto 0;
      filter: drop-shadow(0 5px 16px rgba(120,80,220,.85)); }
    /* THE BADGE TURNS. The disc is a 32-cell sprite sheet, 8 across and 4
       down. The sheet steps across the columns, the row it sits in steps
       down the rows, and this box crops a single cell - two nested boxes
       because one element carries one transform. Every offset is a
       percentage of the animated element's OWN size, so this one rule
       serves the 46px row badge and the 96px popup badge without knowing
       either number. 32 cells over 3.5s; the column leg is a quarter of
       that, which is what keeps the two legs in phase.

       The still disc is this box's own background. It is what shows while
       the sheet loads, if the sheet never arrives, and for a pilot whose
       system asked for less motion - so the badge is never missing. */
    .ac-dustbadge { position: relative; overflow: hidden;
      background-position: center; background-size: contain; background-repeat: no-repeat; }
    .ac-dustbadgerow { position: absolute; left: 0; top: 0; width: 100%; height: 400%;
      animation: ac-dustrow 3.5s steps(4) infinite; }
    .ac-dustbadgecells { position: absolute; left: 0; top: 0; width: 800%; height: 100%;
      background-position: left top; background-size: 100% 100%; background-repeat: no-repeat;
      animation: ac-dustcol .875s steps(8) infinite; }
    @keyframes ac-dustrow { to { transform: translateY(-100%); } }
    @keyframes ac-dustcol { to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { .ac-dustbadgerow { display: none; } }
    /* STAR DUST ON A PURPLE SHOP. The violet glyph sat on a violet sheet and
       all but vanished. It keeps its colour and gains a dark disc to sit on,
       so the contrast comes from the plate rather than from repainting the
       currency a colour it does not mean. */
    .ac-pill-dust svg, .ac-modprice.ac-dustprice svg, .ac-hub-iddust svg {
      background: rgba(6,4,18,.72); border-radius: 999px; padding: 1px;
      box-shadow: 0 0 0 1px rgba(203,180,255,.45); }
    .ac-dustface { background: radial-gradient(70% 70% at 50% 30%, rgba(90,60,180,.5), rgba(4,3,12,.92));
      border-color: rgba(203,180,255,.55); }


    /* the acorn counter, matched to the Star Dust pill */
    .ac-hub-idnut { display: inline-flex; align-items: center; gap: 5px; min-height: 30px;
      padding: 0 10px; border-radius: 999px; color: #ffdf9a;
      font: 800 12px/1 Figtree, sans-serif;
      background: rgba(120,90,20,.28); border: 1px solid rgba(255,206,92,.4); }
    .ac-hub-idnut svg { filter: drop-shadow(0 0 4px rgba(255,206,92,.6)); }
    /* a price, never a bare number: the gold tag from the currency sheet -
       the acorn and the count on one amber pill, dark text, so it reads as
       a price the moment the eye lands on it */
    .ac-costtag { display: inline-flex; align-items: center; gap: 4px; color: #2b1700;
      font: 800 11px/1 Figtree, sans-serif; padding: 3px 8px 3px 5px; border-radius: 999px;
      background: linear-gradient(180deg, #ffcd5a, #f29a1e);
      box-shadow: 0 1px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); }
    .ac-nutimg { flex: none; vertical-align: middle; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
    /* "Spend X acorns to unlock Y?" - the one sheet between a tap and a purse */
    .ac-spendsheet { align-items: center; padding: 18px; z-index: 40; }
    .ac-spendcard { width: min(380px, 100%); border-radius: 18px; border: 1px solid #3a4468;
      text-align: center; gap: 12px; padding-bottom: 18px; }
    .ac-spendask { margin: 0; color: #f3efe4; font: 700 17px/1.4 Figtree, sans-serif;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
    .ac-spendask b { color: #ffd76a; }
    .ac-spendbal { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 0; }
    .ac-spendrow { display: flex; gap: 10px; }
    .ac-spendrow > button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    /* STAR CHART BOOSTS: the owner's badges, in the shop, on the chart and in the profile */
    .ac-boostart { display: block; flex: none; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 10px rgba(255,206,92,.25); }
    .ac-boostcard .ac-boostart { width: 56px; height: 56px; }
    .ac-boostheld { color: #ffd76a; }
    .ac-card.ac-boostcard.ac-confirming { border-color: #e05a5a; }
    .ac-boostarm { display: flex; align-items: center; gap: 10px; margin: 0 16px 8px;
      padding: 8px 12px; border-radius: 14px; border: 1px solid rgba(255,206,92,.45);
      background: rgba(120,90,20,.28); color: #ffe6a8; }
    .ac-boostarm > span { display: flex; flex-direction: column; gap: 2px; font: 600 12px/1.3 Figtree, sans-serif; }
    .ac-boostarm b { font-size: 13px; letter-spacing: .04em; }
    .ac-skipbtn, .ac-unlockbtn, .ac-unlockgo { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .ac-boostnote { margin: -4px 0 0; }
    .ac-rewardsheet { text-align: center; align-items: center; }
    .ac-rewardbig { display: flex; justify-content: center; }
    .ac-rewardstate { color: #ffd76a; font-weight: 700; }
    .ac-rewardsheet > button { width: 100%; }
    .ac-invrow { align-items: center; gap: 10px; }
    .ac-invuse { flex: none; padding: 8px 12px; font-size: 12px; }
    /* An unclaimed free reward is an INVITATION, not a status line. It sits
       where the price would sit, wears the acorn gold so it reads as value,
       and breathes so a full shelf still shows you which card is waiting.
       It wraps rather than clipping - a 96px card is narrower than the
       words on a small phone. */
    .ac-collect { display: inline-block; max-width: 100%; text-align: center;
      white-space: normal; color: #241704; border-radius: 999px; padding: 2px 7px;
      background: linear-gradient(180deg, #ffeab0, #ffc94d);
      font: 800 9.5px/1.2 Figtree, sans-serif; letter-spacing: .02em;
      animation: acCollect 1.3s ease-in-out infinite; }
    @keyframes acCollect {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 201, 77, .5); }
      55% { transform: scale(1.06); box-shadow: 0 0 11px 2px rgba(255, 201, 77, .45); } }
    @media (prefers-reduced-motion: reduce) {
      .ac-collect { animation: none; box-shadow: 0 0 9px 1px rgba(255, 201, 77, .4); } }
    /* Active Effects, on the launch tile. The label is a <b>, and the tile
       sizes EVERY <b> at the FREE FLIGHT title size - same specificity as
       the old .ac-hub-active b, declared later, so it won. That is how a
       throwaway "in case you forgot" line ended up shouting at 21px next
       to the button's own name. Out-specify it and inherit the line's own
       type, so the tile's rule can never reach in here again. */
    .t-launch .ac-hub-active b { font: inherit; color: rgba(182,172,214,.92); }
    /* the live pilot stage in the Loadout */
    /* the shop banner icon was inheriting the hub tile's size and bursting
       out of a 60px row */
    .ac-shopbanneric svg, .ac-shopbanneric img, .ac-shopbanneric canvas {
      width: 30px; height: 30px; object-fit: contain; }
    /* the pack purchase, second tap */
    .ac-confirming { background: linear-gradient(180deg, #ffb0b0, #e05a5a); color: #2a0808; }
    /* the daily receipt popup */
    .ac-dailycard { text-align: center; }
    .ac-dailybig { display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 6px 0 2px; color: #cbb4ff;
      font: 900 34px/1 Figtree, sans-serif; text-shadow: 0 0 18px rgba(150,110,255,.8); }
    .ac-dailycard .ac-pips { justify-content: center; margin: 10px 0 4px; }
    /* mail mark */
    .ac-markmail { background: linear-gradient(180deg, #3a4b6e, #1b2540);
      border: 1px solid rgba(255,255,255,.14); }


    /* ---- what you just bought ---- */
    /* a swipeable strip, snapping so a card never ends up half off-screen */


    /* ---- the pilot names themselves ---- */
    .ac-idnamerow { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .ac-idnameedit { flex: none; width: 30px; height: 30px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center; color: #9aa6c4;
      background: rgba(255,255,255,.06); border: 1px solid #2a3454; }
    .ac-idnameinput { flex: 1; min-width: 0; width: 100%; min-height: 36px;
      padding: 4px 10px; border-radius: 10px; color: #f3efe4;
      font: 800 16px/1.2 Figtree, sans-serif;
      background: #0d1224; border: 1.5px solid #A99BE8; }
    .ac-idnameinput:focus { outline: none; box-shadow: 0 0 0 3px rgba(169,155,232,.28); }
    .ac-idnameok { flex: none; min-height: 36px; padding: 0 12px; border-radius: 10px;
      font: 900 11px/1 Figtree, sans-serif; letter-spacing: .1em; color: #241500;
      background: linear-gradient(180deg, #ffe08a, #e0a02a); border: 0; }


    /* What is switched on, on the launch tile: a footnote, not a headline.
       It exists so nobody launches wondering why the gravity is wrong -
       which needs it READABLE, not loud. Smaller and dimmer than the
       tile's own subtitle, so it sits under the button instead of
       competing with it. One line, never wraps. */
    .ac-hub-active { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 3px;
      font: 700 8.5px/1.3 Figtree, sans-serif; letter-spacing: .01em; color: rgba(124,235,194,.72);
      max-width: 100%; min-width: 0; }
    /* one chip per effect (owner, 7 Sep 2026: the line "scrunches up with
       too much text"). A chip never breaks inside; the ROW breaks between
       chips, and a chip longer than the tile is clipped with an ellipsis
       rather than pushing the tile's text off its left edge. */
    .ac-hub-fx { display: inline-block; max-width: 100%; padding: 1px 6px; border-radius: 8px;
      background: rgba(10,40,60,.45); border: 1px solid rgba(124,235,194,.22); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .t-launch .ac-hub-active b { letter-spacing: .12em; font-size: 8px; }
    /* the daily prompt: the shop button breathes until you visit */
    @keyframes ac-dailypulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(150,110,255,.55), 0 0 14px -2px rgba(150,110,255,.6); }
      50%     { box-shadow: 0 0 0 7px rgba(150,110,255,0), 0 0 22px 2px rgba(150,110,255,.95); }
    }
    .ac-hub-sq.ac-dailyready { animation: ac-dailypulse 1.9s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ac-hub-sq.ac-dailyready { animation: none;
        box-shadow: 0 0 0 2px rgba(150,110,255,.7), 0 0 16px -2px rgba(150,110,255,.8); }
    }
    /* the Star Dust counter beside acorns, with its plus */
    .ac-hub-iddust { display: inline-flex; align-items: center; gap: 5px; min-height: 30px;
      padding: 0 8px 0 9px; border-radius: 999px; color: #cbb4ff;
      font: 800 12px/1 Figtree, sans-serif;
      background: rgba(70,50,140,.35); border: 1px solid rgba(150,110,255,.42); }
    .ac-hub-iddust svg { filter: drop-shadow(0 0 4px rgba(150,110,255,.8)); }
    .ac-hub-plus { font-style: normal; font-weight: 900; font-size: 13px; color: #e6dbff;
      opacity: .85; margin-left: 1px; }
    /* the daily receipt, now that arriving claims it */
    .ac-dailygot { flex: none; display: inline-flex; align-items: center; gap: 5px;
      color: #cbb4ff; font: 900 15px/1 Figtree, sans-serif;
      text-shadow: 0 0 9px rgba(150,110,255,.8); }
    /* the hangar's way back to the shop: a control, not a caption */
    .ac-shopbanner { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
      width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 16px; text-align: left;
      min-height: 60px; color: #f3efe4;
      background: linear-gradient(100deg, rgba(109,63,209,.5), rgba(14,10,34,.6) 72%);
      border: 1.5px solid rgba(169,155,232,.55);
      box-shadow: 0 8px 22px -14px rgba(150,110,255,.9); }
    .ac-shopbanneric { flex: none; width: 34px; height: 34px; display: flex;
      align-items: center; justify-content: center; }
    .ac-shopbannertxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .ac-shopbannertxt b { font: 900 13px/1.1 Figtree, sans-serif; letter-spacing: .08em; }
    .ac-shopbannertxt span { font-size: 11px; color: #b6acd6; }
    .ac-shopbannergo { flex: none; font-size: 20px; font-weight: 800; color: #cbb4ff; }
    /* the pack contents sheet */


    /* ---- DEBRIS FIELDS: a line of rubble laid across the road ---- */
    .ac-debris { position: absolute; left: 0; height: 34px; transform: translateY(-50%);
      pointer-events: none; z-index: 2; }
    .ac-debrisbit { position: absolute; top: 50%; display: block; }
    .ac-debrisbit canvas { display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.7)); }
    .ac-debris.locked .ac-debrisbit canvas { filter: grayscale(1) brightness(.5); opacity: .5; }
    .ac-debris.done { opacity: .28; }
    /* the label rides the line and is the only part you can tap */
    .ac-debristag { position: absolute; transform: translate(-50%,-50%); z-index: 4;
      display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
      padding: 4px 11px 4px 5px; border-radius: 999px;
      background: rgba(8,12,26,.92); border: 1.5px solid #6d7ba8; }
    .ac-debristag b { font: 900 11px/1 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .08em; color: #9aa6c4; }
    .ac-debrisship { width: 26px; height: 26px; object-fit: contain; }
    .ac-debristag.blocking { border-color: #ffce5c;
      box-shadow: 0 0 0 3px rgba(255,206,92,.16), 0 0 18px -3px rgba(255,206,92,.6); }
    .ac-debristag.blocking b { color: #ffce5c; }
    .ac-debristag.done { border-color: #6ee7a8; }
    .ac-debristag.done b { color: #6ee7a8; }
    .ac-debristag.locked { opacity: .4; }
    .ac-gatenote b { color: #ffce5c; }
    .ac-gatecleared b { letter-spacing: .06em; }


    /* ---- PREVIEW: trying premium on before you buy the pack ---- */
    .ac-tocanvas { width: 300px; max-width: 100%; height: auto; display: block; }
    /* THE LEAN EDITOR. Sits under the loadout case, shut by default: it is
       an instrument you open on purpose, not a panel in the way of the suit
       you came to look at. Everything is >=44px so it works on a phone. */
    .ac-tonohelm { position: absolute; top: 8px; right: 10px;
      font: 800 9px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .1em;
      color: #8b95b0; background: rgba(8,12,26,.8); border-radius: 999px; padding: 4px 8px; }
    /* the shelves reuse the hangar's row, only narrower cards */
    .ac-tocard { min-height: 96px; min-width: 78px; }
    .ac-tocard.on { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55),
      inset 0 -18px 26px -18px var(--pg, #c9b6ff), 0 0 0 2px #A99BE8; }
    /* the stage animates continuously; hold it still for anyone who asked */
    @media (prefers-reduced-motion: reduce) { .ac-tocanvas { /* frames still paint, motion is inherent */ } }


    /* ---- Community: outward links from the Profile ---- */
    .ac-social { display: flex; align-items: center; gap: 11px; text-decoration: none;
      min-height: 52px; color: #f3efe4; }
    .ac-socialmark { flex: none; width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; background: linear-gradient(180deg, #6b7cf0, #4a58d8);
      box-shadow: 0 3px 10px -4px rgba(88,101,242,.9); }
    .ac-socialtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .ac-socialtxt b { font-size: 13px; font-weight: 800; letter-spacing: .04em; }
    .ac-socialtxt span { font-size: 11px; color: #8b95b0; }
    .ac-socialgo { flex: none; color: #8b95b0; font-size: 14px; font-weight: 800; }
    .ac-markx { background: linear-gradient(180deg, #2b2b32, #0b0b0f);
      border: 1px solid rgba(255,255,255,.16); box-shadow: 0 3px 10px -5px rgba(0,0,0,.9); }




    /* ---- STAR DUST: the premium currency ---- */
    /* violet, never gold. Gold is acorns everywhere else in this game, and
       two currencies that share a colour are one currency with two numbers. */
    .ac-pill-dust { color: #cbb4ff; }
    .ac-pill-dust svg { filter: drop-shadow(0 0 4px rgba(150,110,255,.75)); }
    /* TWO CLASSES, deliberately. .ac-modprice is declared 60 lines further
       down and paints gold, so at equal specificity it won and every Star
       Dust price rendered in the acorn colour - the same late-redeclaration
       trap that hid the Founder's Pack layout. */
    .ac-modprice.ac-dustprice { display: inline-flex; align-items: center; gap: 4px;
      color: #cbb4ff; text-shadow: 0 0 8px rgba(150,110,255,.75); }
    .ac-modprice.ac-dustprice svg { filter: drop-shadow(0 0 5px rgba(150,110,255,.9)); }
    .ac-dustface { display: flex; align-items: center; justify-content: center;
      width: 54px; height: 54px; flex: none; border-radius: 14px; color: #cbb4ff;
      background: radial-gradient(70% 70% at 50% 30%, rgba(120,86,220,.45), rgba(8,6,22,.7));
      border: 1px solid rgba(150,110,255,.4); }
    .ac-dustface svg { filter: drop-shadow(0 0 7px rgba(150,110,255,.85)); }

    /* ---- the daily claim ---- */
    .ac-daily { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px; padding: 12px 14px; border-radius: 16px; text-align: left;
      background: linear-gradient(100deg, rgba(86,60,170,.42), rgba(12,9,30,.55) 70%);
      border: 1px solid rgba(150,110,255,.42); }
    .ac-daily.done { opacity: .72; }
    .ac-dailytxt { flex: 1; min-width: 0; }
    /* THE STREAK'S PIPS ARE THE DAILY'S ALONE (audit, 8 Sep 2026). These
       round discs were declared unscoped, so they also repainted every
       GLYPH pip - the small gold stars on the Star Chart nodes, the level
       sheets and the run receipt (.ac-pips at :261-264) - as an 11px violet
       circle with the star hidden inside it. Both daily containers are
       named: the receipt sheet (.ac-dailycard) and the shop's streak row
       (.ac-daily). */
    .ac-daily .ac-pips, .ac-dailycard .ac-pips { display: flex; gap: 5px; margin: 7px 0 5px; }
    .ac-daily .ac-pip, .ac-dailycard .ac-pip { width: 11px; height: 11px; border-radius: 999px; display: block;

    /* WHILE A GUIDED STEP IS LIVE, ONLY THE STEP IS BRIGHT.
       Two other cards on the same shelf say COLLECT REWARD, which reads far
       more like the thing to press than the one the instruction sent you
       for. Dimming the rest is what stops them competing — the target keeps
       full colour and gets an arrow; everything else stays visible (you can
       still browse) but stops shouting. */
    /* `> button` would make this (0,2,1) and quietly outrank the un-dim
       below it at (0,2,0) - the target stayed dimmed with both rules
       matching. `> *` keeps them level so source order decides, which is
       what was intended. */
    /* A GUIDED STEP IS EXCLUSIVE. Dimming told the pilot where to look and
       then let them tap anything anyway - so the step could be walked past
       without being done, which is how a first-timer ends up equipped with
       the wrong thing and no idea why the coach is still nagging. Only the
       target answers a tap while a step is live.
       The two selectors are the SAME specificity (0,2,0), so the target
       rule wins on source order alone - it has to stay below this one. */
    .ac-guiding .ac-card, .ac-guiding .ac-shelfrow > * {
      opacity: .38; filter: saturate(.5); pointer-events: none; }
    .ac-guiding .ac-guidetarget { opacity: 1; filter: none; pointer-events: auto; }
    /* THE ARROW SITS INSIDE THE CARD. Above it is the obvious place and it
       does not work: the shelf is a horizontal scroller (overflow:auto), so
       anything drawn outside a card's own box is clipped away and the arrow
       simply never appeared. Inside the top edge, pointing down into the
       item, cannot be clipped by anything. */
    .ac-guidetarget { position: relative; z-index: 3;
      box-shadow: 0 0 0 2px #ffd782, 0 0 22px rgba(255,205,110,.55); }
    .ac-guidetarget::after {
      content: ""; position: absolute; left: 50%; top: 5px; transform: translateX(-50%);
      width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
      border-top: 12px solid #ffd782;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.85));
      animation: acGuideArrow 1.05s ease-in-out infinite; }
    @keyframes acGuideArrow { 0%,100% { top: 3px; } 50% { top: 9px; } }
    @media (prefers-reduced-motion: reduce) {
      .ac-guidetarget::after { animation: none; } }
    .ac-guideflash { box-shadow: 0 0 0 3px #ffd782, 0 0 26px rgba(255,205,110,.85) !important; }

      font: 700 11px/1.2 Figtree, sans-serif; letter-spacing: .08em;

    .ac-coach { position: absolute; left: 18px; right: 18px; bottom: 96px; z-index: 40;
      background: #1a2340; border: 1px solid #d4af37; border-radius: 14px; padding: 11px 14px;
      font-size: 12px; font-weight: 800; letter-spacing: .03em; color: #ffe9a8; text-align: center;
      box-shadow: 0 8px 26px rgba(0,0,0,.55); animation: acCoachIn .35s ease; pointer-events: none; }
    @keyframes acCoachIn { from { opacity: 0; transform: translateY(10px); } }
    /* THE COACH BECOMES A CONTROL, so it has to stop being a caption.
       The base .ac-coach is `pointer-events: none` and floats at
       bottom:96px - which is why tapping it did nothing, and why it kept
       landing on top of a card. Sticky puts it in the flow at the bottom of
       the shelf: always on screen, never over an item, and pressable. */
    .ac-coachfind { position: sticky; left: auto; right: auto; bottom: 10px;

    /* THE TARGET IS BELOW THE FOLD, and the coach says which way. Added

       "move down", and it is the one thing on a dimmed shelf that moves. */
    .ac-coachdown { padding-bottom: 22px; }

    @media (prefers-reduced-motion: reduce) {

    .ac-spilloption { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; min-height: 60px; padding: 12px; border: 1px solid #8656ba; border-radius: 16px; background: linear-gradient(145deg, rgba(23,12,46,.93), rgba(8,6,24,.88)); box-shadow: inset 0 0 0 1px #c386ff15, 0 0 7px #aa69ee22; color: #f9f4ff; text-align: left; font: 600 12px/1.4 Figtree,sans-serif; cursor: pointer; }

    .ac-spilloption.selected { border-color: var(--ac-choice-line); background: var(--ac-choice-fill); box-shadow: var(--ac-choice-ring); } .ac-spilloption:disabled { cursor: default; opacity: .5; }

    .ac-spillprep { position: absolute; bottom: max(18px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(450px,calc(100% - 28px)); max-height: 70%; overflow: auto; pointer-events: auto; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(180deg, #110b23, #090615); border: 1px solid #7951a7; border-radius: 18px; box-shadow: inset 0 1px 0 #d3a1ff22, 0 12px 60px #0008; }

    /* ================= THE HUB (v85) =================
       The home is a hub of saturated tiles over the purple key art.
       Sub-screens keep the galaxy chrome; only home wears this. */
    .ac-hub { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden;
      background: #120a2c; padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(12px + env(safe-area-inset-bottom)); }
    .ac-hub-art { position: absolute; inset: 0; background-size: cover; background-position: 50% 26%; filter: saturate(1.1); }
    .ac-hub-scrim { position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(16,7,38,.68) 0%, rgba(16,7,38,.12) 22%, rgba(16,7,38,.14) 60%, rgba(10,4,26,.82) 94%); }
    /* stack every hub child over the art with three same-specificity
       rules, last one wins: the art and scrim stay ABSOLUTE (the :not()
       fix in v87 accidentally out-specified them into zero-height
       relative divs — the vanished background), and the mode sheet stays
       FIXED so it overlays instead of rendering inline and clipped. */
    .ac-hub > * { position: relative; }
    .ac-hub > .ac-hub-art, .ac-hub > .ac-hub-scrim { position: absolute; }
    .ac-hub > .ac-lvlsheet { position: fixed; }
    .ac-hub-art, .ac-hub-scrim { position: absolute; }
    /* ONE bar for the whole top rail (owner's call): the capsule background

       inside carries its own slight pill so the spacing reads as one unit. */
    .ac-hub-rail { flex: none; display: flex; align-items: center; gap: 6px;
      background: linear-gradient(180deg, rgba(55,32,81,.96), rgba(19,11,40,.96));
      border: 1.5px solid rgba(220,178,102,.7); border-radius: 22px; padding: 5px 6px;

      border: 1px solid rgba(229,189,114,.65); display: flex; align-items: center; justify-content: center; color: #f6e5bc;
      box-shadow: inset 0 1px 1px rgba(255,232,183,.25), inset 0 -2px 3px rgba(5,2,13,.6), 0 3px 8px rgba(5,2,13,.35); }

      filter: drop-shadow(0 1px 3px rgba(225,166,78,.25)); }

    .ac-hub-wordmark { margin-top: 10px; text-align: center; }
    .ac-hub-title { font-family: Fraunces, serif; font-weight: 800; font-size: 40px; line-height: .95;

      filter: drop-shadow(0 3px 14px rgba(20,10,50,.9)); }
    .ac-hub-kicker { margin-top: 5px; font-size: 10px; font-weight: 800; letter-spacing: .18em; line-height: 1.45;
      text-transform: uppercase; text-wrap: balance;
      color: #c9b1ff; text-shadow: 0 1px 8px rgba(10,5,30,.9); }
    .ac-hub-space { flex: 1 1 auto; min-height: 60px; }
    .ac-hub-tiles { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .ac-hubtile { position: relative; border-radius: 20px; padding: 12px 8px 10px; display: flex; flex-direction: column;

    /* BIG TYPE ON BIG TILES (owner, 7 Sep 2026: "the buttons are big but

    .ac-hubtile b { font-size: 19px; font-weight: 900; letter-spacing: .05em; text-shadow: 0 2px 4px rgba(0,0,0,.55); }

      --t1: #2f8fe0; --t2: #123f80; --tb: #8fdaff;

    /* the mode tab on the launch tile: GOLD on the blue, so the selected

      background: linear-gradient(180deg,#ffe08a,#e9a62a); color: #2a1604; font-size: 10.5px; font-weight: 900; letter-spacing: .14em;
      padding: 4.5px 16px; border-radius: 8px; box-shadow: 0 3px 10px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,236,170,.55);
      clip-path: polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%); }
    /* THE STAR CHART BAR (owner, 7 Sep 2026): a major feature that read as
       one more strip. A gold rim on a violet plate, lit from behind. */
    .ac-hub-bar { margin-top: 12px; flex: none; display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
      background: linear-gradient(135deg, #4a279c 0%, #1e1140 48%, #5a2fb8 100%); border: 2px solid rgba(255,214,106,.8); border-radius: 18px; padding: 12px 14px;
      color: #fff3cf; box-shadow: 0 0 0 3px rgba(255,214,106,.14), 0 10px 28px rgba(0,0,0,.5), 0 0 26px rgba(184,118,255,.5), inset 0 1px 0 rgba(255,255,255,.2); }
    .ac-hub-bar .ac-hub-bartxt b { font-size: 13px; color: #ffe9a8; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
    .ac-hub-starbadge { width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #7a4a08; background: radial-gradient(circle at 50% 35%, #ffe9a8, #e8a44a);
      box-shadow: 0 0 18px rgba(255,206,92,.85); }
    .ac-hub-bartxt { flex: 1; min-width: 0; }
    .ac-hub-bartxt b { display: block; font-size: 11.5px; font-weight: 900; letter-spacing: .07em; }
    .ac-hub-track { position: relative; display: block; height: 14px; border-radius: 999px; background: #0b0618;
      border: 1px solid rgba(255,206,92,.35); overflow: hidden; margin-top: 4px; }
    .ac-hub-track i { display: block; height: 100%; background: linear-gradient(90deg, #c07f1f, #ffd76a); border-radius: 999px; }
    .ac-hub-track em { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal;
      font-size: 9.5px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); letter-spacing: .05em; }
    .ac-hubtile, .ac-hub-bar, .ac-hub-sq { transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease; }
    .ac-hub-sq:active, .ac-hub-bar:active { transform: translateY(1px);
      box-shadow: inset 0 2px 8px rgba(8,3,22,.6), 0 2px 7px rgba(0,0,0,.35); }

        box-shadow: inset 0 1px 1px rgba(255,238,197,.5), 0 0 0 1px rgba(230,184,103,.25), 0 0 20px rgba(177,113,230,.35), 0 8px 22px rgba(0,0,0,.4); }
    }

    /* ---- MODES: one saturated row per way to fly ---- */

      border: 1.5px solid var(--m1, #2a3454);
      box-shadow: 0 6px 18px -12px rgba(0,0,0,.9); }

    /* ---- the chapter map ---- */

    /* the last shelf must clear the preproduction bar pinned under it */

    .ac-featuresheet { max-height: 92vh; overflow-y: auto; }
    /* A SHEET THAT SCROLLS MUST NOT ALSO SQUASH. This is a flex column
       pinned at 92vh with overflow-y:auto - it is meant to scroll when the
       pack is tall. But flex items shrink by default, so instead of
       scrolling it COMPRESSED every shelf: rows went 128px -> 110px while
       the 118px cards inside kept their min-height and, being overflow
       visible, spilled over the heading beneath them. That is the overlap.
       Nothing in this sheet is meant to flex - every child is grow:0 - so
       nothing may shrink either, and the scroll does its job. */
    .ac-featuresheet > * { flex: none; }
    /* Capped + scrolling means SCROLL, never squash - see the pack sheet.
       Low specificity on purpose: a child that genuinely wants to flex can
       still say so with a class rule, which outranks this. */
    .ac-lvlcard.ac-racecard > *, .ac-packcard > *, .ac-modecard > * { flex: none; }

    /* the storefront is the first menu to be told about landscape */

      .ac-shopbeta .ac-sheet-scroll { padding-left: max(16px, calc(50% - 380px));
        padding-right: max(16px, calc(50% - 380px)); }

        padding-left: max(16px, calc(50% - 380px)); padding-right: max(16px, calc(50% - 380px)); }
      /* a 200px-tall stage eats a 430px-tall window, so the shelves are
         never reached. The canvas carries inline dimensions from
         miniCanvas, which is why these have to shout. */
      /* a case stretched to the full window leaves the pilot marooned in
         the middle of it, so the vitrine keeps its own proportions */
      .ac-shopbeta .ac-shopcase { max-width: 460px; margin-left: auto; margin-right: auto; }
      .ac-shopbeta .ac-casepane { padding: 4px 0 0; }
      .ac-shopbeta .ac-casecanvas { width: 236px !important; height: 162px !important; }

      .ac-shopbeta .ac-combobar { padding: 9px 12px; }
      /* THE LOADOUT BORROWED THE CASE AND NOT ITS LANDSCAPE MANNERS. Every
         rule above is scoped to .ac-shopbeta, so when the loadout adopted
         the same vitrine it inherited the portrait sizing and nothing else:
         header 66 + case 230 + pills 58 + toggle 32 left the item grid a
         TWENTY PIXEL window, and NONE of its sixteen cards could be
         reached. Measured at 932x430, then fixed.
         Stacking was the wrong shape anyway. Landscape is 932px WIDE and
         430 tall - the scarce axis is the one the case was eating. So the
         pilot moves BESIDE the grid instead of on top of it, which hands
         the whole remaining height back to the thing you came to shop. */
      .ac-menu:has(> .ac-hangarcase) {
        display: grid; grid-template-columns: 320px minmax(0, 1fr);
        column-gap: 12px; align-content: start; }

        grid-column: 1; grid-row: 2 / 99; align-self: start; margin: 0 0 0 12px; }
      .ac-hangarcase .ac-casepane { padding: 2px 0 0; }
      .ac-hangarcase .ac-casecanvas { width: 236px !important; height: 162px !important; }
      .ac-hangarcase .ac-caseplate b { font-size: 14px; }
    }

  outline: 2px solid #f3d38c; outline-offset: 5px; border-radius: 16px; }

/* PER-PAD IDENTITY ON TOP OF THAT BASE. The gradient, inset glow and radius
   above are left exactly as they are - these cards belong to the Loadout's
   family now, and only their IDENTITY comes from the pad. So the border, the
   outer glow and the input word take the colour of the pad the card
   describes, and the fill does not move. --pad-light and --pad-edge are set
   per card in flightControlCards from SPILL_CONTROL_COLORS, the same table
   spillControlArt paints the real pads with, so the two cannot drift apart.

   Both selectors are written as CHILDREN on purpose, measured out of a
   browser rather than assumed: a bare `.ac-spillhelp-pad` loses to
   `.ac-spillhelp-controls>div` at (0,1,1) and the card stays generic, and
   `.ac-spillhelp-pad b` merely TIES `.ac-spillhelp-controls b`, which would
   leave the word colour depending on source order.
   The flat fallback comes first for anything without color-mix. */
.ac-spillhelp-controls>.ac-spillhelp-pad{border-color:var(--pad-edge)}
@supports (background:color-mix(in srgb,#fff 10%,#000)){
  .ac-spillhelp-controls>.ac-spillhelp-pad{
    border-color:color-mix(in srgb,var(--pad-edge) 80%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pad-light) 14%,transparent),
               0 0 7px color-mix(in srgb,var(--pad-light) 18%,transparent)}
}

<body>
  <div id="app"></div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
    window.__ACORNAUT_ART__ = "./art";
  </script>
  <script type="module">
    // A CACHED index.html MUST NOT BE A DEAD PAGE. This file is the one
    // unversioned thing we ship, so a browser can be holding a copy of it
    // from an earlier release - and that copy names a js<VER> folder the
    // next release used to delete. On 2 Sep 2026 that is exactly how the
    // game stopped loading: cached HTML asking for a retired folder, 404,
    // blank screen. The tell was that a private window worked, because it
    // had no cached HTML.
    //
    // Two things stop it recurring. Releases now keep the last few
    // versioned folders (see export-sandbox.mjs), and this import falls
    // back to ./js, which is always the current build and is never
    // deleted. A stale page then loads today's code instead of nothing.
    import("./js279/standalone.js")
      .catch(() => import("./js/standalone.js"))
      .then((m) => m.bootStandalone(document.getElementById("app")));
  </script>
</body>
