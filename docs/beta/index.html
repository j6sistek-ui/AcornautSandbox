<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Acornaut · Beta</title>
  <meta name="description" content="Illustrated Acornaut rewrite. Fly the gaps. Grab the acorns." />
  <meta name="theme-color" content="#070b16" />
  <meta property="og:title" content="Acornaut" />
  <meta property="og:description" content="Fly the gaps. Grab the acorns." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://acornaut.app/" />
  <meta property="og:image" content="https://acornaut.app/art/menu-splash.jpg?v=145" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://acornaut.app/art/menu-splash.jpg?v=145" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="../icon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png?v=4" />
  <link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png?v=4" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=4" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" />
  <style>
    /* Long-press must never become a text selection: a held thrust in
       Hyper Run was painting the whole screen selection-blue on phones.
       The prefixed rules are what iOS Safari actually honours, and the
       touch-callout kill stops the copy/look-up bubble. Inputs opt back
       in so the access code can still be typed and pasted. */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070b16; color: #f3efe4; font-family: Figtree, system-ui, sans-serif; touch-action: none; user-select: none; }
    #app, .ac-root { width: 100%; height: 100%; display: flex; justify-content: center; }
    .ac-stage { position: relative; width: 100%; max-width: 480px; height: 100%; background: #0c1224; overflow: hidden; }
    .ac-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    /* WIDESCREEN MODE: the stage sheds the phone cap and menus take the
       whole screen — panels and art run full-bleed while the content
       holds a centred, readable column instead of stretching. */
    body.ac-wide .ac-stage { max-width: none; }
    body.ac-wide .ac-sheet { padding-left: max(18px, calc(50% - 360px)); padding-right: max(18px, calc(50% - 360px)); }
    body.ac-wide .ac-home-titlewrap,
    body.ac-wide .ac-controls { width: min(100%, 560px); margin-left: auto; margin-right: auto; }
    .ac-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; pointer-events: none; }
    .ac-overlay > * { pointer-events: auto; }
    .ac-sheet { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 20px 18px 18px; background: rgba(7,11,22,0.9); overflow: hidden; }
    .ac-center { align-items: center; justify-content: center; text-align: center; }
    .ac-result { overflow-y: auto; justify-content: safe center; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    @media (max-height: 540px) { .ac-result { justify-content: flex-start; } }
    .ac-head { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    h1 { font-family: Fraunces, serif; font-size: 42px; line-height: 0.95; }
    h2 { font-family: Fraunces, serif; font-size: 28px; }
    .ac-kicker { letter-spacing: .32em; text-transform: uppercase; color: #e8a44a; font-size: 11px; }
    .ac-sub, .ac-fine { color: #8b95b0; font-size: 12px; }
    .ac-fine { text-align: center; font-size: 10px; }
    .ac-gold { color: #e8a44a; font-weight: 700; }
    .ac-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .ac-chip { border: 1px solid rgba(232,164,74,.4); border-radius: 999px; padding: 6px 12px; color: #e8a44a; font-weight: 700; }
    .ac-hero { display: block; height: 32%; width: auto; max-width: 78%; margin: 8px auto; object-fit: contain; }
    /* ================= THE MENU SHELL =================
       Five tabs on one bar, every tab its own full screen. Two button
       materials: HELMET GLASS on the home screen (the visor off the
       suit, so the launch button belongs to the art) and GALAXY on the
       side menus. Gold is reserved for what you EARN — acorn counts,
       prices, the Flight Log's rungs and its XP bar.            */

    /* --- 1 · the cold open: loading --- */
    .ac-boot { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
      background: radial-gradient(120% 62% at 50% 42%, #16123a 0%, #0a0620 52%, #05020e 100%); }
    .ac-bootnut { position: relative; width: 150px; height: 150px; }
    /* the drained shell, waiting to be filled */
    .ac-bootshell { position: absolute; inset: 0; width: 150px; height: 150px; object-fit: contain;
      filter: grayscale(1) brightness(.8) contrast(.75); opacity: .44; }
    /* THIS BOX'S HEIGHT IS THE PROGRESS VALUE. It is masked by the
       acorn's own alpha so the waterline stops at the shell instead of
       running off as a rectangle. */
    .ac-bootfill { position: absolute; left: 0; bottom: 0; width: 150px; height: 8%; overflow: hidden;
      transition: height .28s ease;
      -webkit-mask-image: var(--nut); mask-image: var(--nut);
      -webkit-mask-size: 150px 150px; mask-size: 150px 150px;
      -webkit-mask-position: center bottom; mask-position: center bottom;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .ac-bootfill img { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; object-fit: contain; }
    .ac-bootline { position: absolute; left: 0; right: 0; top: 0; height: 26px;
      background: linear-gradient(rgba(255,230,163,.45), transparent); border-top: 2px solid #fff2cf; }
    .ac-boottitle { margin-top: 14px; font-family: Fraunces, serif; font-weight: 800; font-size: 40px; line-height: .95;
      background: linear-gradient(#ffe6a3 12%, #e8a44a 54%, #a86a1f 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ac-bootsub { margin-top: 9px; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; color: #8b95b0; }
    .ac-bootfine { position: absolute; left: 0; right: 0; bottom: 22px; }

    /* --- 2 · tap to start. The tap also unlocks audio. --- */
    .ac-splash { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
      background-color: #05020e; background-size: cover; background-position: center; cursor: pointer; overflow: hidden; }
    .ac-splash-ink { position: absolute; left: 0; right: 0; bottom: 0; height: 54%;
      background: linear-gradient(transparent, rgba(5,2,14,.55) 42%, rgba(5,2,14,.9) 78%, #05020e 100%); }
    .ac-splash-stack { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px 92px; }
    .ac-splash-title { font-family: Fraunces, serif; font-weight: 800; font-size: 51px; line-height: .92; color: #fff;
      text-shadow: 0 3px 22px rgba(5,2,14,.9), 0 0 44px rgba(120,150,220,.35); }
    .ac-splash-tap { display: flex; align-items: center; gap: 9px; margin-top: 18px; color: #ffd76a;
      animation: ac-tappulse 1.9s ease-in-out infinite; }
    .ac-splash-tap span { font-size: 13px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #fff;
      text-shadow: 0 1px 10px rgba(5,2,14,.95); }
    .ac-splash-fine { position: relative; padding-bottom: 22px; }
    @keyframes ac-tappulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    /* --- 2b · the launch film. Runs once between the tap and the menu,
       then holds its last frame and dissolves into the home plate, which
       is that same frame painted larger. The dissolve is what hides the
       seam: the film is 1088x1920 and the plate 1206x2622, so their cover
       crops do not land on identical pixels. --- */
    .ac-filmhost { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
    .ac-filmhost > * { pointer-events: auto; }
    .ac-film { position: absolute; inset: 0; background: #05020e; cursor: pointer; z-index: 40; }
    .ac-film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ac-film.out { opacity: 0; transition: opacity .38s ease; pointer-events: none; }
    .ac-filmskip { position: absolute; right: 14px; bottom: 18px; z-index: 2;
      background: rgba(10,16,32,.6); border: 1px solid rgba(150,166,200,.3); color: #cdd6ea;
      border-radius: 999px; padding: 7px 15px; font: 700 10px/1 Figtree, system-ui, sans-serif;
      letter-spacing: .18em; opacity: 0; transition: opacity .4s ease .7s; }
    .ac-film.ready .ac-filmskip { opacity: 1; }

    /* --- 3 · HOME --- */
    .ac-home { position: relative; height: 100%; display: flex; flex-direction: column; background: #05020e; overflow: hidden; }
    /* full-bleed, like the film that dissolves into it: the plate is a
       whole-phone composition and the old 74% band cropped the pilot's
       head up under the wordmark */
    .ac-home-art { position: absolute; left: 0; top: 0; right: 0; height: 100%;
      background-size: cover; background-position: 50% 31%;
      -webkit-mask-image: linear-gradient(#000 0%, #000 58%, rgba(0,0,0,.35) 84%, transparent 100%);
      mask-image: linear-gradient(#000 0%, #000 58%, rgba(0,0,0,.35) 84%, transparent 100%); }
    /* a touch of ink so the pills and wordmark hold on any frame */
    .ac-home-scrim { position: absolute; left: 0; right: 0; top: 0; height: 26%;
      background: linear-gradient(rgba(5,2,14,.74), rgba(5,2,14,.3) 55%, transparent); }
    .ac-home-pills { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 0; }
    .ac-pill { display: flex; align-items: center; gap: 6px; background: rgba(10,16,32,.72);
      border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 800; color: #fff; }
    .ac-pill-gold { color: #ffdf9a; }
    .ac-pill-key { font-size: 9px; font-weight: 800; letter-spacing: .14em; color: #8b95b0; }
    .ac-pill-num { font-size: 13px; font-weight: 800; }
    .ac-home-titlewrap { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
    .ac-home-title { font-family: Fraunces, serif; font-weight: 800; font-size: 46px; line-height: .92; color: #fff;
      text-shadow: 0 2px 16px rgba(5,2,14,.85), 0 0 34px rgba(120,150,220,.35); }
    .ac-home-kicker { margin-top: 6px; font-size: 10px; letter-spacing: .34em; text-transform: uppercase;
      color: rgba(255,255,255,.72); text-shadow: 0 1px 8px rgba(5,2,14,.9); }
    .ac-home-gap { flex: 1 1 auto; min-height: 0; }
    .ac-controls { position: relative; flex: none; display: flex; flex-direction: column; gap: 9px; padding: 0 18px 10px; }

    /* the second door into the Hangar */
    .ac-loadstrip { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
      background: rgba(20,27,48,.82); border: 1px solid #2a3454; border-radius: 16px; min-height: 56px; padding: 0 13px; color: #f3efe4; }
    .ac-loadport { width: 40px; height: 40px; flex: none; border-radius: 11px; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #1b2547 0%, #0a1024 74%); }
    .ac-loadport canvas { width: 38px; height: 38px; }
    .ac-loadtxt { flex: 1 1 auto; min-width: 0; }
    .ac-loadname { font-size: 13px; font-weight: 700; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* HELMET GLASS — home only */
    .ac-launch { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      border-radius: 16px; min-height: 60px; font-family: Fraunces, serif; font-weight: 800; font-size: 23px; color: #17203A;
      background:
        radial-gradient(72% 120% at 22% -14%, rgba(255,255,255,.99), transparent 62%),
        linear-gradient(196deg, #F4F8FF 0%, #DDE8F8 32%, #B9CCE6 66%, #D8E5F6 100%);
      box-shadow: 0 8px 22px rgba(120,152,196,.34), inset 0 1px 0 rgba(255,255,255,1), inset 0 -2px 0 rgba(116,148,190,.5);
      transition: transform .08s ease, filter .08s ease; }
    .ac-launch:active { transform: translateY(1px) scale(.99); filter: brightness(.96); }
    .ac-mode { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; }
    .ac-modeneed { display: block; font-size: 8px; font-weight: 700; letter-spacing: .03em; color: #ffd76a; opacity: .9; white-space: nowrap; }
    .ac-modes { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px;
      background: rgba(16,22,42,.9); border: 1px solid #2a3454; border-radius: 14px; padding: 4px; }
    .ac-mode { min-height: 44px; border-radius: 10px; background: transparent; color: #98a2bd; font-size: 10px;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .ac-mode.on { color: #17203A; font-weight: 800;
      background: linear-gradient(196deg, #F4F8FF, #C4D5EC); box-shadow: inset 0 1px 0 rgba(255,255,255,1); }

    /* --- the tab bar, on every menu --- */
    .ac-tabbar { position: relative; flex: none; display: grid; grid-template-columns: repeat(5, minmax(0,1fr));
      align-items: end; background: #0a1020; border-top: 1px solid #1a2238; padding: 7px 6px 9px; }
    .ac-tab5 { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 2px;
      background: transparent; color: #7d879f; }
    .ac-tab5 span { font-size: 9px; font-weight: 700; letter-spacing: .06em; }
    .ac-tab5.on { color: #A99BE8; }
    .ac-tab5.on span { font-weight: 800; }
    /* HOME is the raised dome: the biggest target, and glass on EVERY
       screen because it is the home button — the white is its identity,
       not the current screen's colour. */
    .ac-dome { justify-self: center; width: 66px; height: 66px; margin-top: -32px; border-radius: 999px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: #17203A;
      border: 3px solid #0a1020;
      background:
        radial-gradient(66% 110% at 26% -6%, rgba(255,255,255,1), transparent 60%),
        linear-gradient(196deg, #F4F8FF 0%, #DDE8F8 34%, #B9CCE6 100%);
      box-shadow: 0 8px 22px rgba(120,152,196,.4), inset 0 -2px 0 rgba(116,148,190,.45);
      transition: transform .08s ease; }
    .ac-dome span { font-size: 8px; font-weight: 800; letter-spacing: .1em; margin-top: -1px; }
    .ac-dome:active { transform: scale(.95); }

    /* --- the four side menus --- */
    .ac-menu { display: flex; flex-direction: column; height: 100%; background: #070b16; overflow: hidden; }

    /* Help left the tab bar for the "?" every other game puts in a corner.
       44px so it clears the touch-target floor on a phone. */
    .ac-helpdot { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center;
      background: rgba(10,16,32,.72); border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
      color: #cfd8ea; cursor: pointer; }
    .ac-helpdot:active { transform: scale(.94); }
    .ac-home-pillgroup { display: flex; align-items: center; gap: 7px; }
    .ac-headaside { display: flex; align-items: center; gap: 8px; flex: none; }

    /* a mod or bundle card is a row, not a tile: it has to carry a
       sentence of explanation that a 3-up grid cannot hold */
    .ac-card.ac-bundle { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 12px; text-align: left; position: relative; }
    .ac-bundlestrip { display: flex; align-items: center; gap: 4px; }
    .ac-bundlestrip img, .ac-bundlestrip canvas { width: 40px; height: 40px; }
    .ac-bundlemore { font-size: 11px; font-weight: 800; color: #8b95b0; }
    .ac-bundlecount { position: absolute; right: 12px; bottom: 8px; font-size: 9px;
      letter-spacing: .14em; color: #6f7ba0; }
    .ac-lab { margin-top: 8px; border-style: dashed; color: #9aa6c4; }
    .ac-labnote { text-align: center; margin-top: 6px; color: #5d6885; }

    /* ---- star chart ---- */
    .ac-pips { display: inline-flex; gap: 2px; }
    .ac-pip { color: #3a4468; font-size: 13px; line-height: 1; }
    .ac-pip.on { color: #ffd060; text-shadow: 0 0 8px rgba(255,208,96,.55); }
    .ac-pips.sm .ac-pip { font-size: 10px; }
    .ac-stagecard { border: 1px solid #2a3454; border-radius: 16px; margin: 10px 0; background: rgba(12,18,36,.55); overflow: hidden; }
    .ac-stagecard.locked { opacity: .55; }
    .ac-stagehead { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; background: none; border: 0; color: inherit; padding: 12px 14px; text-align: left; }
    .ac-stagetitle { display: flex; flex-direction: column; gap: 2px; }
    .ac-stagename { font: 800 14px/1.1 Figtree, sans-serif; letter-spacing: .06em; }
    .ac-stagestars { font: 700 11px/1 Figtree, sans-serif; color: #ffd060; white-space: nowrap; }
    .ac-stagelock { font: 700 10px/1 Figtree, sans-serif; color: #7c8bb0; letter-spacing: .08em; white-space: nowrap; }
    .ac-stagetag { margin: 0 14px 8px; }
    .ac-lvlgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 12px 12px; }
    .ac-lvlbtn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border: 1px solid #2a3454; border-radius: 12px; background: rgba(20,28,52,.7); color: inherit; }
    .ac-lvlbtn.locked { opacity: .35; pointer-events: none; }
    .ac-lvlnum { font: 800 15px/1 Figtree, sans-serif; }
    .ac-lvlsheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(5,8,18,.72); }
    .ac-lvlcard { width: 100%; border-radius: 18px 18px 0 0; border-top: 1px solid #3a4468; background: #101830; padding: 18px 18px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
    .ac-lvlcard.ac-racecard { width: min(760px, 100%); max-height: min(94vh, 820px); margin-inline: auto; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .ac-racebrief { display: grid; gap: 10px; }
    .ac-racebriefblock { border: 1px solid rgba(170,140,240,.28); border-radius: 14px; padding: 12px 13px; background: rgba(8,13,31,.38); }
    .ac-racebriefblock h3 { margin: 0 0 8px; font: 900 14px/1 Figtree, sans-serif; letter-spacing: .12em; color: #ffe086; }
    .ac-racebriefblock p { margin: 0; color: #d7def0; font: 600 14px/1.45 Figtree, sans-serif; }
    .ac-racecontrols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ac-racecontrol { display: grid; grid-template-columns: minmax(118px, .9fr) 1.1fr; gap: 10px; align-items: baseline; padding: 5px 0; color: #d7def0; font: 600 14px/1.3 Figtree, sans-serif; }
    .ac-racecontrol + .ac-racecontrol { border-top: 1px solid rgba(170,140,240,.13); }
    .ac-racecontrol b { color: #a9f5ff; font-size: 14px; letter-spacing: .035em; }
    @media (max-width: 619px), (max-height: 699px) {
      .ac-lvlcard.ac-racecard { max-height: 96vh; gap: 8px; padding-top: 14px; }
      .ac-racecontrols { grid-template-columns: 1fr; }
      .ac-racebriefblock { padding: 10px 12px; }
      .ac-racebriefblock p, .ac-racecontrol { font-size: 14px; }
    }
    .ac-lvlname { font-family: Fraunces, Georgia, serif; font-size: 26px; margin: 0; }
    .ac-lvltags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ac-lvltag { font: 800 9px/1 Figtree, sans-serif; letter-spacing: .1em; color: #9fb0d0; border: 1px solid #3a4468; border-radius: 999px; padding: 5px 9px; }
    .ac-lvltag.mode { color: #ffd060; border-color: rgba(255,208,96,.5); }
    .ac-lvlgoals { display: flex; flex-direction: column; gap: 6px; }
    .ac-goal { display: flex; align-items: center; gap: 9px; font: 600 13px/1.3 Figtree, sans-serif; color: #b9c4dc; }
    .ac-goal.on { color: #fff; }
    .ac-goal.kept { color: #d7c9a0; }
    .ac-bigpips { display: flex; justify-content: center; gap: 10px; margin: 6px 0 2px; }
    .ac-bigpip { font-size: 34px; color: #2c3554; }
    .ac-bigpip.earned { color: #ffd060; text-shadow: 0 0 16px rgba(255,208,96,.7); }
    .ac-bigpip.kept { color: #a08b52; }
    .ac-modlock { grid-column: 1 / -1; margin: 2px 0 8px; line-height: 1.45; }
    .ac-menuhead { flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 16px 16px 10px; }
    .ac-menuheadtext { min-width: 0; }
    .ac-menutitle { font-family: Fraunces, serif; font-weight: 800; font-size: 24px; line-height: 1.1; }
    .ac-menu .ac-kicker { color: #8b95b0; font-size: 9px; }
    .ac-menu .ac-sheet-scroll { padding: 0 16px 10px; }
    .ac-secthead { margin: 12px 0 8px; letter-spacing: .24em; }

    /* the equipped rig, pinned above the categories so the preview is
       never a mystery while you shop */
    .ac-rig { flex: none; display: flex; align-items: center; gap: 14px; margin: 0 16px;
      background: linear-gradient(#0f1730, #0b1124); border: 1px solid #2a3454; border-radius: 16px; padding: 12px 14px; }
    .ac-rigart { width: 116px; height: 116px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #1b2547 0%, #0a1024 72%); }
    .ac-rigart canvas { width: 100px; height: 100px; }
    .ac-rigtxt { flex: 1 1 auto; min-width: 0; }
    .ac-rigname { font-size: 16px; font-weight: 800; }
    .ac-rigtags { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
    .ac-tagpill { background: #141b30; border: 1px solid #2a3454; border-radius: 999px; padding: 4px 8px;

    /* PREMIUM. The gold border used to be !important, which meant a premium
       card could never also show the equipped ring - one state silently ate
       the other. The gold is now a hairline INSET, so the card's own border
       stays free for equipped and both can be true at once.
       --pg is the item's own glow, fed in from catalog.ts, so Cyber blooms
       magenta and Cryostar ice-blue rather than twenty identical gold cards. */
    .ac-premium { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55),
      inset 0 -18px 26px -18px var(--pg, #c9b6ff); }
    .ac-premium::after { content: "★"; position: absolute; top: 6px; right: 8px; color: #ffd76a; font-size: 12px; }
    /* an unowned premium card is dimmed, so :not(.ac-cardoff) is exactly

    .ac-premium:not(.ac-cardoff) { text-shadow: 0 0 7px color-mix(in srgb, var(--pg, #c9b6ff) 70%, transparent); }
    .ac-premium:not(.ac-cardoff).on { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55),
      inset 0 -18px 26px -18px var(--pg, #c9b6ff), 0 0 0 2px #A99BE8; }

    .ac-viewrow { display: flex; justify-content: flex-end; margin: 2px 2px -2px; }

      overflow-x: visible; }

    .ac-asgrid .ac-shelfrow:has(> .ac-tocard) { grid-template-columns: repeat(3, minmax(0,1fr)); }

    /* THE CALIBRATION PANEL, in the Wormhole Run pause menu. Dense on
       purpose: seven dials have to fit above RESUME on a phone without the
       sheet scrolling away from the button that gets you back to the run. */
    /* the three Wormhole controls, flown back to back */
      text-align: left; padding: 9px 12px; border-radius: 12px; color: #d7def0;
      background: rgba(12,18,38,.6); border: 1px solid #2a3454; }
      grid-template-areas: "label label label label label" "minus slide slide plus val";
      align-items: center; gap: 6px; }
      justify-content: flex-start; }
      font-size: 12.5px; opacity: .7; }
      border: 1px solid rgba(203,180,255,.35); background: rgba(20,14,44,.8);
      color: #e8e2ff; font-size: 15px; line-height: 1; }
    /* THE PAUSE SHEET CAN BE TALLER THAN THE PHONE. With the calibration
       panel open it runs to ~943px, and .ac-sheet is a fixed-height flex
       column with overflow:hidden and justify-content:center — so it spilled
       off BOTH ends and RESUME went with it. You could read every dial and
       have no way to leave. .ac-result already solved exactly this; the pause
       sheet never got it. `safe center` centres while it fits and falls back
       to the top when it does not, instead of clipping symmetrically. */
    .ac-pausesheet { overflow-y: auto; justify-content: safe center;
      padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .ac-pausesheet > * { flex: none; }
    /* and the way out never scrolls away, whatever is above it */
    .ac-pauseact { position: sticky; bottom: 0; z-index: 3; width: 100%;
      display: grid; gap: 8px; margin-top: 4px;
      padding: 12px 0 max(2px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(7,11,22,.97) 64%, rgba(7,11,22,0)); }
    body.ac-beta .ac-pauseact {
      background: linear-gradient(to top, rgba(16,8,36,.97) 64%, rgba(16,8,36,0)); }

    /* THE TUNING RIG. The dials, on screen, while the corridor is moving —
       because the pause menu is the one place they cannot do their job.
       Docked to a corner rather than centred: the corridor is the thing
       being judged and it uses the full height, so the rig takes a column
       and leaves the flight visible beside it. Collapsing gives back a
       clear screen for flying the setting by hand. */
      width: min(268px, calc(100% - 16px)); max-height: calc(100% - 76px);
      display: flex; flex-direction: column; overflow: auto;
      padding: 9px 11px 10px; border-radius: 14px; color: #e9edf8;
      background: rgba(8,12,26,.82); border: 1px solid #2a3454;
      -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
      box-shadow: 0 10px 30px -14px rgba(0,0,0,.9);
      transition: opacity .12s ease; }
    /* THE RIG STEPS ASIDE WHILE YOU TURN A DIAL. In portrait it has to cover
       corridor - there is nowhere else for it to be - and the one moment
       that matters is the moment the dial is moving. So it fades under the
       finger and comes back on release: you see the change you are making,
       where it is happening, without letting go. */
      font: 600 10.5px/1.2 Figtree, sans-serif; color: #94a0bd;
      font-variant-numeric: tabular-nums; }
      border: 1px solid rgba(203,180,255,.35); background: rgba(20,14,44,.8);
      color: #e8e2ff; font-size: 15px; line-height: 1; }
      text-align: center; }
    /* live rows are one line each: name, slider, number — there is no room

      grid-template-areas: "name slide val"; gap: 8px; }
    @media (orientation: portrait) {
    }

    .ac-wasprice { flex: 0 0 100%; margin: 1px 0 0; font-size: 10.5px;

    /* the daily badge, the disc from the key art */
    .ac-dailybadge { flex: none; width: 46px; height: 46px;
      filter: drop-shadow(0 3px 9px rgba(120,80,220,.7)); }
    .ac-dailybadgebig { display: block; width: 96px; height: 96px; margin: 2px auto 0;
      filter: drop-shadow(0 5px 16px rgba(120,80,220,.85)); }
    /* THE BADGE TURNS. The disc is a 32-cell sprite sheet, 8 across and 4
       down. The sheet steps across the columns, the row it sits in steps
       down the rows, and this box crops a single cell - two nested boxes
       because one element carries one transform. Every offset is a
       percentage of the animated element's OWN size, so this one rule
       serves the 46px row badge and the 96px popup badge without knowing
       either number. 32 cells over 3.5s; the column leg is a quarter of
       that, which is what keeps the two legs in phase.

       The still disc is this box's own background. It is what shows while
       the sheet loads, if the sheet never arrives, and for a pilot whose
       system asked for less motion - so the badge is never missing. */
    .ac-dustbadge { position: relative; overflow: hidden;
      background-position: center; background-size: contain; background-repeat: no-repeat; }
    .ac-dustbadgerow { position: absolute; left: 0; top: 0; width: 100%; height: 400%;
      animation: ac-dustrow 3.5s steps(4) infinite; }
    .ac-dustbadgecells { position: absolute; left: 0; top: 0; width: 800%; height: 100%;
      background-position: left top; background-size: 100% 100%; background-repeat: no-repeat;
      animation: ac-dustcol .875s steps(8) infinite; }
    @keyframes ac-dustrow { to { transform: translateY(-100%); } }
    @keyframes ac-dustcol { to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { .ac-dustbadgerow { display: none; } }
    /* STAR DUST ON A PURPLE SHOP. The violet glyph sat on a violet sheet and

    .ac-pill-dust svg, .ac-modprice.ac-dustprice svg, .ac-hub-iddust svg {

      border-color: rgba(203,180,255,.55); }

    /* WHILE A GUIDED STEP IS LIVE, ONLY THE STEP IS BRIGHT.
       Two other cards on the same shelf say COLLECT REWARD, which reads far
       more like the thing to press than the one the instruction sent you
       for. Dimming the rest is what stops them competing — the target keeps
       full colour and gets an arrow; everything else stays visible (you can
       still browse) but stops shouting. */
    /* `> button` would make this (0,2,1) and quietly outrank the un-dim
       below it at (0,2,0) - the target stayed dimmed with both rules
       matching. `> *` keeps them level so source order decides, which is
       what was intended. */
    /* A GUIDED STEP IS EXCLUSIVE. Dimming told the pilot where to look and
       then let them tap anything anyway - so the step could be walked past
       without being done, which is how a first-timer ends up equipped with
       the wrong thing and no idea why the coach is still nagging. Only the
       target answers a tap while a step is live.
       The two selectors are the SAME specificity (0,2,0), so the target
       rule wins on source order alone - it has to stay below this one. */
    .ac-guiding .ac-card, .ac-guiding .ac-shelfrow > * {
      opacity: .38; filter: saturate(.5); pointer-events: none; }
    .ac-guiding .ac-guidetarget { opacity: 1; filter: none; pointer-events: auto; }
    /* THE ARROW SITS INSIDE THE CARD. Above it is the obvious place and it
       does not work: the shelf is a horizontal scroller (overflow:auto), so
       anything drawn outside a card's own box is clipped away and the arrow
       simply never appeared. Inside the top edge, pointing down into the
       item, cannot be clipped by anything. */
    .ac-guidetarget { position: relative; z-index: 3;
      box-shadow: 0 0 0 2px #ffd782, 0 0 22px rgba(255,205,110,.55); }
    .ac-guidetarget::after {
      content: ""; position: absolute; left: 50%; top: 5px; transform: translateX(-50%);
      width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent;
      border-top: 12px solid #ffd782;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.85));
      animation: acGuideArrow 1.05s ease-in-out infinite; }
    @keyframes acGuideArrow { 0%,100% { top: 3px; } 50% { top: 9px; } }
    @media (prefers-reduced-motion: reduce) {
      .ac-guidetarget::after { animation: none; } }
    .ac-guideflash { box-shadow: 0 0 0 3px #ffd782, 0 0 26px rgba(255,205,110,.85) !important; }
    .ac-coachfind .ac-coachhint { display: block; font-style: normal; margin-top: 3px;
      font: 700 11px/1.2 Figtree, sans-serif; letter-spacing: .08em;
      text-transform: uppercase; color: #ffd782; opacity: .95; }
    .ac-coach { position: absolute; left: 18px; right: 18px; bottom: 96px; z-index: 40;
      background: #1a2340; border: 1px solid #d4af37; border-radius: 14px; padding: 11px 14px;
      font-size: 12px; font-weight: 800; letter-spacing: .03em; color: #ffe9a8; text-align: center;
      box-shadow: 0 8px 26px rgba(0,0,0,.55); animation: acCoachIn .35s ease; pointer-events: none; }
    @keyframes acCoachIn { from { opacity: 0; transform: translateY(10px); } }
    /* THE COACH BECOMES A CONTROL, so it has to stop being a caption.
       The base .ac-coach is `pointer-events: none` and floats at
       bottom:96px - which is why tapping it did nothing, and why it kept
       landing on top of a card. Sticky puts it in the flow at the bottom of
       the shelf: always on screen, never over an item, and pressable. */
    .ac-coachfind { position: sticky; left: auto; right: auto; bottom: 10px;
      z-index: 60; pointer-events: auto; cursor: pointer;
      margin: 14px 0 4px; animation: none;

    /* THE TARGET IS BELOW THE FOLD, and the coach says which way. Added
       only when the card has been MEASURED off screen - see drawLoadout.
       The arrow travels rather than blinking, because the instruction is
       "move down", and it is the one thing on a dimmed shelf that moves. */
    .ac-coachdown { padding-bottom: 22px; }
    .ac-coachdown::after { content: "\2193"; position: absolute; left: 50%;

    @keyframes acCoachDown { 0%, 100% { transform: translate(-50%, 0); opacity: .55; }
      55% { transform: translate(-50%, 6px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ac-coachdown::after { animation: none; opacity: 1; } }

    .ac-roaditem::before { content: ""; position: absolute; left: -25px; top: 50%; width: 10px; height: 10px; background: #2a3454; transform: translateY(-50%) rotate(45deg); border-radius: 2px; }

    .ac-xpbar { width: 100%; max-width: 260px; height: 10px; border-radius: 999px; background: #141b30; border: 1px solid #2a3454; overflow: hidden; margin: 8px auto; }

    .ac-log.on { border-color: rgba(232,164,74,.4); background: #141b30; }
    .ac-playbar { display: flex; justify-content: flex-end; padding: 12px; }
    /* the first flight can be left; the button sits beside pause and is
       deliberately quiet, so it reads as an escape hatch rather than an
       invitation to leave the lesson */
    /* THE GUIDED STEP. For the two minutes the guided path runs, the next
       thing to do is the loudest thing on screen — and FREE FLIGHT, which
       points away from it, steps down. Gold rather than blue, so the two
       are never mistaken for each other at a glance. */
    .ac-hubtile.t-guide { grid-column: 1 / -1; flex-direction: row;
      justify-content: center; gap: 13px; padding: 13px 10px;
      --m1: #f0b64a; --m2: #b8730a; --t1: #c98a1a; --t2: #6b3d05;
      --tb: #ffd782; border-color: rgba(255, 214, 130, .85);
      box-shadow: 0 0 0 2px rgba(255,210,130,.45), 0 0 26px rgba(230,170,60,.5),
        0 12px 26px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.3),
        inset 0 -3px 0 rgba(0,0,0,.28); }
    .ac-hubtile.t-guide b { font-size: 21px; }

      text-shadow: 0 0 14px rgba(255, 200, 90, .7); }

      transform: scale(.985); }
    .ac-guiding .ac-hubtile.t-launch .ac-hub-ribbon { opacity: .7; }
    /* IN THE FLOW, not floating. The absolute coach was landing on top of
       the STAR CHART bar it was pointing at and covering that bar's own
       progress line — the instruction hid its target. */
    .ac-coach.ac-coach-inline { position: static; left: auto; right: auto;
      bottom: auto; margin: 8px 0 0; z-index: auto; }
    body.ac-beta .ac-coach.ac-coach-inline { bottom: auto; }
    .ac-tutskip { font-size: 11px; padding: 8px 14px; letter-spacing: .1em;

      min-height: 44px; min-width: 60px; }
    .ac-playbar { align-items: center; }
    .ac-iconbtn { width: 40px; height: 40px; border-radius: 12px; background: rgba(20,27,48,.8); color: #f3efe4; border: 1px solid #2a3454; font-weight: 800; }

    /* ================= THE HUB (v85) =================
       The home is a hub of saturated tiles over the purple key art.
       Sub-screens keep the galaxy chrome; only home wears this. */
    .ac-hub { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden;
      background: #120a2c; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
    .ac-hub-art { position: absolute; inset: 0; background-size: cover; background-position: 50% 26%; filter: saturate(1.1); }
    .ac-hub-scrim { position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(16,7,38,.68) 0%, rgba(16,7,38,.12) 22%, rgba(16,7,38,.14) 60%, rgba(10,4,26,.82) 94%); }
    /* stack every hub child over the art with three same-specificity
       rules, last one wins: the art and scrim stay ABSOLUTE (the :not()
       fix in v87 accidentally out-specified them into zero-height
       relative divs — the vanished background), and the mode sheet stays
       FIXED so it overlays instead of rendering inline and clipped. */
    .ac-hub > * { position: relative; }
    .ac-hub > .ac-hub-art, .ac-hub > .ac-hub-scrim { position: absolute; }
    .ac-hub > .ac-lvlsheet { position: fixed; }
    .ac-hub-art, .ac-hub-scrim { position: absolute; }
    /* ONE bar for the whole top rail (owner's call): the capsule background
       that used to sit on each cluster now wraps the group, and every item
       inside carries its own slight pill so the spacing reads as one unit. */
    .ac-hub-rail { flex: none; display: flex; align-items: center; gap: 6px; background: rgba(22,14,48,.92);
      border: 1.5px solid rgba(170,140,240,.3); border-radius: 22px; padding: 5px 6px; }

    .ac-hub-railgap { flex: 1; }
    .ac-hub-sq { position: relative; width: 44px; height: 44px; border-radius: 12px; background: rgba(8,10,24,.5);
      border: 1px solid rgba(170,140,240,.18); display: flex; align-items: center; justify-content: center; color: #cfd8ea; }
    /* the painted settings plate carries its own frame - no screen blend */
    .ac-hub-sq .ac-hubic-art { width: 40px; height: 40px; max-width: none; max-height: none;
      object-fit: cover; border-radius: 10px; mix-blend-mode: normal; }
    .ac-hub-sq img { width: 34px; height: 34px; mix-blend-mode: screen; border-radius: 10px; }
    .ac-hub-sq canvas { width: 36px; height: 36px; }
    .ac-hub-wordmark { margin-top: 10px; text-align: center; }
    .ac-hub-title { font-family: Fraunces, serif; font-weight: 800; font-size: 40px; line-height: .95;
      background: linear-gradient(#fff 25%, #cfd6f2 60%, #9aa6d8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 14px rgba(20,10,50,.9)); }
    .ac-hub-kicker { margin-top: 5px; font-size: 10px; font-weight: 800; letter-spacing: .3em; text-transform: uppercase;
      color: #c9b1ff; text-shadow: 0 1px 8px rgba(10,5,30,.9); }
    .ac-hub-space { flex: 1 1 auto; min-height: 60px; }
    .ac-hub-tiles { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .ac-hubtile { position: relative; border-radius: 20px; padding: 12px 8px 10px; display: flex; flex-direction: column;
      align-items: center; gap: 5px; color: #fff;
      background: linear-gradient(180deg, var(--t1,#1a1f3a), var(--t2,#0e1122));
      border: 2px solid var(--tb, rgba(170,140,240,.3));
      box-shadow: 0 9px 22px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.28); }
    .ac-hubtile:active { transform: translateY(1px) scale(.99); }

    .ac-hubsub { font-size: 10px; color: rgba(255,255,255,.85); font-weight: 700; margin-top: -3px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .ac-hubic { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
      background: rgba(8,10,24,.38); border-radius: 14px; box-shadow: inset 0 2px 5px rgba(0,0,0,.35); }
    .ac-hubic img, .ac-hubic canvas { max-width: 50px; max-height: 50px; object-fit: contain; }
    .ac-hubic .ac-hubic-img { mix-blend-mode: screen; border-radius: 12px; }
    .ac-hubdot { position: absolute; top: 9px; right: 10px; width: 11px; height: 11px; border-radius: 50%;
      background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
    .t-launch { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 13px; padding: 13px 10px;
      --t1: #2f8fe0; --t2: #123f80; --tb: #8fdaff;

        inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.28); }

    .ac-hub-launchtxt { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
    .ac-hub-launchtxt .ac-hubsub { letter-spacing: .13em; text-transform: uppercase; color: #d4ecff; margin-top: 0; }
    .t-loadout { --t1: #8a5ae4; --t2: #44249a; --tb: #c4a0ff; }
    .t-chart { --t1: #1db388; --t2: #0a5a44; --tb: #6ce8bc; }
    .t-modes { --t1: #eda03c; --t2: #8f4d0e; --tb: #ffd88f; }

      background: linear-gradient(180deg,#57b9ff,#2f86d6); color: #fff; font-size: 9px; font-weight: 900; letter-spacing: .13em;
      padding: 3.5px 12px; border-radius: 7px; box-shadow: 0 3px 9px rgba(0,0,0,.5);
      clip-path: polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%); }
    .ac-hub-bar { margin-top: 11px; flex: none; display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
      background: rgba(22,14,48,.92); border: 1.5px solid rgba(170,140,240,.3); border-radius: 18px; padding: 9px 13px;
      color: #f3efe4; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
    .ac-hub-starbadge { width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #7a4a08; background: radial-gradient(circle at 50% 35%, #ffe9a8, #e8a44a);
      box-shadow: 0 0 12px rgba(255,206,92,.5); }
    .ac-hub-bartxt { flex: 1; min-width: 0; }

      border: 1px solid rgba(255,206,92,.35); overflow: hidden; margin-top: 4px; }

      font-size: 9.5px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); letter-spacing: .05em; }
    /* landscape: five tiles in one row, launch back to a column */
    @media (orientation: landscape) {
      .ac-hub { padding: 12px 22px 14px; }
      .ac-hub-art { background-position: 50% 18%; }
      .ac-hub-wordmark { text-align: left; margin: 2px 0 0 4px; }

      .t-launch { grid-column: auto; flex-direction: column; gap: 5px; padding: 12px 8px 10px; }
      .t-launch b { font-size: 15px; }

    /* ---- MODES: one saturated row per way to fly ---- */
    .ac-modecard { gap: 9px; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .ac-moderow { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      border-radius: 18px; padding: 10px 12px; color: #f3efe4;
      background: linear-gradient(100deg, var(--mw, rgba(30,38,64,.55)), rgba(12,8,28,.5) 64%);
      border: 1.5px solid var(--m1, #2a3454);
      box-shadow: 0 6px 18px -12px rgba(0,0,0,.9); }
    .ac-moderow.on { border-color: var(--mb, #A99BE8);
      background: linear-gradient(100deg, var(--mw2, rgba(60,70,120,.75)), rgba(14,9,32,.55) 72%);
      box-shadow: 0 0 0 1px var(--m1, #A99BE8), 0 10px 28px -12px var(--m1, #A99BE8),
        inset 0 1px 0 rgba(255,255,255,.18); }
    /* the face plate: real game art, lit by the mode's own hue */
    .ac-modeic { position: relative; flex: none; width: 54px; height: 54px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;

      border: 1px solid var(--m1, #2a3454); }
    .ac-modeic canvas, .ac-modeic img { width: 44px; height: 44px; object-fit: contain;

    /* the record chip — gold, like every number you earned */
    .ac-modebest { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px;
      border-radius: 999px; padding: 6px 14px;
      background: linear-gradient(180deg, #ffd76a, #dd9c25); border: 1px solid rgba(255,238,190,.55);
      box-shadow: 0 4px 12px -4px rgba(255,180,60,.65); }

    .ac-modebest b { font: 900 16px/1 Figtree, sans-serif; color: #2a1800; }

    /* every mode its own hue, drawn from the hub's tile palette */

    .m-deep { --m1: #8a5ae4; --mb: #c9abff; --mw: rgba(138,90,228,.20); --mw2: rgba(138,90,228,.42); }
    .m-lost { --m1: #e0447c; --mb: #ffa3c4; --mw: rgba(224,68,124,.20); --mw2: rgba(224,68,124,.42); }
    .m-arcade { --m1: #eda03c; --mb: #ffd490; --mw: rgba(237,160,60,.20); --mw2: rgba(237,160,60,.42); }
    .m-tunnel { --m1: #1db388; --mb: #7cebc2; --mw: rgba(29,179,136,.20); --mw2: rgba(29,179,136,.42); }
    .m-race { --m1: #2f9fe9; --mb: #a9f5ff; --mw: rgba(47,159,233,.20); --mw2: rgba(47,159,233,.44); }
    /* the lab, under a rule and deliberately quieter than a mode */
    .ac-modeshead { display: flex; align-items: center; gap: 10px; margin: 8px 0 1px;

      background: linear-gradient(90deg, rgba(140,150,190,.35), transparent); }

    body.ac-beta .ac-modeback { margin-top: 6px; border-radius: 999px; padding: 15px;
      font: 900 15px/1 Figtree, sans-serif; letter-spacing: .12em; color: #fff;
      border: 1px solid rgba(206,186,255,.5);
      background: linear-gradient(180deg, #8a5ae4, #4a279c);
      box-shadow: 0 10px 26px -10px rgba(138,90,228,.85), inset 0 1px 0 rgba(255,255,255,.3); }
    /* ---- the chapter map ---- */
    .ac-chartmapwrap { display: flex; justify-content: center; padding: 4px 0 14px; }

    .ac-mappath { position: absolute; inset: 0; }

      gap: 3px; background: none; border: 0; color: inherit; padding: 0; }

    .ac-mapnode.done .ac-mapdisc::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;

      background: radial-gradient(circle at 50% 32%, #39415f, #1a2038); color: #98a2bd; }
    .ac-maprider { position: absolute; left: 50%; bottom: 68%; transform: translateX(-50%); width: 62px; pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }

    /* ============ THE BETA STOREFRONT: one page, art-led ============ */

    /* ---- THE DISPLAY CASE ----
       A lit vitrine, not a rectangle of empty purple. Every colour comes
       from --case-glow / --case-lite / --case-deep, which the suit on show
       sets, so changing character re-lights the glass. */
    /* the loadout wears the shop's case, but it sits above the category
       tabs rather than at the top of a scroll, so it carries its own
       breathing room and does not need the shop's lead-in gap */
    .ac-hangarcase { margin: 0 12px 10px; }
    .ac-hangarcase .ac-caseeyebrow { color: #7cebc2; }
    .ac-shopcase { --case-glow: #c4a0ff; --case-lite: #8a5ae4; --case-deep: #160f34;
      position: relative; margin: 6px 0 12px; border-radius: 20px; overflow: hidden;
      border: 1.5px solid color-mix(in srgb, var(--case-glow) 55%, transparent);
      background:
        radial-gradient(90% 70% at 50% -10%, color-mix(in srgb, var(--case-glow) 26%, transparent), transparent 68%),
        linear-gradient(180deg, color-mix(in srgb, var(--case-lite) 22%, #0b0720), #0b0720 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset,
        0 14px 34px -18px color-mix(in srgb, var(--case-glow) 70%, transparent),
        0 3px 14px rgba(0,0,0,.6); }
    .ac-casepane { position: relative; display: flex; align-items: center; justify-content: center;
      padding: 10px 0 4px; }
    .ac-casecanvas { position: relative; z-index: 2; }
    /* the spotlight the case is lit by */
    .ac-casebeam { position: absolute; top: -18%; left: 50%; transform: translateX(-50%);
      width: 78%; height: 96%; pointer-events: none; z-index: 1;
      background: radial-gradient(52% 62% at 50% 0%,
        color-mix(in srgb, var(--case-glow) 34%, transparent), transparent 72%); }
    /* the pedestal it stands over */
    /* a pool of cast light, not a plinth - the pilot is flying, not standing */
    .ac-casefloor { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
      width: 44%; height: 15px; pointer-events: none; z-index: 1; border-radius: 50%;
      background: radial-gradient(50% 50% at 50% 50%,
        color-mix(in srgb, var(--case-glow) 50%, transparent), transparent 72%);
      filter: blur(3px); opacity: .55; }
    /* corner brackets: the thing that makes it read as a case */
    .ac-casecorner { position: absolute; width: 17px; height: 17px; z-index: 3; pointer-events: none;
      border: 2px solid color-mix(in srgb, var(--case-glow) 85%, transparent); opacity: .85; }
    .ac-c-tl { top: 9px; left: 9px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
    .ac-c-tr { top: 9px; right: 9px; border-left: 0; border-bottom: 0; border-radius: 0 6px 0 0; }
    .ac-c-bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; border-radius: 0 0 0 6px; }
    .ac-c-br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
    .ac-casetag { position: absolute; top: 12px; right: 32px; z-index: 4;

    /* the name plate, lit from the same hue */
    .ac-caseplate { position: relative; z-index: 3; display: flex; flex-direction: column;

      padding-bottom: 11px;
      border-top: 1px solid color-mix(in srgb, var(--case-glow) 30%, transparent);
      background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--case-deep) 70%, #06040f)); }
    .ac-caseeyebrow { font: 800 8.5px/1 Figtree, sans-serif; letter-spacing: .26em;

    .ac-boardtxt b { font: 800 14px/1.2 Figtree, sans-serif; color: #f3efe4; }
    .ac-boardtxt .ac-sub { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
    .ac-boardscore { flex: none; font: 900 17px/1 Figtree, sans-serif; color: #ffd76a;
      font-variant-numeric: tabular-nums; }
    /* ---- PREPRODUCTION: what the cycle is holding back ---- */
    .ac-devroll { flex: none; border-top: 1px solid rgba(170,140,240,.28);
      background: rgba(10,6,24,.96); }
    .ac-devbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: none; border: 0; color: #9aa6c4; text-align: left; }
    .ac-devbar b { font: 800 10px/1 Figtree, sans-serif; letter-spacing: .16em; color: #c4a0ff; }
    .ac-devbar span { font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; color: #7c86a4; }
    .ac-devroll.open .ac-devbar { padding-bottom: 10px; }
    .ac-devpanel { max-height: 46vh; overflow-y: auto; padding: 0 16px calc(14px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px; }
    /* same trap as the pack sheet: capped, scrolling, and a flex column, so
       its groups would compress instead of the panel scrolling. Found by the
       guard rather than by eye - it opens only when someone taps the roll-up,
       which is exactly the state a live check never reaches. */
    .ac-devpanel > * { flex: none; }
    .ac-devday { font: 500 10px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: #7c86a4; margin: 0; }
    .ac-devgroup { display: flex; flex-direction: column; gap: 5px; }
    .ac-devhead { font: 800 9.5px/1 Figtree, sans-serif; letter-spacing: .14em; color: #ffd76a; margin: 0; }
    .ac-devwhy { font-size: 10.5px; color: #7c86a4; margin: 0; }
    .ac-devlist { display: flex; flex-wrap: wrap; gap: 5px; }
    .ac-devchip { display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 4px 8px;
      background: rgba(30,20,62,.85); border: 1px solid rgba(170,140,240,.22); }
    .ac-devchip b { font: 700 10px/1 Figtree, sans-serif; color: #dfe4f7; }
    .ac-devchip i { font: 500 9.5px/1 "IBM Plex Mono", ui-monospace, monospace; font-style: normal; color: #cbb2ff; }
    .ac-devnone { font-size: 10.5px; color: #5b6480; }
    /* the storefront is the first menu to be told about landscape */
    @media (orientation: landscape) {
      .ac-shopbeta .ac-sheet-scroll { padding-left: max(16px, calc(50% - 380px));
        padding-right: max(16px, calc(50% - 380px)); }
      .ac-shopbeta .ac-devpanel, .ac-shopbeta .ac-devbar {
        padding-left: max(16px, calc(50% - 380px)); padding-right: max(16px, calc(50% - 380px)); }
      /* a 200px-tall stage eats a 430px-tall window, so the shelves are
         never reached. The canvas carries inline dimensions from
         miniCanvas, which is why these have to shout. */
      /* a case stretched to the full window leaves the pilot marooned in
         the middle of it, so the vitrine keeps its own proportions */
      .ac-shopbeta .ac-shopcase { max-width: 460px; margin-left: auto; margin-right: auto; }
      .ac-shopbeta .ac-casepane { padding: 4px 0 0; }
      .ac-shopbeta .ac-casecanvas { width: 236px !important; height: 162px !important; }
      .ac-shopbeta .ac-caseplate b { font-size: 15px; }
      .ac-shopbeta .ac-combobar { padding: 9px 12px; }
      /* THE LOADOUT BORROWED THE CASE AND NOT ITS LANDSCAPE MANNERS. Every
         rule above is scoped to .ac-shopbeta, so when the loadout adopted
         the same vitrine it inherited the portrait sizing and nothing else:
         header 66 + case 230 + pills 58 + toggle 32 left the item grid a
         TWENTY PIXEL window, and NONE of its sixteen cards could be
         reached. Measured at 932x430, then fixed.
         Stacking was the wrong shape anyway. Landscape is 932px WIDE and
         430 tall - the scarce axis is the one the case was eating. So the
         pilot moves BESIDE the grid instead of on top of it, which hands
         the whole remaining height back to the thing you came to shop. */
      .ac-menu:has(> .ac-hangarcase) {
        display: grid; grid-template-columns: 320px minmax(0, 1fr);
        column-gap: 12px; align-content: start; }
      .ac-menu:has(> .ac-hangarcase) > * { grid-column: 2; }
      .ac-menu:has(> .ac-hangarcase) > .ac-menuhead { grid-column: 1 / -1; }
      .ac-menu:has(> .ac-hangarcase) > .ac-hangarcase {
        grid-column: 1; grid-row: 2 / 99; align-self: start; margin: 0 0 0 12px; }
      .ac-hangarcase .ac-casepane { padding: 2px 0 0; }
      .ac-hangarcase .ac-casecanvas { width: 236px !important; height: 162px !important; }
      .ac-hangarcase .ac-caseplate b { font-size: 14px; }
    }
  </style>
</head>

  <div id="app"></div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
    window.__ACORNAUT_BETA__ = true;
    window.__ACORNAUT_ART__ = "../art";
  </script>
  <script type="module">
    import { bootStandalone } from "../js164/standalone.js";
    bootStandalone(document.getElementById("app"));
  </script>
