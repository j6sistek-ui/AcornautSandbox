<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Acornaut LAB — The Spill</title>
<meta name="description" content="A prototype survival mode. Not part of the game." />
<meta name="theme-color" content="#05070f" />
<meta name="robots" content="noindex" />
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=3" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden;
    font-family: Figtree, system-ui, -apple-system, sans-serif; color: #f3efe4; }
  #app { position: fixed; inset: 0; display: grid; place-items: center; }
  .sp-root { position: relative; width: min(100vw, 46vh); height: 100%; max-height: 100vh;
    overflow: hidden; background: #05070f; touch-action: none; user-select: none; }
  .sp-canvas { position: absolute; inset: 0; display: block; }

  .sp-hud { position: absolute; inset: 0; pointer-events: none; }
  .sp-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: calc(10px + env(safe-area-inset-top)) 14px 0; }
  .sp-time { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: #9fb0d0; }
  .sp-score { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 26px;
    text-shadow: 0 2px 12px rgba(0,0,0,.8); }

  .sp-meters { position: absolute; top: calc(40px + env(safe-area-inset-top)); left: 14px; right: 14px;
    display: flex; align-items: center; gap: 10px; }
  .sp-charge { flex: 1 1 auto; height: 5px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .sp-charge i { display: block; height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, #6fd8ff, #b98bff); transition: width .12s linear; }
  .sp-combo { font-size: 15px; font-weight: 800; color: #ffd76a; min-width: 28px; text-align: right; }

  .sp-banner { position: absolute; top: 30%; left: 0; right: 0; text-align: center;
    font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 27px; letter-spacing: .04em;
    text-shadow: 0 3px 18px rgba(0,0,0,.9); transition: opacity .25s; opacity: 0; }

  .sp-pulse { position: absolute; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom));
    padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(14,20,38,.8); color: #7c8bb0; font: 800 12px/1 Figtree, sans-serif;
    letter-spacing: .14em; opacity: .5; }
  .sp-pulse.ready { color: #06121e; opacity: 1;
    background: linear-gradient(180deg, #9fe6ff, #6fb8ff); border-color: #cfefff;
    box-shadow: 0 0 22px rgba(120,200,255,.55); }

  .sp-card { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center;
    padding: 30px 26px; background: linear-gradient(180deg, rgba(5,7,15,.72), rgba(5,7,15,.93));
    backdrop-filter: blur(3px); text-align: center; }
  .sp-card.show { display: flex; }
  .sp-card h1 { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 40px; margin: 0 0 12px; }
  .sp-card p { margin: 6px 0; font-size: 14px; line-height: 1.5; color: #b9c4dc; }
  .sp-card ul { margin: 14px auto; padding: 0; list-style: none; text-align: left; max-width: 260px; }
  .sp-card li { font-size: 13px; color: #cfd8ea; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .sp-card b { color: #fff; }
  .sp-stat b { font-family: Fraunces, Georgia, serif; font-size: 38px; }
  .sp-sub { font-size: 12px !important; color: #8b95b0 !important; }
  .sp-fine { font-size: 12px !important; color: #7c8bb0 !important; }
  .sp-best { color: #ffd76a !important; font-weight: 800; letter-spacing: .1em; font-size: 13px !important; }
  .sp-go { margin-top: 18px !important; font-weight: 800; letter-spacing: .18em; color: #fff !important;
    animation: sp-pulse 1.7s ease-in-out infinite; }
  @keyframes sp-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  .sp-tag { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
    font-size: 9px; letter-spacing: .18em; color: #4d5878; pointer-events: none; }
  .sp-tag a { color: #6b7ba0; }
</style>
</head>
<body>
<div id="app"><div class="sp-root" id="root"></div></div>
<div class="sp-tag">LAB · PROTOTYPE · <a href="../../">back to the game</a></div>
<script>
  // the lab sits two folders below the site root, so the art lives up there
  window.__ACORNAUT_ART__ = "../../art";
</script>
<script type="module">
  import { bootSpill } from "./js/spill.js";
  bootSpill(document.getElementById("root"));
</script>
</body>
</html>
