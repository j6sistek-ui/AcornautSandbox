<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acornaut BETA</title>
<meta name="description" content="Acornaut BETA — test build. The stable game lives one folder up." />
<meta name="theme-color" content="#05070f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Acornaut BETA" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="../icon.svg" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070f;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f2efe6;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    max-width: 480px;
    background: #05070f;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  let ctx = canvas.getContext('2d'); // reassigned briefly when caching shop sprites

  // —— persistence ——
  // Beta uses its own save slot so testing never touches the live game's progress
  const SAVE_KEY = 'acornaut_beta';
  const BETA_ACORNS = 10000;
  const HELMET_IDS = ['clear','ion','solar','nebula','lunar','void','comet','cherry','royal','aurora','meteor','chrono'];
  const SUIT_IDS = ['flight','iontrim','copper','frost','voidsuit','aurorasuit','ember','stardust'];
  const TRAIL_IDS = ['sparks','ion','bubble','bloom','comet'];
  const PAL_IDS = ['none','bee','buddy','ufo'];
  const defaultSave = () => ({
    highScore: 0,
    acorns: BETA_ACORNS,
    startShield: false, // one-shot modifier: begin the next run shielded
    unlocked: ['clear'], // only Clear free — rest cost acorns
    equipped: 'clear',
    unlockedSuits: ['flight'],
    equippedSuit: 'flight',
    unlockedTrails: ['sparks'],
    equippedTrail: 'sparks',
    unlockedPals: ['none'],
    equippedPal: 'none',
  });
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return defaultSave();
      const s = { ...defaultSave(), ...JSON.parse(raw) };
      // Ensure defaults; do not wipe purchased unlocks
      if (!Array.isArray(s.unlocked) || !s.unlocked.length) s.unlocked = ['clear'];
      if (!s.unlocked.includes('clear')) s.unlocked.unshift('clear');
      if (!Array.isArray(s.unlockedSuits) || !s.unlockedSuits.length) s.unlockedSuits = ['flight'];
      if (!s.unlockedSuits.includes('flight')) s.unlockedSuits.unshift('flight');
      if (!SUIT_IDS.includes(s.equippedSuit)) s.equippedSuit = 'flight';
      if (!Array.isArray(s.unlockedTrails) || !s.unlockedTrails.length) s.unlockedTrails = ['sparks'];
      if (!s.unlockedTrails.includes('sparks')) s.unlockedTrails.unshift('sparks');
      if (!TRAIL_IDS.includes(s.equippedTrail) || !s.unlockedTrails.includes(s.equippedTrail)) s.equippedTrail = 'sparks';
      if (!Array.isArray(s.unlockedPals) || !s.unlockedPals.length) s.unlockedPals = ['none'];
      if (!s.unlockedPals.includes('none')) s.unlockedPals.unshift('none');
      if (!PAL_IDS.includes(s.equippedPal) || !s.unlockedPals.includes(s.equippedPal)) s.equippedPal = 'none';
      if (!HELMET_IDS.includes(s.equipped)) s.equipped = 'clear';
      if (s.equipped !== 'clear' && !s.unlocked.includes(s.equipped)) s.equipped = 'clear';
      // BETA ONLY: keep the balance topped up so every helmet and suit
      // can be bought and inspected while testing art changes.
      if (s.acorns < BETA_ACORNS) s.acorns = BETA_ACORNS;
      return s;
    } catch { return defaultSave(); }
  }
  function writeSave(s) {
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  }
  let save = loadSave();

  // —— helmets ——
  const HELMETS = [
    { id: 'clear',  name: 'Clear',  cost: 0,   visor: '#bcd8f4', tint: 0.16, rim: '#cfd8e4', trim: '#8fa0b4', glow: null },
    { id: 'ion',    name: 'Ion',    cost: 15,  visor: '#4ad8ff', tint: 0.20, rim: '#4ad8ff', trim: '#1b6f92', glow: '#4ad8ff' },
    { id: 'solar',  name: 'Solar',  cost: 30,  visor: '#ffc46b', tint: 0.20, rim: '#ffb040', trim: '#a86a18', glow: '#ffa32e' },
    { id: 'nebula', name: 'Nebula', cost: 50,  visor: '#c86bff', tint: 0.22, rim: '#e070ff', trim: '#6a2a9a', glow: '#c060ff' },
    { id: 'lunar',  name: 'Lunar',  cost: 70,  visor: '#d8e2f0', tint: 0.18, rim: '#b6c2d4', trim: '#6f7c8e', glow: '#cfe0ff' },
    { id: 'void',   name: 'Void',   cost: 90,  visor: '#2a2438', tint: 0.30, rim: '#d4af37', trim: '#1a1622', glow: '#a855f7' },
    { id: 'comet',  name: 'Comet',  cost: 120, visor: '#ff8a4a', tint: 0.20, rim: '#ff6a28', trim: '#8a2f0c', glow: '#ff7a30' },
    { id: 'cherry', name: 'Cherry', cost: 150, visor: '#ff9ec4', tint: 0.20, rim: '#ff8ab0', trim: '#a83a68', glow: '#ff7ab0' },
    { id: 'royal',  name: 'Royal',  cost: 200, visor: '#7fe0cf', tint: 0.18, rim: '#d4af37', trim: '#8a6a12', glow: '#ffd76a' },
    { id: 'aurora', name: 'Aurora', cost: 300, visor: '#4de8b8', tint: 0.18, rim: '#57e6c2', trim: '#1c7a5e', glow: '#5dffd0' },
    { id: 'meteor', name: 'Meteor', cost: 400, visor: '#c98a4e', tint: 0.2,  rim: '#b5713a', trim: '#6e3f18', glow: '#ff9d47' },
    { id: 'chrono', name: 'Chrono', cost: 500, visor: '#e8d9a8', tint: 0.16, rim: '#c9a94f', trim: '#7a6428', glow: '#ffe27a' },
  ];

  // —— body / suit variants (separate from helmets) ——
  const SUITS = [
    { id: 'flight',   name: 'Flight', cost: 0,
      fur: '#d98f3d', furDark: '#a8641f', belly: '#f7e0bb',
      suit: '#c8762c', suitLite: '#eda85a', suitDark: '#8a4c14',
      trim: '#f6cf8a', glow: null, dust: null },
    { id: 'iontrim',  name: 'Ion', cost: 22,
      fur: '#d98f3d', furDark: '#a8641f', belly: '#f7e0bb',
      suit: '#1b3f5c', suitLite: '#3d7fa8', suitDark: '#0e2436',
      trim: '#4ad8ff', glow: '#4ad8ff', dust: '#8fe9ff' },
    { id: 'copper',   name: 'Copper', cost: 48,
      fur: '#a85f28', furDark: '#663409', belly: '#e6bd83',
      suit: '#8c4718', suitLite: '#f2ab62', suitDark: '#421f06',
      trim: '#ffdda8', glow: '#ff8a2a', dust: '#ffb45c' },
    { id: 'frost',    name: 'Frost', cost: 80,
      fur: '#e2ecf6', furDark: '#a9bccf', belly: '#ffffff',
      suit: '#6f9dc4', suitLite: '#a9d4ef', suitDark: '#40688a',
      trim: '#eaf7ff', glow: '#9fe4ff', dust: '#dff5ff' },
    { id: 'voidsuit', name: 'Void', cost: 180,
      fur: '#544a63', furDark: '#312a3d', belly: '#8d7fa0',
      suit: '#241d33', suitLite: '#4f4270', suitDark: '#100c18',
      trim: '#d4af37', glow: '#b45cff', dust: '#e7b6ff' },
    { id: 'aurorasuit', name: 'Aurora', cost: 250,
      fur: '#cf8a3c', furDark: '#9c5f1d', belly: '#f4ddb4',
      suit: '#0f5c4c', suitLite: '#2fae8f', suitDark: '#073a2f',
      trim: '#5dffd0', glow: '#5dffd0', dust: '#a8ffe8' },
    { id: 'ember', name: 'Ember', cost: 325,
      fur: '#b5722f', furDark: '#7c481a', belly: '#eccb96',
      suit: '#3a2a26', suitLite: '#7a4a3a', suitDark: '#1e1412',
      trim: '#ff7a2e', glow: '#ff5a1e', dust: '#ffb066' },
    { id: 'stardust', name: 'Stardust', cost: 400,
      fur: '#c8873f', furDark: '#94601f', belly: '#f2dcb2',
      suit: '#1a2560', suitLite: '#3d4fa8', suitDark: '#0c1233',
      trim: '#ffd76a', glow: '#8fb8ff', dust: '#fff3b8' },
  ];

  // —— tap-boost trails (adapted from the asset catalog) ——
  const TRAILS = [
    { id: 'sparks', name: 'Rocket Sparks', cost: 0 },
    { id: 'ion',    name: 'Ion Stream',    cost: 60 },
    { id: 'bubble', name: 'Bubble Jets',   cost: 90 },
    { id: 'bloom',  name: 'Nebula Bloom',  cost: 120 },
    { id: 'comet',  name: 'Comet Booster', cost: 200 },
  ];

  // —— companions ——
  const PALS = [
    { id: 'none',  name: 'None',        cost: 0,
      desc: 'Fly solo.' },
    { id: 'bee',   name: 'Astro Bee',   cost: 80,
      desc: 'A cheerful cosmetic escort.' },
    { id: 'buddy', name: 'Acorn Buddy', cost: 150,
      desc: 'Grabs nearby acorns for you.' },
    { id: 'ufo',   name: 'Mini UFO',    cost: 250,
      desc: 'A tiny cosmetic saucer wingman.' },
  ];

  // —— tunable physics (dev sliders mutate these) ——
  // Defaults: Tap 450, Gravity 1300, X 0.18
  let GRAVITY = 1300;
  let FLAP = -450;
  let SQUIRREL_X = 0.18;
  const BASE_SPEED = 165;
  const MAX_SPEED = 280;   // capped: past this it's a marathon, not a ramp
  const GAP_BASE = 168;
  const GAP_MIN = 132;     // floor: the corridor never gets tighter than this
  const PLANET_R = 42;
  const POWER_DURATION = 6;
  const SLOW_FACTOR = 0.42;
  const DEF_GRAVITY = 1300, DEF_FLAP = -450, DEF_X = 0.18;

  // —— state ——
  let W = 0, H = 0, dpr = 1;
  let mode = 'title'; // title | hangar | suits | ready | play | dead
  let score = 0;
  let runAcorns = 0;
  let squirrel = { y: 0, vy: 0, rot: 0 };
  let planets = [];
  let acorns = [];
  let powerups = [];
  let shields = [];          // rare shield-acorn pickups
  let blackholes = [];       // black-hole acorns: warp the world for a while
  let warpT = 0;             // swirl-in transition (counts down from 1s)
  let warpLeft = 0;          // remaining warped-orientation time
  let warpTilt = 0;          // ±25° flight-lane tilt while warped
  let warpMirror = true;     // whether this warp reverses the scroll
  let recoveryMsg = '';      // banner shown during freeze/slow recovery
  let pal = { x: 0, y: 0, dart: 0 };   // companion position (smoothed)
  let hasShield = false;     // carrying a shield this run
  let shieldFreeze = 0;      // world frozen just after a shield absorbs a hit
  let shieldSlow = 0;        // slow-motion recovery window after the freeze
  let particles = [];
  let stars = [];
  let speed = BASE_SPEED;
  let distance = 0;
  let lastSpawnX = 0;
  let lastGapY = 0;
  let powerLeft = 0;
  let flapBoost = 0;
  let deadTimer = 0;
  let titlePulse = 0;
  let hitCooldown = 0;
  let hangarScroll = 0;
  let shopTab = 'helmets'; // helmets | suits | mods | trails | pals

  // —— background environments (worlds from the asset catalog) ——
  // Every ENV_GATES gates the space around the run shifts to a new palette.
  // Deliberately subtle: dark bases and low-alpha washes so gates, debris
  // and pickups keep full contrast.
  const ENV_GATES = 20; // testing cadence; raise for release milestones
  const ENVS = [
    { name: 'DEEP SPACE',     top: [7, 11, 24],  bot: [12, 18, 40],
      wash: [40, 60, 110, 0.12],  wash2: [70, 90, 160, 0.05] },
    { name: 'NEBULA NURSERY', top: [18, 9, 38],  bot: [30, 14, 54],
      wash: [150, 70, 210, 0.13], wash2: [255, 110, 180, 0.07] },
    { name: 'ICE MOON',       top: [5, 16, 28],  bot: [10, 28, 44],
      wash: [90, 180, 220, 0.1],  wash2: [160, 230, 255, 0.05] },
    { name: 'SOLAR FURNACE',  top: [26, 11, 6],  bot: [40, 16, 8],
      wash: [255, 120, 40, 0.09], wash2: [255, 80, 60, 0.06] },
    { name: 'CRYSTAL BELT',   top: [13, 10, 32], bot: [16, 26, 48],
      wash: [140, 220, 255, 0.09], wash2: [200, 140, 255, 0.06] },
    { name: 'TIME FRACTURE',  top: [6, 20, 16],  bot: [10, 30, 24],
      wash: [90, 255, 180, 0.07], wash2: [200, 255, 120, 0.04] },
  ];
  let envA = 0, envB = 0, envBlend = 1, envMsgT = 0;
  const MOD_SHIELD_COST = 25;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.min(rect.width, 480);
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'title' || mode === 'hangar') initStars();
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.25,
        a: Math.random() * 0.75 + 0.2,
        tw: Math.random() * Math.PI * 2,
        bright: Math.random() < 0.12,
      });
    }
  }

  function resetRun() {
    score = 0;
    runAcorns = 0;
    squirrel = { y: H * 0.45, vy: 0, rot: 0 };
    planets = [];
    acorns = [];
    powerups = [];
    shields = [];
    blackholes = [];
    warpT = 0;
    warpLeft = 0;
    warpTilt = 0;
    warpMirror = true;
    recoveryMsg = '';
    hasShield = !!save.startShield; // purchased modifier arms the run
    pal = { x: W * SQUIRREL_X - 42, y: H * 0.45 - 20, dart: 0 };
    shieldFreeze = 0;
    shieldSlow = 0;
    particles = [];
    speed = BASE_SPEED;
    distance = 0;
    lastSpawnX = W * 0.7;
    lastGapY = H * 0.5;
    powerLeft = 0;
    flapBoost = 0;
    deadTimer = 0;
    hitCooldown = 0;
    for (let i = 0; i < 3; i++) spawnPair(W + 80 + i * gapSpacing());
  }

  function gapSpacing() {
    return 240 + Math.min(50, distance * 0.005);
  }

  function difficulty() {
    // slower ramp, hard plateau — reaches the caps around gate ~60 and
    // stays there
    const t = Math.min(1, distance / 16000);
    return {
      speed: BASE_SPEED + (MAX_SPEED - BASE_SPEED) * t,
      gap: GAP_BASE - (GAP_BASE - GAP_MIN) * t,
    };
  }

  // Obstacle types for around-path seals (not planets)
  const OB_TYPES = ['asteroid','debris','satellite','ufo','crystal','rock','junk'];

  function makeObstacle(y, xOff) {
    const type = OB_TYPES[Math.floor(Math.random() * OB_TYPES.length)];
    // Larger hit/visual size so the flight lane is actually blocked
    const r = type === 'ufo' ? 24 + Math.random() * 5
            : type === 'satellite' ? 22 + Math.random() * 5
            : type === 'crystal' ? 20 + Math.random() * 5
            : type === 'debris' || type === 'junk' ? 19 + Math.random() * 5
            : 22 + Math.random() * 6;
    return {
      y, r, type,
      xOff: xOff,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.8,
      seed: Math.floor(Math.random() * 1000),
    };
  }

  function spawnPair(x) {
    const d = difficulty();
    // Main gap UNCHANGED — only seal the around-path above/below
    const gap = d.gap;
    const margin = 70;
    let gapCenter = margin + gap / 2 + Math.random() * (H - 2 * margin - gap);
    // Reachability clamp: the next gap must be within what the squirrel can
    // actually climb or dive in the time between gates. Without this, high
    // speed could demand a bottom-to-top transition faster than the flap
    // physics allow — difficulty should be a marathon, never impossible.
    const dtGate = gapSpacing() / d.speed;
    const climb = 230 * dtGate;   // sustainable upward pace, px/s
    const dive = 520 * dtGate;    // gravity dive pace, px/s
    gapCenter = Math.max(lastGapY - climb, Math.min(lastGapY + dive, gapCenter));
    gapCenter = Math.max(margin + gap / 2, Math.min(H - margin - gap / 2, gapCenter));
    lastGapY = gapCenter;
    const kindA = Math.floor(Math.random() * 9);
    const kindB = Math.floor(Math.random() * 9);
    const topY = gapCenter - gap / 2 - PLANET_R;
    const botY = gapCenter + gap / 2 + PLANET_R;
    // Fully seal the corridor ABOVE the top gate and BELOW the bottom gate.
    // Tight vertical packing in the flight lane so you cannot slip around.
    const blockers = [];
    const topEdge = topY - PLANET_R;
    const botEdge = botY + PLANET_R;
    // Step small enough that obstacle radii overlap the flight path
    const step = 30;

    // From just above top planet → screen top
    {
      let y = topEdge - 26;
      let n = 0;
      while (y > 20) {
        // tiny lateral jitter only — stay in the lane
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y -= step;
        n++;
        if (n > 12) break; // safety
      }
    }
    // From just below bottom planet → screen bottom
    {
      let y = botEdge + 26;
      let n = 0;
      while (y < H - 20) {
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y += step;
        n++;
        if (n > 12) break;
      }
    }
    planets.push({
      x, gapY: gapCenter, gap, r: PLANET_R,
      topKind: kindA, botKind: kindB, scored: false,
      blockers,
    });
    if (Math.random() < 0.55) {
      acorns.push({
        x: x + 8,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.35),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // rarer power-up acorn (~1 per 50 gates; was 1 in 20 and felt like the
    // run was spent in slow motion)
    if (Math.random() < 0.02) {
      powerups.push({
        x: x + 40,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.25),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // shield acorn — very rare, on average one per 200 gates
    if (Math.random() < 0.005) {
      shields.push({
        x: x + 20,
        y: gapCenter,
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // black-hole acorn — BETA TESTING RATE: ~1 per 20 gates so the warp is
    // easy to reach while tuning. Intended release rate is ~1 per 70 (0.014).
    // Never while a warp is pending or active: they'd be inert clutter.
    if (warpT === 0 && warpLeft === 0 && Math.random() < 0.05) {
      blackholes.push({
        x: x + 30,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.2),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    lastSpawnX = x;
  }

  function flap() {
    if (mode === 'ready') {
      mode = 'play';
    }
    if (mode !== 'play') return;
    squirrel.vy = FLAP;
    flapBoost = 0.22;
    // tap-boost trail, shaped by the equipped trail cosmetic
    const sx = W * SQUIRREL_X - 10;
    const sy = squirrel.y + 6;
    spawnTrail(sx, sy, save.equippedTrail);
  }

  function spawnTrail(sx, sy, trail) {
    if (trail === 'ion') {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: sx, y: sy + (Math.random() - 0.5) * 6,
          vx: -150 - Math.random() * 160,
          vy: (Math.random() - 0.5) * 30,
          life: 0.22 + Math.random() * 0.15,
          max: 0.37,
          r: 1.4 + Math.random() * 1.6,
          kind: 'ion',
        });
      }
    } else if (trail === 'bubble') {
      for (let i = 0; i < 7; i++) {
        particles.push({
          x: sx, y: sy,
          vx: -50 - Math.random() * 70,
          vy: -20 - Math.random() * 50,
          life: 0.5 + Math.random() * 0.35,
          max: 0.85,
          r: 2 + Math.random() * 3.5,
          kind: 'bubble',
        });
      }
    } else if (trail === 'bloom') {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: sx, y: sy,
          vx: -55 - Math.random() * 70,
          vy: (Math.random() - 0.5) * 70,
          life: 0.4 + Math.random() * 0.3,
          max: 0.7,
          r: 1.5 + Math.random() * 2,
          kind: 'bloom',
        });
      }
    } else if (trail === 'comet') {
      for (let i = 0; i < 9; i++) {
        particles.push({
          x: sx, y: sy + (Math.random() - 0.5) * 5,
          vx: -90 - Math.random() * 140,
          vy: (Math.random() - 0.5) * 40,
          life: 0.35 + Math.random() * 0.3,
          max: 0.65,
          r: 1.8 + Math.random() * 2.6,
          kind: 'comet',
        });
      }
    } else {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: sx, y: sy,
          vx: -80 - Math.random() * 120,
          vy: (Math.random() - 0.5) * 90,
          life: 0.25 + Math.random() * 0.2,
          max: 0.45,
          r: 2 + Math.random() * 3,
          kind: 'flame',
        });
      }
    }
  }

  // —— input ——
  function onPointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const x = (t.clientX - rect.left) * (W / rect.width);
    const y = (t.clientY - rect.top) * (H / rect.height);
    handleTap(x, y);
  }
  function handleTap(x, y) {
    if (mode === 'title') {
      for (const b of titleButtons()) {
        if (hit(x, y, b)) {
          if (b.id === 'fly') { resetRun(); mode = 'ready'; }
          else mode = 'hangar';
          return;
        }
      }
      return;
    }
    if (mode === 'hangar') {
      const back = { x: 56, y: 44, w: 80, h: 36 };
      if (hit(x, y, back)) { mode = 'title'; return; }
      for (const t of shopTabRects()) {
        if (hit(x, y, t)) { shopTab = t.id; return; }
      }
      const roster = shopRoster();
      if (roster) {
        roster.list.forEach((item, i) => {
          const c = shopCellRect(i);
          if (Math.hypot(x - c.x, y - c.y) < 46) {
            if (save[roster.own].includes(item.id)) {
              save[roster.eq] = item.id;
              writeSave(save);
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save[roster.own].push(item.id);
              save[roster.eq] = item.id;
              writeSave(save);
            }
          }
        });
      } else if (shopTab === 'mods') {
        const card = { x: W / 2, y: SHOP_GRID_Y + 62, w: W - 48, h: 124 };
        if (hit(x, y, card) && !save.startShield && save.acorns >= MOD_SHIELD_COST) {
          save.acorns -= MOD_SHIELD_COST;
          save.startShield = true;
          writeSave(save);
        }
      }
      return;
    }
    if (mode === 'ready' || mode === 'play') {
      flap();
      return;
    }
    if (mode === 'dead') {
      if (deadTimer > 0.6) bankRun();
    }
  }
  // End-of-run banking, shared by tap and keyboard paths. The start-shield
  // modifier is single-purchase: it expires when the run it armed ends,
  // whether or not the shield was used.
  function bankRun() {
    save.acorns += runAcorns;
    if (score > save.highScore) save.highScore = score;
    save.startShield = false;
    writeSave(save);
    mode = 'title';
  }

  function hit(x, y, b) {
    return x > b.x - b.w / 2 && x < b.x + b.w / 2 && y > b.y - b.h / 2 && y < b.y + b.h / 2;
  }

  canvas.addEventListener('pointerdown', onPointer, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (mode === 'title') { resetRun(); mode = 'ready'; }
      else if (mode === 'ready' || mode === 'play') flap();
      else if (mode === 'dead' && deadTimer > 0.6) bankRun();
    }
  });

  // —— update ——
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    titlePulse += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // ambient stars
    for (const s of stars) s.tw += dt * 2;

    // environment shifts with progress and crossfades over a couple of
    // seconds; a short banner announces the new region mid-run
    const envTarget = Math.floor(score / ENV_GATES) % ENVS.length;
    if (envTarget !== envB) {
      envA = envB;
      envB = envTarget;
      envBlend = 0;
      envMsgT = mode === 'play' ? 3 : 0;
    }
    if (envBlend < 1) envBlend = Math.min(1, envBlend + dt / 2);
    if (envMsgT > 0) envMsgT = Math.max(0, envMsgT - dt);

    if (mode === 'play') {
      const slow = (powerLeft > 0 || shieldSlow > 0) ? SLOW_FACTOR : 1;
      let simDt = dt * slow;

      // Shield aftermath: a short full freeze, then a slow-motion window.
      // The freeze runs on real time; the slow timer starts once it ends.
      if (shieldFreeze > 0) {
        shieldFreeze = Math.max(0, shieldFreeze - dt);
        simDt = 0;
      } else if (shieldSlow > 0) {
        shieldSlow = Math.max(0, shieldSlow - dt);
      }

      if (powerLeft > 0) {
        powerLeft = Math.max(0, powerLeft - dt);
      }

      // Black-hole warp: a one-second swirl (world frozen), then 15s of
      // mirrored, tilted flight, ended with the shield-style recovery.
      if (warpT > 0) {
        warpT = Math.max(0, warpT - dt);
        simDt = 0;
        if (warpT === 0) enterWarp();
      } else if (warpLeft > 0) {
        warpLeft = Math.max(0, warpLeft - dt);
        if (warpLeft === 0) exitWarp();
      }

      const d = difficulty();
      speed = d.speed;

      squirrel.vy += GRAVITY * simDt;
      squirrel.y += squirrel.vy * simDt;
      squirrel.rot = Math.max(-0.55, Math.min(0.9, squirrel.vy / 700));

      if (flapBoost > 0) flapBoost = Math.max(0, flapBoost - dt);

      const move = speed * simDt;
      distance += move;

      for (const p of planets) p.x -= move;
      for (const a of acorns) { a.x -= move; a.bob += dt * 4; }
      for (const a of powerups) { a.x -= move; a.bob += dt * 5; }
      for (const a of shields) { a.x -= move; a.bob += dt * 3; }
      for (const a of blackholes) { a.x -= move; a.bob += dt * 2.2; }

      // spawn — scroll tracker, keep at least one planet ahead
      lastSpawnX -= move;
      while (lastSpawnX < W + 80) {
        spawnPair(lastSpawnX + gapSpacing());
      }

      // cull
      planets = planets.filter(p => p.x > -80);
      acorns = acorns.filter(a => a.x > -40 && !a.got);
      powerups = powerups.filter(a => a.x > -40 && !a.got);
      shields = shields.filter(a => a.x > -40 && !a.got);
      blackholes = blackholes.filter(a => a.x > -40 && !a.got);

      // score
      const sx = W * SQUIRREL_X;
      for (const p of planets) {
        if (!p.scored && p.x + p.r < sx - 12) {
          p.scored = true;
          score += 1;
        }
      }

      // collisions — circle approx on squirrel
      const sr = 16;
      const sy = squirrel.y;
      // off screen
      if (hitCooldown > 0) hitCooldown = Math.max(0, hitCooldown - simDt);

      // Ceiling bounces you back down — only debris is lethal up there.
      // Falling off the bottom of the screen still ends the run.
      if (sy < sr && squirrel.vy < 0) {
        squirrel.y = sr;
        squirrel.vy = Math.abs(squirrel.vy) * 0.45 + 90;
        squirrel.rot = 0.5;
        spark(sx, 4, 'poof');
      }
      if (sy > H + 30) {
        die(); return;
      }

      // Debris ALWAYS kills — checked first, every frame, no cooldown.
      // (The bounce cooldown below only stops planet bounces re-triggering;
      // it must never grant safe passage through obstacles.)
      // The one exception is a carried shield acorn, which absorbs exactly
      // one debris hit and is consumed doing it.
      for (const p of planets) {
        for (const b of (p.blockers || [])) {
          const bx = p.x + (b.xOff || 0);
          if (circleHit(sx, sy, sr, bx, b.y, b.r * 0.92)) {
            if (hasShield) { absorbShield(bx, b.y); return; }
            die(); return;
          }
        }
      }

      // Main planets: recoverable bounce. During the bounce cooldown the
      // planets stay SOLID — the squirrel is pushed out of any overlap
      // instead of re-bounced. Skipping the check entirely let the player
      // phase straight through a planet they had just bounced off.
      outer:
      for (const p of planets) {
        const topY = p.gapY - p.gap / 2 - p.r;
        const botY = p.gapY + p.gap / 2 + p.r;
        for (const gy of [topY, botY]) {
          if (circleHit(sx, sy, sr, p.x, gy, p.r * 0.92)) {
            if (hitCooldown <= 0) { bounceOff(p.x, gy); break outer; }
            pushOut(p.x, gy, p.r * 0.92, sr);
          }
        }
      }

      // companion drifts along beside the squirrel
      if (save.equippedPal !== 'none') {
        const tx = sx - 42;
        const ty = sy - 22 + Math.sin(performance.now() / 1000 * 2.6) * 7;
        const k = Math.min(1, dt * (pal.dart > 0 ? 14 : 5));
        pal.x += (tx - pal.x) * k;
        pal.y += (ty - pal.y) * k;
        if (pal.dart > 0) pal.dart = Math.max(0, pal.dart - dt);
      }

      // acorn collect — the Acorn Buddy stretches the grab radius and darts
      // out to fetch anything inside it
      const grabR = save.equippedPal === 'buddy' ? 75 : 28;
      for (const a of acorns) {
        if (a.got) continue;
        const d = Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4));
        if (d < 28) {
          a.got = true;
          runAcorns += 1;
          spark(a.x, a.y, 'gold');
        } else if (d < grabR) {
          a.got = true;
          runAcorns += 1;
          pal.x = a.x;
          pal.y = a.y;
          pal.dart = 0.35;
          spark(a.x, a.y, 'gold');
        }
      }
      for (const a of powerups) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 5)) < 30) {
          a.got = true;
          powerLeft = POWER_DURATION;
          spark(a.x, a.y, 'cyan');
        }
      }
      for (const a of shields) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          hasShield = true;
          spark(a.x, a.y, 'shield');
        }
      }
      for (const a of blackholes) {
        if (!a.got && warpT === 0 && warpLeft === 0 &&
            Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          warpT = 1.0;                                  // swirl begins
          // five equally likely disorientations:
          //   0 backward · 1 backward tilt-up · 2 backward tilt-down
          //   3 forward tilt-up · 4 forward tilt-down
          const variant = Math.floor(Math.random() * 5);
          warpMirror = variant < 3;
          const TILT = 25 * Math.PI / 180;
          warpTilt = variant === 0 ? 0
                   : (variant === 1 || variant === 3) ? TILT : -TILT;
          spark(a.x, a.y, 'warp');
        }
      }
    }

    if (mode === 'dead') {
      deadTimer += dt;
      squirrel.vy += GRAVITY * dt * 0.6;
      squirrel.y += squirrel.vy * dt;
      squirrel.rot = Math.min(1.2, squirrel.rot + dt * 2);
    }

    // particles
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === 'flame') p.vy -= 40 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function circleHit(x1, y1, r1, x2, y2, r2) {
    return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
  }

  // Resolve overlap with a planet without applying a new impulse: move the
  // squirrel to the surface along its (fixed) x column and cancel velocity
  // into the planet.
  function pushOut(px, py, pr, sr) {
    const sx = W * SQUIRREL_X;
    const rr = pr + sr;
    const dx = sx - px;
    if (Math.abs(dx) >= rr) return;
    const dyNeed = Math.sqrt(rr * rr - dx * dx);
    const above = squirrel.y <= py;
    squirrel.y = above ? py - dyNeed : py + dyNeed;
    if (above ? squirrel.vy > 0 : squirrel.vy < 0) squirrel.vy = 0;
  }

  // Warp start: same fairness treatment as the shield recovery — recenter
  // the squirrel, vaporise debris around the respawn point, brief freeze.
  function enterWarp() {
    const sx = W * SQUIRREL_X;
    const cy = H * 0.45;
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b =>
        Math.hypot(p.x + (b.xOff || 0) - sx, b.y - cy) > 150);
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    warpLeft = 15;
    shieldFreeze = 0.4;
    spark(sx, cy, 'warp');
  }

  function exitWarp() {
    warpTilt = 0;
    warpMirror = true;
    shieldFreeze = 0.7;
    shieldSlow = 3;
    recoveryMsg = 'ORIENTATION RESTORED';
    spark(W * SQUIRREL_X, squirrel.y, 'warp');
  }

  function bounceOff(px, py) {
    // destabilize — recoverable, not instant death
    const sx = W * SQUIRREL_X;
    const sy = squirrel.y;
    let dx = sx - px, dy = sy - py;
    const dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;
    // Knockback scales with how hard the squirrel actually hit: a slow graze
    // gets a nudge, a full-speed dive gets a real bounce. A fixed impulse
    // here made every touch launch the squirrel across the screen.
    const impact = Math.abs(squirrel.vy);
    const mag = Math.min(560, 170 + impact * 0.5);
    squirrel.vy = dy * mag + (dy >= 0 ? 90 : -160);
    squirrel.y += dy * 14;
    squirrel.rot = dy >= 0 ? 0.85 : -0.55;
    hitCooldown = 0.55;
    spark(sx, sy, 'poof');
  }

  function die() {
    mode = 'dead';
    deadTimer = 0;
    spark(W * SQUIRREL_X, squirrel.y, 'poof');
  }

  // A carried shield absorbs one debris hit: burst at the impact point,
  // vaporise nearby debris so the respawn spot is fair, snap the squirrel
  // back to centre, freeze briefly, then give a slow-motion recovery window.
  function absorbShield(bx, by) {
    hasShield = false;
    const sx = W * SQUIRREL_X;
    const cy = H * 0.45;
    spark(bx, by, 'shield');
    spark(bx, by, 'poof');
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b => {
        const ax = p.x + (b.xOff || 0);
        return Math.hypot(ax - bx, b.y - by) > 110 &&
               Math.hypot(ax - sx, b.y - cy) > 150;
      });
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    shieldFreeze = 0.7;
    shieldSlow = 3;
    recoveryMsg = 'SHIELD ABSORBED!';
    spark(sx, cy, 'shield');
  }

  function spark(x, y, kind) {
    const n = kind === 'poof' ? 18 : kind === 'shield' || kind === 'warp' ? 16 : 10;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.35 + Math.random() * 0.3,
        max: 0.6,
        r: 2 + Math.random() * 3,
        kind: kind === 'cyan' ? 'cyan' : kind === 'gold' ? 'gold'
            : kind === 'shield' ? 'shield' : kind === 'warp' ? 'warp' : 'poof',
      });
    }
  }

  // —— draw ——
  function envMix(key, idx) {
    const a = ENVS[envA][key], b = ENVS[envB][key];
    return a[idx] + (b[idx] - a[idx]) * envBlend;
  }
  function envRgb(key) {
    return 'rgb(' + (envMix(key, 0) | 0) + ',' + (envMix(key, 1) | 0) + ',' + (envMix(key, 2) | 0) + ')';
  }
  function envRgba(key) {
    return 'rgba(' + (envMix(key, 0) | 0) + ',' + (envMix(key, 1) | 0) + ',' +
           (envMix(key, 2) | 0) + ',' + envMix(key, 3).toFixed(3) + ')';
  }

  function draw() {
    // space bg, tinted by the current environment
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, envRgb('top'));
    g.addColorStop(1, envRgb('bot'));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // nebula washes
    ctx.fillStyle = envRgba('wash');
    ctx.beginPath();
    ctx.ellipse(W * 0.7, H * 0.3, W * 0.5, H * 0.25, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = envRgba('wash2');
    ctx.beginPath();
    ctx.ellipse(W * 0.24, H * 0.68, W * 0.42, H * 0.2, -0.25, 0, Math.PI * 2);
    ctx.fill();

    for (const s of stars) {
      const pulse = 0.55 + 0.45 * Math.sin(s.tw);
      ctx.globalAlpha = s.a * pulse;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.bright) {
        ctx.globalAlpha = s.a * pulse * 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 2.5, s.y);
        ctx.lineTo(s.x + s.r * 2.5, s.y);
        ctx.moveTo(s.x, s.y - s.r * 2.5);
        ctx.lineTo(s.x, s.y + s.r * 2.5);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (mode === 'title') drawTitle();
    else if (mode === 'hangar') drawShop();
    else {
      // Warp is a pure RENDER transform: the simulation still scrolls the
      // same way, so every collision rule keeps working untouched. The
      // player sees the world mirrored (squirrel flying the other way) and
      // tilted ±25°; during the one-second swirl the scene spins and folds
      // through the mirror flip.
      const wp = warpT > 0 ? 1 - warpT : (warpLeft > 0 ? 1 : 0);
      if (wp > 0) {
        ctx.save();
        ctx.translate(W / 2, H / 2);
        const spin = warpT > 0 ? Math.sin(wp * Math.PI) * 2.6 : 0;
        ctx.rotate(warpTilt * wp + spin);
        ctx.scale(warpMirror ? 1 - 2 * wp : 1, 1);
        ctx.translate(-W / 2, -H / 2);
        drawWorld();
        ctx.restore();
        if (warpT > 0) drawVortex(1 - warpT);
      } else {
        drawWorld();
      }
      drawHUD();
      if (mode === 'ready') drawReady();
      if (mode === 'dead') drawDead();
    }
  }

  function drawWorld() {
    for (const p of planets) {
      drawPlanet(p.x, p.gapY - p.gap / 2 - p.r, p.r, p.topKind);
      drawPlanet(p.x, p.gapY + p.gap / 2 + p.r, p.r, p.botKind);
      for (const b of (p.blockers || [])) {
        drawObstacle(p.x + (b.xOff || 0), b.y, b);
      }
    }
    for (const a of acorns) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, false);
    }
    for (const a of powerups) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 5, true);
    }
    for (const a of shields) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'shield');
    }
    for (const a of blackholes) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'blackhole');
    }
    for (const p of particles) drawParticle(p);
    drawSquirrel(W * SQUIRREL_X, squirrel.y, squirrel.rot);
    if (save.equippedPal !== 'none') {
      drawPal(save.equippedPal, pal.x, pal.y, 1, performance.now() / 1000);
    }
  }


  function drawObstacle(x, y, b) {
    const r = b.r;
    const type = b.type || 'asteroid';
    const seed = b.seed || 0;
    const rot = (b.rot || 0) + (b.spin || 0) * (performance.now() / 1000);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // soft contact shadow under every obstacle
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(2, r * 0.55, r * 0.7, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'asteroid') {
      // irregular body
      const pts = 8;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const jitter = 0.72 + ((seed * (i + 3)) % 9) / 22;
        const px = Math.cos(a) * r * jitter;
        const py = Math.sin(a) * r * jitter;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const grd = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
      grd.addColorStop(0, '#c8b8a0');
      grd.addColorStop(0.45, '#8a7a64');
      grd.addColorStop(1, '#3a3028');
      ctx.fillStyle = grd;
      ctx.fill();
      // rim
      ctx.strokeStyle = 'rgba(255,230,200,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // craters with rims
      for (let i = 0; i < 4; i++) {
        const a = (seed * 0.7 + i * 1.7) % (Math.PI * 2);
        const d = r * (0.2 + (i % 3) * 0.15);
        const cr = r * (0.1 + (i % 3) * 0.05);
        const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
        ctx.fillStyle = 'rgba(25,20,15,0.5)';
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(180,160,130,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (type === 'debris') {
      // main plate
      const grd = ctx.createLinearGradient(-r, -r, r, r);
      grd.addColorStop(0, '#9aa2aa');
      grd.addColorStop(0.5, '#5a626c');
      grd.addColorStop(1, '#2a3038');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.lineTo(r * 0.95, r * 0.15);
      ctx.lineTo(-r * 0.35, r * 0.8);
      ctx.closePath();
      ctx.fill();
      // secondary shard
      ctx.fillStyle = '#4a525c';
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, r * 0.05);
      ctx.lineTo(r * 0.25, -r * 0.3);
      ctx.lineTo(r * 0.1, r * 0.6);
      ctx.closePath();
      ctx.fill();
      // heat edge
      ctx.strokeStyle = 'rgba(255,100,30,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.stroke();
      // rivets
      ctx.fillStyle = '#c0c8d0';
      [[-0.4,-0.1],[0.2,-0.4],[0.4,0.05],[-0.15,0.4]].forEach(([dx,dy]) => {
        ctx.beginPath(); ctx.arc(dx * r, dy * r, 1.6, 0, Math.PI * 2); ctx.fill();
      });
    } else if (type === 'satellite') {
      // body
      const bg = ctx.createLinearGradient(-r * 0.4, -r * 0.5, r * 0.4, r * 0.5);
      bg.addColorStop(0, '#e8eef4');
      bg.addColorStop(1, '#687480');
      ctx.fillStyle = bg;
      ctx.fillRect(-r * 0.38, -r * 0.45, r * 0.76, r * 0.9);
      // window
      ctx.fillStyle = 'rgba(80,180,255,0.55)';
      ctx.fillRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      // solar panels
      const panel = (x0) => {
        const pg = ctx.createLinearGradient(x0, 0, x0 + r * 0.55, 0);
        pg.addColorStop(0, '#1a4a7a');
        pg.addColorStop(0.5, '#3a8ad0');
        pg.addColorStop(1, '#1a4a7a');
        ctx.fillStyle = pg;
        ctx.fillRect(x0, -r * 0.3, r * 0.55, r * 0.6);
        ctx.strokeStyle = 'rgba(120,200,255,0.45)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const py = -r * 0.3 + i * r * 0.15;
          ctx.beginPath(); ctx.moveTo(x0 + 2, py); ctx.lineTo(x0 + r * 0.53, py); ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          const px = x0 + i * r * 0.18;
          ctx.beginPath(); ctx.moveTo(px, -r * 0.28); ctx.lineTo(px, r * 0.28); ctx.stroke();
        }
      };
      panel(-r * 1.1);
      panel(r * 0.55);
      // dish / antenna
      ctx.strokeStyle = '#d0d8e0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(0, -r * 0.95); ctx.stroke();
      ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(0, -r * 1.0, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.22, -2.2, -0.6); ctx.stroke();
    } else if (type === 'ufo') {
      // hull
      const hull = ctx.createRadialGradient(0, -r * 0.15, r * 0.1, 0, 0, r * 1.1);
      hull.addColorStop(0, '#f0f4f8');
      hull.addColorStop(0.4, '#90a0b8');
      hull.addColorStop(1, '#303848');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // rim ring
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.05, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      // dome
      const dome = ctx.createRadialGradient(-r * 0.1, -r * 0.35, r * 0.05, 0, -r * 0.15, r * 0.5);
      dome.addColorStop(0, 'rgba(180,240,255,0.85)');
      dome.addColorStop(0.6, 'rgba(60,160,220,0.55)');
      dome.addColorStop(1, 'rgba(20,60,100,0.35)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.18, r * 0.5, r * 0.4, 0, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // underglow lights
      for (let i = 0; i < 6; i++) {
        const a = -1.0 + i * 0.4;
        ctx.fillStyle = i % 2 ? '#ffd040' : '#40f0ff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.22 + r * 0.05, r * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    } else if (type === 'crystal') {
      // outer crystal
      const cg = ctx.createLinearGradient(0, -r, 0, r);
      cg.addColorStop(0, 'rgba(220,180,255,0.95)');
      cg.addColorStop(0.45, 'rgba(140,70,230,0.9)');
      cg.addColorStop(1, 'rgba(60,20,120,0.85)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.lineTo(r * 0.35, r * 0.9);
      ctx.lineTo(-r * 0.4, r * 0.75);
      ctx.lineTo(-r * 0.65, -r * 0.15);
      ctx.closePath();
      ctx.fill();
      // inner highlight facet
      ctx.fillStyle = 'rgba(255,240,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.75);
      ctx.lineTo(r * 0.28, -r * 0.05);
      ctx.lineTo(0, r * 0.35);
      ctx.lineTo(-r * 0.28, -r * 0.05);
      ctx.closePath();
      ctx.fill();
      // edge shine
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -r * 0.55);
      ctx.lineTo(r * 0.15, r * 0.25);
      ctx.stroke();
      // glow
      ctx.strokeStyle = 'rgba(180,100,255,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.stroke();
    } else if (type === 'rock') {
      const rg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      rg.addColorStop(0, '#9a9080');
      rg.addColorStop(0.5, '#5a5048');
      rg.addColorStop(1, '#2a2420');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.98, r * 0.82, 0.35, 0, Math.PI * 2);
      ctx.fill();
      // lumps
      ctx.fillStyle = '#7a7060';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.28, r * 0.4, r * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(20,16,12,0.45)';
      ctx.beginPath(); ctx.arc(r * 0.3, r * 0.2, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.28, r * 0.14, 0, Math.PI * 2); ctx.fill();
      // highlight
      ctx.strokeStyle = 'rgba(220,200,170,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-r * 0.15, -r * 0.35, r * 0.35, r * 0.2, -0.4, 0, Math.PI * 2);
      ctx.stroke();
    } else { // junk
      // barrel body
      const jg = ctx.createLinearGradient(-r * 0.7, 0, r * 0.7, 0);
      jg.addColorStop(0, '#5a3a20');
      jg.addColorStop(0.4, '#c08040');
      jg.addColorStop(1, '#4a3018');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.72, r * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      // bands
      ctx.strokeStyle = '#e0a860';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      // rust spots
      ctx.fillStyle = 'rgba(80,40,10,0.4)';
      ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.1, r * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
      // metal strut
      ctx.strokeStyle = '#b0b8c0';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r * 0.45, -r * 0.7);
      ctx.lineTo(r * 1.15, r * 0.35);
      ctx.stroke();
      // joint ball
      const bg2 = ctx.createRadialGradient(r * 1.1, r * 0.3, 1, r * 1.15, r * 0.35, r * 0.2);
      bg2.addColorStop(0, '#e0e8f0');
      bg2.addColorStop(1, '#505860');
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.arc(r * 1.15, r * 0.35, r * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPlanet(x, y, r, kind) {
    const palettes = [
      // 0 ocean earth
      ['#2a6aa8', '#1a4068', '#6eb8e8', '#3a9a5a', '#1a5a38'],
      // 1 golden ringed
      ['#d4a84a', '#a07828', '#f0d88a', '#c9a04a', '#8a6020'],
      // 2 icy moon
      ['#b0c0d0', '#788898', '#e8f0f8', '#a0b0c0', '#606878'],
      // 3 lava / mars
      ['#c04020', '#701808', '#e87040', '#a03018', '#ff9040'],
      // 4 teal gas
      ['#1a9080', '#0c5848', '#5ad0b8', '#2a8070', '#0a4038'],
      // 5 rock grey
      ['#6a6e78', '#3c4048', '#a0a4ac', '#5a5e66', '#2a2c30'],
      // 6 desert
      ['#b07030', '#704018', '#e0a060', '#986028', '#503010'],
      // 7 deep blue gas
      ['#142850', '#081830', '#3a68a0', '#1e4070', '#0a1830'],
      // 8 pink alien
      ['#c06078', '#782840', '#e8a0b0', '#a04858', '#501828'],
    ];
    const [c1, c2, c3, c4, c5] = palettes[kind % palettes.length];

    // soft outer atmosphere glow
    const atmo = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.25);
    atmo.addColorStop(0, 'rgba(0,0,0,0)');
    atmo.addColorStop(0.7, 'rgba(160,200,255,0.04)');
    atmo.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.fillStyle = atmo;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // base sphere with richer lighting
    const grd = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.04, x + r * 0.15, y + r * 0.2, r * 1.05);
    grd.addColorStop(0, c3);
    grd.addColorStop(0.35, c1);
    grd.addColorStop(0.75, c2);
    grd.addColorStop(1, c5 || c2);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // surface detail (clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    if (kind === 0) { // earth continents + clouds
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.65;
      [[-0.2,-0.15,0.5,0.32,-0.5],[0.28,0.18,0.35,0.22,0.4],[-0.05,0.35,0.28,0.18,0.1]].forEach(([dx,dy,rx,ry,rot]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, rot, 0, Math.PI*2);
        ctx.fill();
      });
      // cloud wisps
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.22;
      [[0.1,-0.3,0.3,0.1],[ -0.3,0.1,0.25,0.08],[0.25,0.3,0.2,0.07]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 1 || kind === 7) { // gas bands
      for (let i = -3; i <= 3; i++) {
        ctx.strokeStyle = i % 2 === 0 ? c4 : c5;
        ctx.globalAlpha = 0.28 + (i % 2) * 0.1;
        ctx.lineWidth = r * (0.1 + Math.abs(i) * 0.02);
        ctx.beginPath();
        ctx.ellipse(x, y + i * r * 0.18, r * 0.96, r * 0.16, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // storm oval
      ctx.fillStyle = c3;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(x + r * 0.25, y + r * 0.1, r * 0.22, r * 0.14, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (kind === 2 || kind === 5) { // craters + maria
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.35;
      [[-0.3,-0.25,0.22],[0.25,0.1,0.18],[-0.05,0.35,0.15],[0.35,-0.3,0.12],[-0.35,0.15,0.1],[0.1,-0.05,0.08]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
        // rim highlight
        ctx.strokeStyle = c3;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = c5;
      });
      ctx.globalAlpha = 1;
    } else if (kind === 3) { // lava + cracks
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.55;
      [[-0.15,-0.2,0.2],[0.2,0.15,0.18],[-0.25,0.25,0.12]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#ff9040';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.2;
      [[-0.45,-0.2,0.1,0.15,0.4,-0.1],[-0.2,0.3,0.15,0.05,0.45,0.2],[0.1,-0.35,0.0,-0.1,0.3,0.05]].forEach(([x1,y1,cx,cy,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x + x1 * r, y + y1 * r);
        ctx.quadraticCurveTo(x + cx * r, y + cy * r, x + x2 * r, y + y2 * r);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 4 || kind === 8) { // soft spots + haze
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.3;
      [[0.15,-0.2,0.4,0.28],[ -0.25,0.15,0.3,0.22]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x + dx * r, y + dy * r, r * rx, r * ry, 0.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 6) { // desert dunes
      ctx.strokeStyle = c5;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.8, y + i * r * 0.22);
        ctx.quadraticCurveTo(x, y + i * r * 0.22 - r * 0.08, x + r * 0.8, y + i * r * 0.22);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // terminator / night side soft shadow
    const night = ctx.createLinearGradient(x - r, y, x + r, y);
    night.addColorStop(0, 'rgba(0,0,0,0)');
    night.addColorStop(0.55, 'rgba(0,0,0,0)');
    night.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = night;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // rings (drawn outside clip)
    if (kind === 1) {
      ctx.strokeStyle = 'rgba(212,175,55,0.8)';
      ctx.lineWidth = Math.max(2.5, r * 0.08);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.45, r * 0.28, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(212,175,55,0.35)';
      ctx.lineWidth = Math.max(1.2, r * 0.04);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.62, r * 0.32, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      // ring shadow on planet
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.95, r * 0.2, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (kind === 4) {
      ctx.strokeStyle = 'rgba(100,220,200,0.5)';
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.22, 0.18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 7) {
      ctx.strokeStyle = 'rgba(100,140,220,0.45)';
      ctx.lineWidth = Math.max(1.8, r * 0.05);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.3, r * 0.2, -0.12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(100,140,220,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.42, r * 0.24, -0.12, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 2) {
      // thin icy ring
      ctx.strokeStyle = 'rgba(200,220,240,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.25, r * 0.15, 0.1, 0, Math.PI * 2);
      ctx.stroke();
    }

    // crisp limb highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAcorn(x, y, power) {
    const shield = power === 'shield';
    const hole = power === 'blackhole';
    ctx.save();
    ctx.translate(x, y);
    if (hole) {
      // dark core with a swirling accretion ring
      const t = performance.now() / 1000;
      const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 26);
      glow.addColorStop(0, 'rgba(20,0,40,0.9)');
      glow.addColorStop(0.5, 'rgba(120,40,200,0.28)');
      glow.addColorStop(1, 'rgba(120,40,200,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,130,255,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 6.5, t * 0.8 % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,190,90,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 4.6, (t * 0.8 + 0.9) % (Math.PI * 2), 0, Math.PI * 2);
      ctx.stroke();
    } else if (shield) {
      // protective bubble around the nut
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
      glow.addColorStop(0, 'rgba(110,255,170,0.4)');
      glow.addColorStop(0.55, 'rgba(60,220,130,0.16)');
      glow.addColorStop(1, 'rgba(60,220,130,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 17, -2.3, -1.2);
      ctx.stroke();
    } else if (power) {
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
      glow.addColorStop(0, 'rgba(100,230,255,0.45)');
      glow.addColorStop(0.5, 'rgba(60,180,255,0.18)');
      glow.addColorStop(1, 'rgba(60,180,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
    }
    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(1, 12, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // nut body with gradient
    const nut = ctx.createRadialGradient(-3, 0, 2, 0, 4, 12);
    if (hole) {
      nut.addColorStop(0, '#3a2a55');
      nut.addColorStop(0.5, '#1a1030');
      nut.addColorStop(1, '#05020c');
    } else if (shield) {
      nut.addColorStop(0, '#c8ffde');
      nut.addColorStop(0.5, '#4ade80');
      nut.addColorStop(1, '#14683a');
    } else if (power) {
      nut.addColorStop(0, '#c0f0ff');
      nut.addColorStop(0.5, '#5ad0f0');
      nut.addColorStop(1, '#1a70a0');
    } else {
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(0.5, '#c47a28');
      nut.addColorStop(1, '#6a3a10');
    }
    ctx.fillStyle = nut;
    ctx.beginPath();
    ctx.ellipse(0, 3, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // stem notch line
    ctx.strokeStyle = power ? 'rgba(20,80,120,0.35)' : 'rgba(60,30,10,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(0, 10);
    ctx.stroke();
    // cap
    const cap = ctx.createRadialGradient(0, -6, 1, 0, -4, 12);
    if (hole) {
      cap.addColorStop(0, '#6a3aa8');
      cap.addColorStop(1, '#241040');
    } else if (shield) {
      cap.addColorStop(0, '#3fbf74');
      cap.addColorStop(1, '#0c4a28');
    } else if (power) {
      cap.addColorStop(0, '#6ec8e8');
      cap.addColorStop(1, '#1a6088');
    } else {
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
    }
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(0, -5, 11.5, 7.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-11, -6, 22, 4);
    // cap texture ridges
    ctx.strokeStyle = power ? 'rgba(255,255,255,0.2)' : 'rgba(255,200,120,0.2)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 4, -8); ctx.lineTo(i * 3.2, -3);
      ctx.stroke();
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-3.5, 1, 2.8, 4.5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPal(id, x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (id === 'buddy') {
      // small acorn person with a sparkle jet
      ctx.fillStyle = 'rgba(255,220,120,0.5)';
      ctx.beginPath();
      ctx.arc(-8, 3 + Math.sin(t * 9) * 1.2, 1.6, 0, Math.PI * 2);
      ctx.fill();
      const nut = ctx.createRadialGradient(-2, 0, 1, 0, 2, 8);
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(1, '#7a4515');
      ctx.fillStyle = nut;
      ctx.beginPath();
      ctx.ellipse(0, 2, 6, 7.2, 0, 0, Math.PI * 2);
      ctx.fill();
      const cap = ctx.createRadialGradient(0, -4, 1, 0, -3, 8);
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
      ctx.fillStyle = cap;
      ctx.beginPath();
      ctx.ellipse(0, -3.4, 7.4, 4.8, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(-7.4, -4, 14.8, 2.4);
      ctx.strokeStyle = '#5a3a18';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, -6); ctx.lineTo(0, -8.4);
      ctx.stroke();
      // face
      ctx.fillStyle = '#241207';
      ctx.beginPath(); ctx.arc(-1.8, 1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(2.4, 1, 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#241207';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.arc(0.3, 3.2, 1.7, 0.25, Math.PI - 0.25);
      ctx.stroke();
      // cheeks
      ctx.fillStyle = 'rgba(255,140,110,0.4)';
      ctx.beginPath(); ctx.arc(-3.6, 2.7, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.2, 2.7, 1, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'bee') {
      // wings behind the body, flapping fast
      const w = Math.sin(t * 26) * 0.6;
      ctx.fillStyle = 'rgba(220,240,255,0.7)';
      ctx.save();
      ctx.rotate(-0.5 + w);
      ctx.beginPath(); ctx.ellipse(-1, -6.5, 2.6, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.rotate(0.25 - w);
      ctx.beginPath(); ctx.ellipse(2, -6, 2.2, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      const bg = ctx.createRadialGradient(-2, -2, 1, 0, 0, 8);
      bg.addColorStop(0, '#ffd95c');
      bg.addColorStop(1, '#c88a10');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 5.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2808';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * 2.6, 0, 1.1, 5.4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      // helmet dome (it IS an astro bee)
      ctx.strokeStyle = 'rgba(200,230,255,0.8)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(4.2, -1.6, 3.6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#241207';
      ctx.beginPath(); ctx.arc(4.6, -1.8, 0.9, 0, Math.PI * 2); ctx.fill();
      // stinger
      ctx.fillStyle = '#3a2808';
      ctx.beginPath();
      ctx.moveTo(-6.8, 0); ctx.lineTo(-9.4, 0.8); ctx.lineTo(-6.6, 1.8);
      ctx.closePath();
      ctx.fill();
    } else if (id === 'ufo') {
      const hull = ctx.createRadialGradient(0, -2, 1, 0, 0, 9);
      hull.addColorStop(0, '#eef4fa');
      hull.addColorStop(0.5, '#93a3ba');
      hull.addColorStop(1, '#39435a');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      const dome = ctx.createRadialGradient(-1, -3.5, 0.5, 0, -2, 4.5);
      dome.addColorStop(0, 'rgba(190,245,255,0.9)');
      dome.addColorStop(1, 'rgba(40,120,190,0.5)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -1.6, 4.2, 3.4, 0, Math.PI, 0);
      ctx.fill();
      // pilot dot
      ctx.fillStyle = '#2a4a2a';
      ctx.beginPath(); ctx.arc(0.4, -2.6, 1.2, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const on = Math.floor(t * 5 + i) % 4 === 0;
        ctx.fillStyle = on ? '#40f0ff' : 'rgba(255,208,64,0.5)';
        ctx.beginPath();
        ctx.arc(-6 + i * 4, 1.6, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawVortex(p) {
    // swirling black hole overlay during the transition second
    const cx = W / 2, cy = H / 2;
    const grow = Math.sin(p * Math.PI);           // swells then fades
    ctx.save();
    ctx.globalAlpha = 0.85 * grow;
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 120);
    g.addColorStop(0, 'rgba(0,0,0,0.95)');
    g.addColorStop(0.35, 'rgba(30,10,50,0.75)');
    g.addColorStop(0.7, 'rgba(90,40,150,0.3)');
    g.addColorStop(1, 'rgba(90,40,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, 120, 0, Math.PI * 2);
    ctx.fill();
    // spiral arms
    ctx.strokeStyle = 'rgba(180,92,255,0.8)';
    ctx.lineWidth = 2;
    for (let a = 0; a < 3; a++) {
      ctx.beginPath();
      for (let i = 0; i < 26; i++) {
        const th = i * 0.32 + a * (Math.PI * 2 / 3) + p * 9;
        const rr = 6 + i * 4 * grow;
        const px = cx + Math.cos(th) * rr;
        const py = cy + Math.sin(th) * rr * 0.8;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawParticle(p) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    if (p.kind === 'flame') {
      ctx.fillStyle = t > 0.5 ? '#ffe080' : t > 0.25 ? '#ff8030' : '#ff4020';
    } else if (p.kind === 'cyan') {
      ctx.fillStyle = '#6ef0ff';
    } else if (p.kind === 'gold') {
      ctx.fillStyle = '#ffd060';
    } else if (p.kind === 'shield') {
      ctx.fillStyle = '#5dff9e';
    } else if (p.kind === 'warp') {
      ctx.fillStyle = '#b45cff';
    } else if (p.kind === 'ion') {
      // stretched plasma streak
      ctx.strokeStyle = t > 0.5 ? '#c8f4ff' : '#3ac0f0';
      ctx.lineWidth = Math.max(0.8, p.r * t);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 9, p.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'bubble') {
      // hollow bubble that pops near the end of its life
      ctx.strokeStyle = 'rgba(170,220,255,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const br = t > 0.25 ? p.r : p.r * (1 + (0.25 - t) * 6);
      ctx.arc(p.x, p.y, br, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200,235,255,0.25)';
      ctx.beginPath();
      ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'bloom') {
      // petal puff that expands as it fades
      ctx.fillStyle = t > 0.5 ? '#f0b8ff' : '#a45cd8';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (2 - t), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = Math.max(0, t) * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      return;
    } else if (p.kind === 'comet') {
      ctx.fillStyle = t > 0.5 ? '#fff3c8' : '#ffb830';
    } else {
      ctx.fillStyle = '#e8dcc8';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * t, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function equippedHelmet() {
    return HELMETS.find(h => h.id === save.equipped) || HELMETS[0];
  }

  function equippedSuit() {
    return SUITS.find(s => s.id === save.equippedSuit) || SUITS[0];
  }

  // ——————————————————————————————————————————————————————————
  //  CHARACTER RENDERING
  //  One renderer drives gameplay, the title screen and both shop grids,
  //  so the squirrel is identical everywhere it appears.
  //  Local space: origin at the chest, facing right.
  //  Art extents before scaling: x -37..27, y -34..20
  // ——————————————————————————————————————————————————————————

  const _rgba = {};
  function withAlpha(hex, a) {
    const key = hex + '|' + a;
    let v = _rgba[key];
    if (v) return v;
    const h = hex.replace('#', '');
    const full = h.length === 3 ? h[0] + h[0] + h[1] + h[1] + h[2] + h[2] : h;
    const n = parseInt(full, 16);
    v = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    _rgba[key] = v;
    return v;
  }

  // —— tail ——————————————————————————————————————————————————
  // A tapered plume swept along a spline: thin at the hip, broad through the
  // middle, drawn to a point at the tip. The width modulation on the edges is
  // what makes it read as fur rather than as a wing.
  // Width stays nearly constant along the plume and the tip is left broad —
  // the discs give it a soft rounded cap. A thin→bulge→point profile reads
  // as a snake that swallowed an egg, not fur.
  // Proportions follow a real squirrel: slim at the hip, a gentle swell
  // through the middle, and a soft taper at the tip — not an even sausage.
  // The tip stops beside the helmet rather than curling over the head.
  const TAIL_PTS = [
    [-2, 13], [-12, 12], [-20, 4.5], [-23, -7], [-19.5, -17.5], [-13.5, -23],
  ];
  const TAIL_W = [3.2, 5.4, 6.6, 7.0, 5.8, 3.0];
  // Sample count only needs to be dense enough that the discs overlap; the
  // spline is ~60px long, so 26 samples still leaves heavy overlap.
  const TAIL_N = 26;

  function splinePoint(pts, u) {
    const n = pts.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
    const f2 = f * f, f3 = f2 * f;
    const comp = (a, b, c, d) =>
      0.5 * (2 * b + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);
    return [comp(p0[0], p1[0], p2[0], p3[0]), comp(p0[1], p1[1], p2[1], p3[1])];
  }

  function tailWidth(u) {
    const n = TAIL_W.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    return TAIL_W[i] * (1 - f) + TAIL_W[i + 1] * f;
  }

  // The spline never changes, so it is sampled once at load instead of every
  // frame — the hangar draws nine of these characters per frame.
  const TAIL_SAMPLES = (function () {
    const seg = TAIL_PTS.length - 1;
    const out = [];
    for (let k = 0; k <= TAIL_N; k++) {
      const u = (k / TAIL_N) * seg;
      const p = splinePoint(TAIL_PTS, u);
      const q = splinePoint(TAIL_PTS, Math.min(u + 0.05, seg));
      let dx = q[0] - p[0], dy = q[1] - p[1];
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      out.push({
        x: p[0], y: p[1], w: tailWidth(u),
        nx: -dy, ny: dx,
        // phase normalised so the lobe count does not change with TAIL_N;
        // kept subtle — a hint of fur without looking like a cloud
        lobe: 1 + 0.05 * Math.sin((k / TAIL_N) * 26 - 0.6)
                + 0.025 * Math.sin((k / TAIL_N) * 47 + 1.7),
      });
    }
    return out;
  })();

  // The tail is swept as a union of tapered discs rather than a pair of
  // offset curves: offsetting folds in on itself where the tail bends hardest
  // and puts a notch in the silhouette, whereas overlapping discs cannot.
  function tailPath(wMul, shift, lobes) {
    const mul = wMul || 1;
    ctx.beginPath();
    for (let k = 0; k < TAIL_SAMPLES.length; k++) {
      const s = TAIL_SAMPLES[k];
      let r = s.w * mul;
      if (lobes) r *= s.lobe;
      const cx = shift ? s.x + s.nx * s.w * shift : s.x;
      const cy = shift ? s.y + s.ny * s.w * shift : s.y;
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
  }

  function drawTail(suit) {
    // emissive edge, drawn as a slightly larger silhouette behind the tail
    if (suit.glow) {
      tailPath(1.16, 0, true);
      ctx.fillStyle = withAlpha(suit.glow, 0.26);
      ctx.fill();
    }

    // dark keyline, same trick — a larger silhouette behind the fill
    tailPath(1.07, 0, true);
    ctx.fillStyle = suit.furDark;
    ctx.fill();

    tailPath(1, 0, true);
    const g = ctx.createLinearGradient(-30, 14, -4, -26);
    g.addColorStop(0, suit.furDark);
    g.addColorStop(0.35, suit.fur);
    g.addColorStop(0.82, suit.fur);
    g.addColorStop(1, suit.belly);
    ctx.fillStyle = g;
    ctx.fill();

    // lighter inner streak — the two-tone underside real squirrels have
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = 0.36;
    ctx.fillStyle = suit.belly;
    tailPath(0.46, -0.38, false);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // a few fur strands for texture
    ctx.strokeStyle = withAlpha(suit.furDark, 0.32);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    for (let i = 1; i <= 6; i++) {
      const s = TAIL_SAMPLES[Math.round((i / 7.2) * (TAIL_SAMPLES.length - 1))];
      // strands lean back along the plume like brushed fur
      const lean = 0.35;
      ctx.beginPath();
      ctx.moveTo(s.x + s.nx * s.w * 0.2, s.y + s.ny * s.w * 0.2);
      ctx.lineTo(s.x + s.nx * s.w * 0.88 - s.ny * s.w * lean,
                 s.y + s.ny * s.w * 0.88 + s.nx * s.w * lean);
      ctx.stroke();
    }
  }

  // —— body ——————————————————————————————————————————————————
  function drawSuitBody(suit) {
    // hind haunch
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(-6, 10, 8.4, 8.0, 0.18, 0, Math.PI * 2);
    ctx.fill();

    // little legs dangling beneath the suit, trailing slightly in flight
    const leg = (hx, hy, fx, fy, footR) => {
      ctx.strokeStyle = suit.suitDark;
      ctx.lineWidth = 4.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo((hx + fx) / 2 - 1.2, (hy + fy) / 2, fx, fy);
      ctx.stroke();
      // paw
      ctx.fillStyle = suit.furDark;
      ctx.beginPath();
      ctx.ellipse(fx + 1.1, fy + 0.6, footR, footR * 0.62, 0.15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = withAlpha(suit.suitDark, 0.75);
      ctx.lineWidth = 0.7;
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(fx + 2.2 + i * 1.4, fy - 0.6);
        ctx.lineTo(fx + 3.0 + i * 1.4, fy + 1.4);
        ctx.stroke();
      }
    };
    leg(-3.5, 13, -2, 19.5, 3.4);   // hind leg off the haunch
    leg(6, 13, 7.8, 18.5, 3.0);     // front leg under the chest

    // torso
    const g = ctx.createRadialGradient(-4, 2, 2, 1, 9, 18);
    g.addColorStop(0, suit.suitLite);
    g.addColorStop(0.5, suit.suit);
    g.addColorStop(1, suit.suitDark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // chest panel
    ctx.fillStyle = withAlpha(suit.trim, 0.2);
    ctx.beginPath();
    ctx.ellipse(2.5, 9, 6.8, 7.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // shoulder trim stripe
    ctx.strokeStyle = suit.trim;
    ctx.lineWidth = 2.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9.5, 4.5);
    ctx.quadraticCurveTo(-2, 0.6, 6, 3.4);
    ctx.stroke();

    // control panel on the belly
    ctx.fillStyle = suit.suitDark;
    roundRect(1.5, 9.5, 6.5, 5.5, 1.8);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.trim, 0.7);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.fillStyle = suit.trim;
    ctx.beginPath();
    ctx.arc(3.4, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.glow || suit.trim;
    ctx.beginPath();
    ctx.arc(6.2, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();

    // front paws, held forward the way a squirrel holds a nut
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(9.5, 10.5, 4.2, 3.3, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(12.4, 9.0, 3.0, 2.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.suitDark, 0.85);
    ctx.lineWidth = 0.7;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(13.6 + i * 1.3, 7.8 + i * 0.9);
      ctx.lineTo(14.9 + i * 1.2, 9.1 + i * 0.9);
      ctx.stroke();
    }

    // rim light so the silhouette separates from the starfield
    ctx.strokeStyle = suit.glow ? withAlpha(suit.glow, 0.8) : 'rgba(255,236,200,0.32)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0.35, 2.6);
    ctx.stroke();
  }

  // —— head ——————————————————————————————————————————————————
  function drawHead(suit) {
    // far ear (behind the head)
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(6.0, -20.6, 3.2, 5.2, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // head
    const hg = ctx.createRadialGradient(7.5, -15, 2, 11, -9, 15);
    hg.addColorStop(0, suit.fur);
    hg.addColorStop(0.62, suit.fur);
    hg.addColorStop(1, suit.furDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(10, -11, 9.6, 9.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // cheek fluff
    ctx.fillStyle = withAlpha(suit.belly, 0.5);
    ctx.beginPath();
    ctx.ellipse(11.4, -6.8, 5.0, 3.3, 0.25, 0, Math.PI * 2);
    ctx.fill();

    // near ear, with inner pink and a tuft
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(11.4, -19.8, 3.8, 5.6, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eeae94';
    ctx.beginPath();
    ctx.ellipse(11.6, -19.4, 1.8, 3.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = suit.furDark;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10.4, -24.2); ctx.lineTo(9.5, -26.6);
    ctx.moveTo(12.8, -24.0); ctx.lineTo(13.6, -26.4);
    ctx.stroke();

    // muzzle
    ctx.fillStyle = suit.belly;
    ctx.beginPath();
    ctx.ellipse(16.4, -8.6, 5.2, 4.2, 0.16, 0, Math.PI * 2);
    ctx.fill();

    // buck teeth — the strongest "this is a rodent" cue
    ctx.fillStyle = '#fffaf0';
    roundRect(17.2, -6.3, 3.8, 4.3, 1.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,110,70,0.55)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(19.1, -6.1); ctx.lineTo(19.1, -2.2);
    ctx.stroke();

    // nose
    ctx.fillStyle = '#3a2418';
    ctx.beginPath();
    ctx.ellipse(20.2, -10.0, 2.0, 1.6, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(19.7, -10.6, 0.7, 0.5, 0.35, 0, Math.PI * 2);
    ctx.fill();

    // whiskers
    ctx.strokeStyle = withAlpha(suit.belly, 0.5);
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(19.2, -8.4); ctx.lineTo(23.6, -9.6);
    ctx.moveTo(19.2, -7.6); ctx.lineTo(23.4, -6.7);
    ctx.stroke();

    // eye
    ctx.fillStyle = '#181008';
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 2.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(14.3, -13.9, 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(12.5, -11.9, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.furDark, 0.85);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 4.6, -2.5, -1.15);
    ctx.stroke();
  }

  // —— atmosphere ————————————————————————————————————————————
  function drawAura(color, t, seed) {
    const pulse = 0.88 + 0.12 * Math.sin(t * 1.7 + seed);
    const r = 42 * pulse;
    const g = ctx.createRadialGradient(0, -4, 8, 0, -4, r);
    g.addColorStop(0, withAlpha(color, 0.2));
    g.addColorStop(0.45, withAlpha(color, 0.08));
    g.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -4, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cosmic dust drifting around the character. Positions come from the clock
  // so no per-instance state is needed and every shop cell can differ.
  function drawDust(color, t, seed, front) {
    const n = front ? 3 : 7;
    const off = (front ? 31 : 0) + seed * 3.7;
    for (let i = 0; i < n; i++) {
      const k = i * 1.9 + off;
      const a = t * 0.5 + k;
      const rad = 26 + 11 * Math.sin(t * 0.65 + k);
      const mx = Math.cos(a) * rad * 1.1;
      const my = -5 + Math.sin(a) * rad * 0.78;
      const tw = 0.5 + 0.5 * Math.sin(t * 2.1 + k * 2.2);
      ctx.globalAlpha = (front ? 0.55 : 0.8) * (0.2 + 0.6 * tw);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(mx, my, 0.7 + 1.5 * tw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawThruster(f, suit) {
    const len = 10 + 16 * f;
    const g = ctx.createLinearGradient(-9, 15, -9 - len, 15);
    g.addColorStop(0, withAlpha(suit.trim, 0.95 * f));
    g.addColorStop(0.35, 'rgba(255,190,70,' + (0.85 * f) + ')');
    g.addColorStop(1, 'rgba(255,70,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-8, 12.5);
    ctx.quadraticCurveTo(-9 - len, 15.5, -8, 18.5);
