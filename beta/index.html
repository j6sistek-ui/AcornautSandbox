    ctx.quadraticCurveTo(-5, 15.5, -8, 12.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,248,190,' + (0.9 * f) + ')';
    ctx.beginPath();
    ctx.moveTo(-8, 13.8);
    ctx.quadraticCurveTo(-10 - len * 0.45, 15.5, -8, 17.2);
    ctx.quadraticCurveTo(-6, 15.5, -8, 13.8);
    ctx.fill();
  }

  // —— helmet ————————————————————————————————————————————————
  const HELM_C = { x: 11, y: -11, r: 15.2 };

  function drawHelmet(helm, suit, t, seed) {
    const c = HELM_C;

    if (helm.glow) {
      const pulse = 0.9 + 0.1 * Math.sin(t * 2 + seed);
      const g = ctx.createRadialGradient(c.x, c.y, c.r * 0.85, c.x, c.y, c.r * 1.5 * pulse);
      g.addColorStop(0, withAlpha(helm.glow, 0.34));
      g.addColorStop(0.5, withAlpha(helm.glow, 0.12));
      g.addColorStop(1, withAlpha(helm.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 1.5 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // glass tint — kept light so the squirrel's face stays readable
    ctx.fillStyle = withAlpha(helm.visor, helm.tint);
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    // curved-glass depth toward the lower right
    const dg = ctx.createRadialGradient(c.x - 5, c.y - 6, 2, c.x + 2, c.y + 3, c.r);
    dg.addColorStop(0, 'rgba(255,255,255,0.1)');
    dg.addColorStop(0.55, 'rgba(255,255,255,0)');
    dg.addColorStop(1, withAlpha(helm.trim, 0.28));
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.clip();
    drawVisorArt(helm, t, seed);
    ctx.restore();

    // specular highlights
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.ellipse(c.x - 5.5, c.y - 6.5, 6.4, 4.8, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -2.35, -1.15);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -0.75, -0.15);
    ctx.stroke();

    // rim
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = withAlpha(helm.trim, 0.85);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 1.9, 0, Math.PI * 2);
    ctx.stroke();

    drawHelmetOrnament(helm, t, seed);

    // neck seal — opaque, so the dome reads as sitting on the suit
    ctx.fillStyle = suit.suitDark;
    roundRect(2.5, 0.5, 17, 7, 3.2);
    ctx.fill();
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = withAlpha(helm.rim, 0.45);
    ctx.beginPath();
    ctx.ellipse(11, 2.4, 7.2, 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 1 ? (helm.glow || helm.rim) : withAlpha(suit.trim, 0.9);
      ctx.beginPath();
      ctx.arc(6.5 + i * 4.5, 5.6, 1.0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawVisorArt(helm, t, seed) {
    const c = HELM_C;
    if (helm.id === 'ion') {
      ctx.strokeStyle = 'rgba(120,230,255,0.4)';
      ctx.lineWidth = 0.8;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(c.x - 14, c.y + i * 6 + 2);
        ctx.lineTo(c.x + 14, c.y + i * 6 - 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(140,240,255,0.6)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(c.x + 5, c.y - 5, 4.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'nebula') {
      // Additive so it reads as a galaxy reflected in the glass rather than
      // paint covering the squirrel's face, and offset up-left off the face.
      ctx.globalCompositeOperation = 'lighter';
      const gx = c.x - 6, gy = c.y - 6;
      const g = ctx.createRadialGradient(gx, gy, 1, gx, gy, 13);
      g.addColorStop(0, 'rgba(150,80,170,0.5)');
      g.addColorStop(0.45, 'rgba(90,30,130,0.3)');
      g.addColorStop(1, 'rgba(40,10,70,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,130,220,0.5)';
      ctx.lineWidth = 1.2;
      for (let a = 0; a < 2; a++) {
        ctx.beginPath();
        for (let i = 0; i < 18; i++) {
          const th = i * 0.3 + a * Math.PI + t * 0.35;
          const rr = i * 0.44;
          const px = gx + Math.cos(th) * rr;
          const py = gy + Math.sin(th) * rr * 0.75;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    } else if (helm.id === 'lunar') {
      ctx.fillStyle = 'rgba(120,135,160,0.32)';
      const craters = [[-7, -10, 2.5], [1, -13, 1.9], [8, -10.5, 2.8], [-2, -7, 1.5], [12, -5, 2.1]];
      for (let i = 0; i < craters.length; i++) {
        ctx.beginPath();
        ctx.arc(c.x + craters[i][0], c.y + craters[i][1], craters[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (helm.id === 'void') {
      // additive rings high on the dome, clear of the face
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(150,80,220,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 10, 2.8, -0.3 + Math.sin(t * 0.4) * 0.06, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,130,60,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 6.4, 1.8, -0.3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'cherry') {
      ctx.strokeStyle = 'rgba(255,200,220,0.45)';
      ctx.lineWidth = 1.1;
      const pts = [[0, -12.5], [10, -4.5], [6, 8], [-6, 8], [-10, -4.5]];
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        if (i === 0) ctx.moveTo(c.x + pts[i][0], c.y + pts[i][1]);
        else ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.stroke();
    } else if (helm.id === 'solar') {
      ctx.strokeStyle = 'rgba(255,210,130,0.35)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(c.x + 2, c.y + 2, 4 + i * 4, -2.6, -0.6);
        ctx.stroke();
      }
    } else if (helm.id === 'royal') {
      ctx.strokeStyle = 'rgba(255,220,140,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'aurora') {
      // northern-lights curtains reflected in the glass
      ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        ctx.strokeStyle = 'rgba(' + (60 + k * 30) + ',' + (200 - k * 25) + ',170,0.4)';
        ctx.lineWidth = 3.2 - k * 0.8;
        ctx.beginPath();
        for (let i = 0; i <= 12; i++) {
          const px = c.x - 12 + i * 2;
          const py = c.y - 9 + k * 3.4 + Math.sin(i * 0.8 + t * 1.6 + k * 1.4) * 2.6;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    } else if (helm.id === 'meteor') {
      // shooting-star streaks
      ctx.strokeStyle = 'rgba(255,200,130,0.5)';
      ctx.lineWidth = 1.2;
      for (let k = 0; k < 3; k++) {
        const f = ((t * 0.8 + k * 0.37) % 1);
        const px = c.x + 11 - f * 22;
        const py = c.y - 11 + f * 15 + k * 2.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + 5.5, py - 4);
        ctx.stroke();
      }
    } else if (helm.id === 'chrono') {
      // ticking clock face
      ctx.strokeStyle = 'rgba(255,232,160,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y - 1, 8.5, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(c.x + Math.cos(a) * 7.2, c.y - 1 + Math.sin(a) * 7.2);
        ctx.lineTo(c.x + Math.cos(a) * 8.5, c.y - 1 + Math.sin(a) * 8.5);
        ctx.stroke();
      }
      const mins = Math.floor(t) % 60;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - 1);
      ctx.lineTo(c.x + Math.cos(t * 0.6) * 6.5, c.y - 1 + Math.sin(t * 0.6) * 6.5);
      ctx.moveTo(c.x, c.y - 1);
      ctx.lineTo(c.x + Math.cos(mins * 0.5) * 4.2, c.y - 1 + Math.sin(mins * 0.5) * 4.2);
      ctx.stroke();
    }
  }

  function drawHelmetOrnament(helm, t, seed) {
    const c = HELM_C;
    const id = helm.id;

    if (id === 'clear') {
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x - 12.2, c.y + 6.4, 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x - 13.8, c.y - 1, 1.6, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'ion') {
      const flick = 0.75 + 0.25 * Math.sin(t * 7 + seed);
      ctx.strokeStyle = helm.rim;
      ctx.lineWidth = 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x - 6, c.y - 13.5); ctx.lineTo(c.x - 8.5, c.y - 21);
      ctx.moveTo(c.x + 6, c.y - 13.5); ctx.lineTo(c.x + 8.5, c.y - 21);
      ctx.stroke();
      ctx.fillStyle = helm.glow;
      ctx.beginPath(); ctx.arc(c.x - 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x + 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      // crackling arc between the tips, not a smooth handle
      ctx.strokeStyle = withAlpha(helm.glow, 0.85 * flick);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(c.x - 8.5, c.y - 22);
      const steps = 5;
      for (let i = 1; i <= steps; i++) {
        const px = c.x - 8.5 + (17 * i) / steps;
        const wob = (i % 2 ? -1 : 1) * (1.6 + 1.4 * Math.sin(t * 9 + i + seed));
        ctx.lineTo(px, c.y - 24.5 + wob);
      }
      ctx.stroke();

    } else if (id === 'solar') {
      ctx.fillStyle = helm.rim;
      const angles = [-1.15, -0.72, -0.29, 0.14, 0.57];
      for (let i = 0; i < angles.length; i++) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(angles[i]);
        ctx.beginPath();
        ctx.moveTo(-3.2, -c.r + 1.5);
        ctx.lineTo(0, -c.r - 7);
        ctx.lineTo(3.2, -c.r + 1.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = withAlpha('#ffe9a8', 0.9);
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.5, 2.0, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'nebula') {
      for (let i = 0; i < 3; i++) {
        const a = t * 0.9 + i * 2.1 + seed;
        const mx = c.x + Math.cos(a) * (c.r + 5);
        const my = c.y + Math.sin(a) * (c.r + 5) * 0.55;
        ctx.fillStyle = withAlpha('#ffd7ff', 0.85);
        ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = withAlpha('#ffd7ff', 0.4);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(mx - 3.2, my); ctx.lineTo(mx + 3.2, my);
        ctx.moveTo(mx, my - 3.2); ctx.lineTo(mx, my + 3.2);
        ctx.stroke();
      }

    } else if (id === 'lunar') {
      ctx.fillStyle = helm.rim;
      roundRect(c.x - 6.5, c.y - c.r - 5, 13, 4.6, 2);
      ctx.fill();
      ctx.fillStyle = '#f2f6ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.7, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x + 1.5, c.y - c.r - 3.3, 2.8, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'void') {
      // orbital rings ride high on the dome so they never cross the face
      const ry = c.y - 7;
      ctx.strokeStyle = withAlpha('#d4af37', 0.9);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 4, (c.r + 4) * 0.3, -0.34 + Math.sin(t * 0.5) * 0.05, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = withAlpha('#b45cff', 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 7, (c.r + 7) * 0.27, -0.34, 0, Math.PI * 2);
      ctx.stroke();

    } else if (id === 'comet') {
      const f = 0.85 + 0.15 * Math.sin(t * 6 + seed);
      ctx.fillStyle = helm.rim;
      ctx.beginPath();
      ctx.moveTo(c.x - 5, c.y - c.r + 1);
      ctx.quadraticCurveTo(c.x - 3, c.y - c.r - 11 * f, c.x + 3, c.y - c.r - 4.5);
      ctx.quadraticCurveTo(c.x + 5, c.y - c.r - 9 * f, c.x + 8, c.y - c.r + 2);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 5, c.y - c.r + 1);
      ctx.fill();
      ctx.fillStyle = '#ffd77a';
      ctx.beginPath();
      ctx.moveTo(c.x - 2, c.y - c.r);
      ctx.quadraticCurveTo(c.x, c.y - c.r - 7 * f, c.x + 3, c.y - c.r - 1);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 2, c.y - c.r);
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = (t * 1.4 + i * 0.7 + seed) % 1;
        ctx.fillStyle = withAlpha('#ff9a3c', 0.8 * (1 - k));
        ctx.beginPath();
        ctx.arc(c.x - 14 - k * 12, c.y - 8 + Math.sin(i * 2 + t * 3) * 3, 1.8 * (1 - k) + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'cherry') {
      for (let i = 0; i < 4; i++) {
        const a = t * 0.7 + i * 1.6 + seed;
        const px = c.x + Math.cos(a) * (c.r + 6);
        const py = c.y + Math.sin(a * 1.1) * (c.r + 3) * 0.6;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        ctx.fillStyle = withAlpha('#ffc2da', 0.9);
        ctx.beginPath();
        ctx.ellipse(0, 0, 2.5, 1.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = helm.rim;
      for (let i = 0; i < 5; i++) {
        const a = -1.9 + i * 0.42;
        ctx.beginPath();
        ctx.ellipse(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 2.2, 1.4, a, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'royal') {
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(c.x - 9.5, c.y - c.r + 2);
      ctx.lineTo(c.x - 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x - 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x, c.y - c.r - 10);
      ctx.lineTo(c.x + 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x + 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x + 9.5, c.y - c.r + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fff0b8';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.fillStyle = '#ff6080';
      ctx.beginPath(); ctx.arc(c.x - 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#60c0ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 10.6, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7dffb0';
      ctx.beginPath(); ctx.arc(c.x + 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = 0.5 + 0.5 * Math.sin(t * 3 + i * 2.1 + seed);
        const sx = c.x - 11 + i * 11;
        const sy = c.y - c.r - 13 - i * 1.5;
        ctx.strokeStyle = withAlpha('#ffe9a8', k);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx - 2.4 * k, sy); ctx.lineTo(sx + 2.4 * k, sy);
        ctx.moveTo(sx, sy - 2.4 * k); ctx.lineTo(sx, sy + 2.4 * k);
        ctx.stroke();
      }

    } else if (id === 'aurora') {
      // flowing light ribbon above the dome
      ctx.lineCap = 'round';
      for (let k = 0; k < 2; k++) {
        ctx.strokeStyle = withAlpha(k ? '#5dffd0' : '#8fffb8', 0.75 - k * 0.25);
        ctx.lineWidth = 2.4 - k;
        ctx.beginPath();
        for (let i = 0; i <= 14; i++) {
          const px = c.x - 14 + i * 2;
          const py = c.y - c.r - 5 - k * 3 + Math.sin(i * 0.55 + t * 2.2 + k) * 3.2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

    } else if (id === 'meteor') {
      // bronze rivets on the rim + two tiny orbiting rocks
      ctx.fillStyle = '#7a4a20';
      for (let i = 0; i < 4; i++) {
        const a = -2.2 + i * 0.55;
        ctx.beginPath();
        ctx.arc(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 2; i++) {
        const a = t * (i ? 1.1 : -0.8) + i * 2.6 + seed;
        const mx = c.x + Math.cos(a) * (c.r + 6);
        const my = c.y + Math.sin(a) * (c.r + 6) * 0.5;
        const rg = ctx.createRadialGradient(mx - 1, my - 1, 0.4, mx, my, 3);
        rg.addColorStop(0, '#c8a078');
        rg.addColorStop(1, '#5a3a1c');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(mx + 2.6, my);
        ctx.lineTo(mx + 0.8, my - 2.4);
        ctx.lineTo(mx - 2.2, my - 1.2);
        ctx.lineTo(mx - 2.4, my + 1.6);
        ctx.lineTo(mx + 0.6, my + 2.5);
        ctx.closePath();
        ctx.fill();
      }

    } else if (id === 'chrono') {
      // brass gear crest, slowly turning
      const a0 = t * 0.9;
      const gx = c.x, gy = c.y - c.r - 6;
      ctx.fillStyle = '#c9a94f';
      for (let i = 0; i < 8; i++) {
        const a = a0 + (i / 8) * Math.PI * 2;
        ctx.save();
        ctx.translate(gx + Math.cos(a) * 5.5, gy + Math.sin(a) * 5.5);
        ctx.rotate(a);
        ctx.fillRect(-1.4, -1.6, 2.8, 3.2);
        ctx.restore();
      }
      const gg = ctx.createRadialGradient(gx - 1.5, gy - 1.5, 1, gx, gy, 6);
      gg.addColorStop(0, '#ffe9a8');
      gg.addColorStop(1, '#8a6a24');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(gx, gy, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a2c10';
      ctx.beginPath();
      ctx.arc(gx, gy, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The one entry point. Everything in the game draws the character through
  // this, which is what keeps the hangar and gameplay identical.
  function drawAstronaut(x, y, rot, scale, helm, suit, opts) {
    opts = opts || {};
    const flame = opts.flame || 0;
    const seed = opts.seed || 0;
    const t = performance.now() / 1000;

    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (scale !== 1) ctx.scale(scale, scale);

    if (suit.glow) drawAura(suit.glow, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, false);
    if (flame > 0) drawThruster(flame, suit);
    drawTail(suit);
    drawSuitBody(suit);
    drawHead(suit);
    drawHelmet(helm, suit, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, true);

    // protective bubble while carrying a shield acorn
    if (opts.shield) {
      const pu = 0.94 + 0.06 * Math.sin(t * 3.2 + seed);
      const r = 37 * pu;
      const g = ctx.createRadialGradient(0, -5, r * 0.6, 0, -5, r);
      g.addColorStop(0, 'rgba(93,255,158,0)');
      g.addColorStop(1, 'rgba(93,255,158,0.16)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.75)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, -5, r - 2.5, -2.3, -1.3);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSquirrel(x, y, rot) {
    const flame = (flapBoost > 0 && (mode === 'play' || mode === 'ready')) ? flapBoost / 0.22 : 0;
    drawAstronaut(x, y, rot, 1, equippedHelmet(), equippedSuit(),
                  { flame: flame, seed: 0, shield: hasShield && (mode === 'play' || mode === 'ready') });
  }

  // Small acorn glyph for the HUD and shop headers — drawn rather than an
  // emoji, which renders differently on every platform.
  function drawAcornIcon(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#c47a28';
    ctx.beginPath();
    ctx.ellipse(0, 2.5, 4.6, 5.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8b060';
    ctx.beginPath();
    ctx.ellipse(-1.4, 1.4, 1.9, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a3a10';
    ctx.beginPath();
    ctx.ellipse(0, -2.6, 5.8, 3.6, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-5.8, -3.2, 11.6, 1.8);
    ctx.strokeStyle = '#8a5a28';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -5.6);
    ctx.lineTo(0, -7.4);
    ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    // score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), W / 2, 48);

    // high score
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + save.highScore, W / 2, 68);

    // run acorns
    ctx.textAlign = 'left';
    ctx.font = '600 14px system-ui';
    ctx.fillStyle = '#ffd080';
    drawAcornIcon(22, 23, 1);
    ctx.fillText(String(runAcorns), 32, 28);

    // carried shield indicator
    if (hasShield) {
      ctx.strokeStyle = 'rgba(140,255,190,0.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(22, 47, 9, 0, Math.PI * 2);
      ctx.stroke();
      drawAcornIcon(22, 46, 0.65);
      ctx.fillStyle = '#8cffbe';
      ctx.font = '600 12px system-ui';
      ctx.fillText('SHIELD', 36, 51);
    }

    // region banner when the environment shifts
    if (envMsgT > 0 && mode === 'play') {
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, envMsgT / 0.8);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '600 11px system-ui';
      ctx.fillText('ENTERING', W / 2, 108);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 17px system-ui';
      ctx.fillText(ENVS[envB].name, W / 2, 128);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }

    // warp status
    if (warpLeft > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 14px system-ui';
      ctx.fillText('BLACK HOLE  ' + Math.ceil(warpLeft) + 's', W / 2, 92);
      ctx.textAlign = 'left';
    }
    if (warpT > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#c084fc';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('BLACK HOLE!', W / 2, H * 0.3);
      ctx.textAlign = 'left';
    }

    // recovery banner — labelled by whatever caused the recovery, so the
    // warp ending never claims a shield was spent
    if (warpT === 0 && recoveryMsg && (shieldFreeze > 0 || shieldSlow > 2.2)) {
      ctx.textAlign = 'center';
      ctx.fillStyle = recoveryMsg === 'SHIELD ABSORBED!' ? '#5dff9e' : '#c084fc';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(recoveryMsg, W / 2, H * 0.3);
      ctx.font = '600 13px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('get ready…', W / 2, H * 0.3 + 22);
      ctx.textAlign = 'left';
    }

    // power-up timer
    if (powerLeft > 0) {
      const secs = Math.ceil(powerLeft);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui';
      ctx.fillStyle = '#6ef0ff';
      ctx.fillText('⏱ SLOW  ' + secs + 's', W / 2, 92);
      // bar
      const bw = 120;
      const pct = powerLeft / POWER_DURATION;
      ctx.fillStyle = 'rgba(110,240,255,0.2)';
      ctx.fillRect(W / 2 - bw / 2, 100, bw, 5);
      ctx.fillStyle = '#6ef0ff';
      ctx.fillRect(W / 2 - bw / 2, 100, bw * pct, 5);
    }
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 18px system-ui';
    ctx.textAlign = 'center';
    const pulse = 0.85 + 0.15 * Math.sin(titlePulse * 4);

    ctx.font = 'bold 28px system-ui';

    ctx.font = '600 18px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';

    ctx.fillStyle = '#ffd080';

  // Single source of truth for the title menu geometry — drawTitle renders
  // these rects and handleTap hit-tests the same ones, so the buttons and
  // their tap targets can never drift apart.
  function titleButtons() {
    const bw = Math.min(216, W * 0.56), bh = 56;

      { id: 'fly',    x: bx, y: y0,      w: bw, h: bh, label: 'FLY' },

    ];

  function drawTitle() {
    // decorative planets
    drawPlanet(W * 0.15, H * 0.16, 28, 0);
    drawPlanet(W * 0.88, H * 0.12, 22, 4);
    drawPlanet(W * 0.82, H * 0.34, 36, 1);

    drawWordmark(W / 2, H * 0.2 - 30, 36);
    ctx.textAlign = 'center';
    ctx.font = '600 13px system-ui';

    ctx.fillStyle = '#ffd080';

    drawAstronaut(W / 2 + 6, H * 0.445, Math.sin(titlePulse * 2) * 0.06, 1.85,
                  equippedHelmet(), equippedSuit(), { seed: 3 });

  // 'ACORNAUT' drawn as a geometric vector wordmark — a space-style
  // letterform that needs no font file, so it renders identically on every
  // platform (system fonts can't be trusted for a logo).
  const WORDMARK = {
    A: [[[0, 10], [2.1, 0], [3.9, 0], [6, 10]], [[1.15, 6.5], [4.85, 6.5]]],
    C: [[[6, 1.6], [4.4, 0], [1.6, 0], [0, 1.6], [0, 8.4], [1.6, 10], [4.4, 10], [6, 8.4]]],
    O: [[[1.6, 0], [4.4, 0], [6, 1.6], [6, 8.4], [4.4, 10], [1.6, 10], [0, 8.4], [0, 1.6], [1.6, 0]]],
    R: [[[0, 10], [0, 0], [4.6, 0], [6, 1.4], [6, 4.2], [4.6, 5.6], [0, 5.6]], [[3.2, 5.6], [6, 10]]],
    N: [[[0, 10], [0, 0], [6, 10], [6, 0]]],
    U: [[[0, 0], [0, 8.4], [1.6, 10], [4.4, 10], [6, 8.4], [6, 0]]],
    T: [[[0, 0], [6, 0]], [[3, 0], [3, 10]]],
  };

  function drawWordmark(cx, top, h) {
    const word = 'ACORNAUT';
    const u = h / 10;
    const lw = 6 * u;
    const gapW = 3.2 * u;
    const total = word.length * lw + (word.length - 1) * gapW;
    let x = cx - total / 2;

    const g = ctx.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#bfe6ff');
    g.addColorStop(1, '#4ab8ff');

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? 'rgba(80,180,255,0.28)' : g;
      ctx.lineWidth = pass === 0 ? 0.62 * h * 0.28 : 0.36 * h * 0.28;
      let lx = x;
      for (const ch of word) {
        for (const stroke of WORDMARK[ch]) {
          ctx.beginPath();
          for (let i = 0; i < stroke.length; i++) {
            const px = lx + stroke[i][0] * u;
            const py = top + stroke[i][1] * u;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.stroke();
        }
        lx += lw + gapW;
      }
    }
    // a small star dotting the wordmark
    ctx.fillStyle = '#ffe27a';
    const sx = cx + total / 2 + 8;
    const sy = top - 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 4);
    ctx.lineTo(sx + 1.2, sy - 1.2);
    ctx.lineTo(sx + 4, sy);
    ctx.lineTo(sx + 1.2, sy + 1.2);
    ctx.lineTo(sx, sy + 4);
    ctx.lineTo(sx - 1.2, sy + 1.2);
    ctx.lineTo(sx - 4, sy);
    ctx.lineTo(sx - 1.2, sy - 1.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawMenuBtn(b, primary, icon) {
    ctx.fillStyle = primary ? 'rgba(58,140,255,0.92)' : 'rgba(140,170,220,0.13)';
    roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 17);
    ctx.fill();
    ctx.strokeStyle = primary ? 'rgba(255,255,255,0.4)' : 'rgba(160,190,230,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    icon(b.x - b.w / 2 + 29, b.y);
    ctx.fillStyle = primary ? '#fff' : 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 19px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x - b.w / 2 + 52, b.y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
  }

  function iconRocket(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.quadraticCurveTo(6, -4, 4.5, 4);
    ctx.lineTo(-4.5, 4);
    ctx.quadraticCurveTo(-6, -4, 0, -11);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4.5, 0.5); ctx.lineTo(-8.5, 8); ctx.lineTo(-3.5, 5.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4.5, 0.5); ctx.lineTo(8.5, 8); ctx.lineTo(3.5, 5.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(20,45,90,0.9)';
    ctx.beginPath(); ctx.arc(0, -3.5, 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(-2, 6);
    ctx.quadraticCurveTo(0, 11.5, 2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function iconHangar(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, 8);
    ctx.lineTo(-9, -1);
    ctx.quadraticCurveTo(-9, -9, 0, -9);
    ctx.quadraticCurveTo(9, -9, 9, -1);
    ctx.lineTo(9, 8);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11.5, 8); ctx.lineTo(11.5, 8); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4, 8);
    ctx.lineTo(-4, 2);
    ctx.quadraticCurveTo(-4, -1.5, 0, -1.5);
    ctx.quadraticCurveTo(4, -1.5, 4, 2);
    ctx.lineTo(4, 8);
    ctx.stroke();
    ctx.restore();
  }

  function iconSuit(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(0, -6.5, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6.5, 9);
    ctx.lineTo(-6.5, 2);
    ctx.quadraticCurveTo(-6.5, -1, -3, -1);
    ctx.lineTo(3, -1);
    ctx.quadraticCurveTo(6.5, -1, 6.5, 2);
    ctx.lineTo(6.5, 9);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, 9); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawShopHeader(title) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(16, 26, 80, 36, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px system-ui';
    ctx.fillText('← BACK', 28, 49);
    ctx.font = 'bold 22px system-ui';
    ctx.fillText(title, 110, 50);
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = '#ffd080';
    drawAcornIcon(30, 73, 1);
    ctx.fillText(String(save.acorns), 42, 78);
  }

  // ——— tabbed shop ————————————————————————————————————————————
  const SHOP_TABS = [
    { id: 'helmets', label: 'HELMETS' },
    { id: 'suits',   label: 'SUITS' },
    { id: 'mods',    label: 'MODS' },
    { id: 'trails',  label: 'TRAILS' },
    { id: 'pals',    label: 'PALS' },
  ];
  const SHOP_GRID_Y = 140;

  // Geometry shared by drawing and tap handling, same pattern as the title
  // menu — the tabs and their touch targets cannot drift apart.
  function shopTabRects() {
    const tw = (W - 32) / SHOP_TABS.length;
    return SHOP_TABS.map((t, i) => ({
      id: t.id, label: t.label,
      x: 16 + i * tw + tw / 2, y: 100, w: tw - 5, h: 34,
    }));
  }

  function shopCellRect(i) {
    const cols = 3;
    const cellW = (W - 48) / cols;
    return {
      x: 24 + (i % cols) * cellW + cellW / 2,
      y: SHOP_GRID_Y + Math.floor(i / cols) * 118 + 44,
    };
  }

  function drawShop() {
    drawShopHeader('HANGAR');

    for (const t of shopTabRects()) {
      const active = shopTab === t.id;
      ctx.fillStyle = active ? 'rgba(58,156,255,0.3)' : 'rgba(255,255,255,0.07)';
      roundRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h, 9);
      ctx.fill();
      if (active) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.fillStyle = active ? '#fff' : 'rgba(255,255,255,0.6)';
      ctx.font = 'bold 10.5px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(t.label, t.x, t.y + 4);
    }

    if (shopTab === 'mods') drawModsTab();
    else drawRoster(shopRoster());
  }

  // Which purchasable roster the current tab shows, and which save fields
  // hold its ownership + equipped state. Used by drawing AND tap handling.
  function shopRoster() {
    if (shopTab === 'helmets') return { list: HELMETS, own: 'unlocked', eq: 'equipped', kind: 'helmet' };
    if (shopTab === 'suits') return { list: SUITS, own: 'unlockedSuits', eq: 'equippedSuit', kind: 'suit' };
    if (shopTab === 'trails') return { list: TRAILS, own: 'unlockedTrails', eq: 'equippedTrail', kind: 'trail' };
    if (shopTab === 'pals') return { list: PALS, own: 'unlockedPals', eq: 'equippedPal', kind: 'pal' };
    return null;
  }

  function drawRoster(roster) {
    const helm = equippedHelmet();
    const suit = equippedSuit();
    const t = performance.now() / 1000;
    roster.list.forEach((item, i) => {
      const c = shopCellRect(i);
      const unlocked = save[roster.own].includes(item.id);
      const eq = save[roster.eq] === item.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(c.x - 50, c.y - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(c.x - 50, c.y - 48, 100, 100, 14);
        ctx.stroke();
      }

      // Grid cells render from a cached sprite (12 live characters per frame
      // is too many gradients for low-end phones); the equipped one stays
      // live so its glow and ornaments keep animating.
      if (roster.kind === 'helmet' || roster.kind === 'suit') {
        if (eq) {
          if (roster.kind === 'helmet') drawAstronaut(c.x + 4.5, c.y - 4, 0, 0.82, item, suit, { seed: i * 1.7 });
          else drawAstronaut(c.x + 4.5, c.y - 4, 0, 0.82, helm, item, { seed: i * 2.3 });
        } else {
          ctx.drawImage(rosterSprite(roster.kind, item, i), c.x - 56, c.y - 60, 112, 112);
        }
      }
      else if (roster.kind === 'trail') drawTrailPreview(item.id, c.x, c.y - 8, t);
      else drawPalPreview(item.id, c.x, c.y - 8, t);

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(item.name, c.x, c.y + 36);
      if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        const ct = String(item.cost);
        const cw = ctx.measureText(ct).width;
        ctx.fillText(ct, c.x - 7, c.y + 50);
        drawAcornIcon(c.x - 7 + cw / 2 + 8, c.y + 46, 0.8);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', c.x, c.y + 50);
      }
    });

    // one-line description under the pals grid
    if (roster.kind === 'pal') {
      const sel = PALS.find(p => p.id === save.equippedPal) || PALS[0];
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 12px system-ui';
      const rows = Math.ceil(roster.list.length / 3);
      ctx.fillText(sel.name.toUpperCase() + ' — ' + sel.desc,
                   W / 2, SHOP_GRID_Y + rows * 118 + 14);
    }
  }

  let spriteCache = {};
  function rosterSprite(kind, item, i) {
    const key = [kind, item.id, save.equipped, save.equippedSuit, dpr].join(':');
    let cv = spriteCache[key];
    if (!cv) {
      if (Object.keys(spriteCache).length > 80) spriteCache = {};
      cv = document.createElement('canvas');
      cv.width = cv.height = Math.ceil(112 * dpr);
      const main = ctx;
      ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 51.5 * dpr, 56 * dpr);
      if (kind === 'helmet') drawAstronaut(4.5, -4, 0, 0.82, item, equippedSuit(), { seed: i * 1.7 });
      else drawAstronaut(4.5, -4, 0, 0.82, equippedHelmet(), item, { seed: i * 2.3 });
      ctx = main;
      spriteCache[key] = cv;
    }
    return cv;
  }

  function drawTrailPreview(id, cx, cy, t) {
    // a stylised burst frozen mid-flap
    const ph = (t * 2) % 1;
    ctx.save();
    ctx.translate(cx + 16, cy);
    if (id === 'sparks') {
      const g = ctx.createLinearGradient(0, 0, -34, 0);
      g.addColorStop(0, 'rgba(255,224,128,0.95)');
      g.addColorStop(0.5, 'rgba(255,128,48,0.8)');
      g.addColorStop(1, 'rgba(255,64,32,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.quadraticCurveTo(-36, 0, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffe080';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(-8 - ((ph * 26 + i * 9) % 28), (i % 2 ? -1 : 1) * (4 - i), 2.2 - i * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'ion') {
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const off = (ph * 30 + i * 8) % 32;
        ctx.strokeStyle = i % 2 ? '#c8f4ff' : '#3ac0f0';
        ctx.lineWidth = 2 - i * 0.3;
        ctx.beginPath();
        ctx.moveTo(-2 - off, -4 + i * 2.6);
        ctx.lineTo(-12 - off, -4 + i * 2.6);
        ctx.stroke();
      }
    } else if (id === 'bubble') {
      ctx.strokeStyle = 'rgba(170,220,255,0.9)';
      for (let i = 0; i < 4; i++) {
        const off = (ph * 26 + i * 8) % 30;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(-4 - off, (i % 2 ? -1 : 1) * (5 - i), 2 + i, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (id === 'bloom') {
      for (let i = 0; i < 4; i++) {
        const off = (ph * 24 + i * 8) % 30;
        ctx.fillStyle = i % 2 ? '#f0b8ff' : '#a45cd8';
        ctx.beginPath();
        ctx.arc(-4 - off, (i % 2 ? -1 : 1) * (4 - i * 0.5), 2 + i * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (id === 'comet') {
      const g = ctx.createLinearGradient(0, 0, -36, 0);
      g.addColorStop(0, 'rgba(255,243,200,0.95)');
      g.addColorStop(0.5, 'rgba(255,184,48,0.7)');
      g.addColorStop(1, 'rgba(255,140,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(2, -4.5);
      ctx.quadraticCurveTo(-38, 0, 2, 4.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff3c8';
      ctx.beginPath();
      ctx.arc(1, 0, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPalPreview(id, cx, cy, t) {
    if (id === 'none') {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy + 10);
      ctx.lineTo(cx + 10, cy - 10);
      ctx.stroke();
    } else {
      drawPal(id, cx, cy + Math.sin(t * 2.4) * 3, 1.9, t);
    }
  }

  function drawModsTab() {
    const cardY = SHOP_GRID_Y;
    const ready = !!save.startShield;
    const affordable = save.acorns >= MOD_SHIELD_COST;

    ctx.fillStyle = ready ? 'rgba(93,255,158,0.12)' : 'rgba(255,255,255,0.06)';
    roundRect(24, cardY, W - 48, 124, 14);
    ctx.fill();
    ctx.strokeStyle = ready ? 'rgba(93,255,158,0.7)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5;
    roundRect(24, cardY, W - 48, 124, 14);
    ctx.stroke();

    ctx.save();
    ctx.translate(64, cardY + 56);
    ctx.scale(1.25, 1.25);
    drawAcorn(0, 0, 'shield');
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui';
    ctx.fillText('SHIELD START', 106, cardY + 36);
    ctx.font = '600 12px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('Begin your next run with a', 106, cardY + 56);
    ctx.fillText('shield already active.', 106, cardY + 72);
    ctx.fillText('One run only.', 106, cardY + 88);

    if (ready) {
      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 13px system-ui';
      ctx.fillText('READY — next run', 106, cardY + 110);
    } else {
      ctx.fillStyle = affordable ? '#ffd080' : 'rgba(255,208,128,0.45)';
      ctx.font = 'bold 13px system-ui';
      const ct = 'BUY  ' + MOD_SHIELD_COST;
      ctx.fillText(ct, 106, cardY + 110);
      drawAcornIcon(112 + ctx.measureText(ct).width + 8, cardY + 106, 0.8);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '600 12px system-ui';
    ctx.fillText('More modifiers coming soon', W / 2, cardY + 160);
  }

  window.addEventListener('resize', resize);
  resize();
  initStars();
  requestAnimationFrame(frame);

  // BETA ONLY: debug hook so automated tests can inspect and stage game
  // state. Must never ship in the live build.
  window.__acornautDebug = {
    get mode() { return mode; },
    set mode(m) { mode = m; },
    get squirrel() { return squirrel; },
    get planets() { return planets; },
    get W() { return W; },
    get H() { return H; },
    get SQUIRREL_X() { return SQUIRREL_X; },
    get shields() { return shields; },
    get hasShield() { return hasShield; },
    set hasShield(v) { hasShield = v; },
    get shieldFreeze() { return shieldFreeze; },
    get shieldSlow() { return shieldSlow; },
    get save() { return save; },
    get hitCooldown() { return hitCooldown; },
    get shopTab() { return shopTab; },
    get blackholes() { return blackholes; },
    get warpT() { return warpT; },
    get warpLeft() { return warpLeft; },
    set warpLeft(v) { warpLeft = v; },
    get warpTilt() { return warpTilt; },
    get warpMirror() { return warpMirror; },
    get recoveryMsg() { return recoveryMsg; },
    get particles() { return particles; },
    get runAcorns() { return runAcorns; },
    get distance() { return distance; },
    set distance(v) { distance = v; },
    get score() { return score; },
    set score(v) { score = v; },
    get envB() { return envB; },
    get envBlend() { return envBlend; },
    get envName() { return ENVS[envB].name; },
    get lastGapY() { return lastGapY; },
    spawnPair,
    get pal() { return pal; },
    get acorns() { return acorns; },
    resetRun,
    flap,
  };
})();
</script>

<!-- No service worker in the beta build: test pages must always load the newest code. -->
