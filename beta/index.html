    ctx.lineTo(-4.5, 4);
    ctx.quadraticCurveTo(-6, -4, 0, -11);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4.5, 0.5); ctx.lineTo(-8.5, 8); ctx.lineTo(-3.5, 5.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4.5, 0.5); ctx.lineTo(8.5, 8); ctx.lineTo(3.5, 5.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(20,45,90,0.9)';
    ctx.beginPath(); ctx.arc(0, -3.5, 2.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(-2, 6);
    ctx.quadraticCurveTo(0, 11.5, 2, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function iconHangar(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, 8);
    ctx.lineTo(-9, -1);
    ctx.quadraticCurveTo(-9, -9, 0, -9);
    ctx.quadraticCurveTo(9, -9, 9, -1);
    ctx.lineTo(9, 8);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-11.5, 8); ctx.lineTo(11.5, 8); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-4, 8);
    ctx.lineTo(-4, 2);
    ctx.quadraticCurveTo(-4, -1.5, 0, -1.5);
    ctx.quadraticCurveTo(4, -1.5, 4, 2);
    ctx.lineTo(4, 8);
    ctx.stroke();
    ctx.restore();
  }

  function iconSuit(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.arc(0, -6.5, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6.5, 9);
    ctx.lineTo(-6.5, 2);
    ctx.quadraticCurveTo(-6.5, -1, -3, -1);
    ctx.lineTo(3, -1);
    ctx.quadraticCurveTo(6.5, -1, 6.5, 2);
    ctx.lineTo(6.5, 9);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, 9); ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawShopHeader(title) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(16, 26, 80, 36, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px system-ui';
    ctx.fillText('← BACK', 28, 49);
    ctx.font = 'bold 22px system-ui';
    ctx.fillText(title, 110, 50);
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = '#ffd080';
    drawAcornIcon(30, 73, 1);
    ctx.fillText(String(save.acorns), 42, 78);
  }

  function drawHangar() {
    drawShopHeader('HANGAR');
    const cols = 3;
    const cellW = (W - 48) / cols;
    const startY = 96;
    const suit = equippedSuit();
    HELMETS.forEach((h, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = 24 + col * cellW + cellW / 2;
      const cy = startY + row * 118 + 44;
      const unlocked = save.unlocked.includes(h.id);
      const eq = save.equipped === h.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(cx - 50, cy - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(cx - 50, cy - 48, 100, 100, 14);
        ctx.stroke();
      }

      drawAstronaut(cx + 4.5, cy - 4, 0, 0.82, h, suit, { seed: i * 1.7 });

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(h.name, cx, cy + 36);
      if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        const ct = String(h.cost);
        const cw = ctx.measureText(ct).width;
        ctx.fillText(ct, cx - 7, cy + 50);
        drawAcornIcon(cx - 7 + cw / 2 + 8, cy + 46, 0.8);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', cx, cy + 50);
      }
    });
  }

  function drawSuits() {
    drawShopHeader('SUITS');
    const cols = 3;
    const cellW = (W - 48) / cols;
    const startY = 96;
    const helm = equippedHelmet();
    SUITS.forEach((s, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = 24 + col * cellW + cellW / 2;
      const cy = startY + row * 118 + 44;
      const unlocked = save.unlockedSuits.includes(s.id);
      const eq = save.equippedSuit === s.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(cx - 50, cy - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(cx - 50, cy - 48, 100, 100, 14);
        ctx.stroke();
      }

      drawAstronaut(cx + 4.5, cy - 4, 0, 0.82, helm, s, { seed: i * 2.3 });

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(s.name, cx, cy + 36);
      if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        const ct = String(s.cost);
        const cw = ctx.measureText(ct).width;
        ctx.fillText(ct, cx - 7, cy + 50);
        drawAcornIcon(cx - 7 + cw / 2 + 8, cy + 46, 0.8);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', cx, cy + 50);
      }
    });
  }


  window.addEventListener('resize', resize);
  resize();
  initStars();
  requestAnimationFrame(frame);

  // BETA ONLY: debug hook so automated tests can inspect and stage game
  // state. Must never ship in the live build.
  window.__acornautDebug = {
    get mode() { return mode; },
    set mode(m) { mode = m; },
    get squirrel() { return squirrel; },
    get planets() { return planets; },
    get score() { return score; },
    get W() { return W; },
    get H() { return H; },
    get SQUIRREL_X() { return SQUIRREL_X; },
    get shields() { return shields; },
    get hasShield() { return hasShield; },
    set hasShield(v) { hasShield = v; },
    get shieldFreeze() { return shieldFreeze; },
    get shieldSlow() { return shieldSlow; },
    resetRun,
    flap,
  };
})();
</script>

<!-- No service worker in the beta build: test pages must always load the newest code. -->
</body>
