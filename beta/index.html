<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acornaut BETA</title>
<meta name="description" content="Acornaut BETA — test build. The stable game lives one folder up." />
<meta name="theme-color" content="#05070f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Acornaut BETA" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="../icon.svg" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070f;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f2efe6;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    max-width: 480px;
    background: #05070f;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // —— persistence ——
  // Beta uses its own save slot so testing never touches the live game's progress
  const SAVE_KEY = 'acornaut_beta';
  const HELMET_IDS = ['clear','ion','solar','nebula','lunar','void','comet','cherry','royal'];
  const SUIT_IDS = ['flight','iontrim','copper','frost','voidsuit'];
  const defaultSave = () => ({
    highScore: 0,
    acorns: 0,
    unlocked: ['clear'], // only Clear free — rest cost acorns
    equipped: 'clear',
    unlockedSuits: ['flight'],
    equippedSuit: 'flight',
  });
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return defaultSave();
      const s = { ...defaultSave(), ...JSON.parse(raw) };
      // Ensure defaults; do not wipe purchased unlocks
      if (!Array.isArray(s.unlocked) || !s.unlocked.length) s.unlocked = ['clear'];
      if (!s.unlocked.includes('clear')) s.unlocked.unshift('clear');
      if (!Array.isArray(s.unlockedSuits) || !s.unlockedSuits.length) s.unlockedSuits = ['flight'];
      if (!s.unlockedSuits.includes('flight')) s.unlockedSuits.unshift('flight');
      if (!SUIT_IDS.includes(s.equippedSuit)) s.equippedSuit = 'flight';
      if (!HELMET_IDS.includes(s.equipped)) s.equipped = 'clear';
      if (s.equipped !== 'clear' && !s.unlocked.includes(s.equipped)) s.equipped = 'clear';
      return s;
    } catch { return defaultSave(); }
  }
  function writeSave(s) {
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  }
  let save = loadSave();

  // —— helmets ——
  const HELMETS = [
    { id: 'clear',  name: 'Clear',   cost: 0,  visor: 'rgba(180,220,255,0.28)', rim: '#c8d0dc' },
    { id: 'ion',    name: 'Ion',     cost: 15, visor: 'rgba(60,220,255,0.45)',  rim: '#4ad8ff' },
    { id: 'solar',  name: 'Solar',   cost: 30, visor: 'rgba(255,170,40,0.5)',   rim: '#ffb040' },
    { id: 'nebula', name: 'Nebula',  cost: 50, visor: 'rgba(220,90,255,0.45)',  rim: '#e070ff' },
    { id: 'lunar',  name: 'Lunar',   cost: 70, visor: 'rgba(200,210,230,0.4)',  rim: '#a8b4c8' },
    { id: 'void',   name: 'Void',    cost: 90, visor: 'rgba(20,20,30,0.7)',     rim: '#3a3a48' },
    { id: 'comet',  name: 'Comet',   cost: 120,visor: 'rgba(255,90,30,0.5)',    rim: '#ff6a28' },
    { id: 'cherry', name: 'Cherry',  cost: 150,visor: 'rgba(255,120,160,0.45)', rim: '#ff8ab0' },
    { id: 'royal',  name: 'Royal',   cost: 200,visor: 'rgba(80,200,180,0.45)',  rim: '#d4af37' },
  ];

  // —— body / suit variants (separate from helmets) ——
  const SUITS = [
    { id: 'flight',   name: 'Flight', cost: 0,   fur: '#d4893a', belly: '#f0d2a8', tail: '#c47828', accent: null },
    { id: 'iontrim',  name: 'Ion',    cost: 22,  fur: '#d4893a', belly: '#f0d2a8', tail: '#c47828', accent: '#4ad8ff' },
    { id: 'copper',   name: 'Copper', cost: 48,  fur: '#b87028', belly: '#e8c090', tail: '#8a5020', accent: '#d49040' },
    { id: 'frost',    name: 'Frost',  cost: 80,  fur: '#c8d0d8', belly: '#eef2f6', tail: '#a0a8b0', accent: '#9ad8ee' },
    { id: 'voidsuit', name: 'Void',   cost: 180, fur: '#2a2c34', belly: '#5a5c68', tail: '#1a1c22', accent: '#d4af37' },
  ];

  // —— tunable physics (dev sliders mutate these) ——
  // Defaults: Tap 450, Gravity 1300, X 0.18
  let GRAVITY = 1300;
  let FLAP = -450;
  let SQUIRREL_X = 0.18;
  const BASE_SPEED = 165;
  const MAX_SPEED = 320;
  const GAP_BASE = 168;
  const GAP_MIN = 118;
  const PLANET_R = 42;
  const POWER_DURATION = 6;
  const SLOW_FACTOR = 0.42;
  const DEF_GRAVITY = 1300, DEF_FLAP = -450, DEF_X = 0.18;

  // —— state ——
  let W = 0, H = 0, dpr = 1;
  let mode = 'title'; // title | hangar | suits | ready | play | dead
  let score = 0;
  let runAcorns = 0;
  let squirrel = { y: 0, vy: 0, rot: 0 };
  let planets = [];
  let acorns = [];
  let powerups = [];
  let particles = [];
  let stars = [];
  let speed = BASE_SPEED;
  let distance = 0;
  let lastSpawnX = 0;
  let powerLeft = 0;
  let flapBoost = 0;
  let deadTimer = 0;
  let titlePulse = 0;
  let hitCooldown = 0;
  let hangarScroll = 0;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.min(rect.width, 480);
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'title' || mode === 'hangar' || mode === 'suits') initStars();
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.25,
        a: Math.random() * 0.75 + 0.2,
        tw: Math.random() * Math.PI * 2,
        bright: Math.random() < 0.12,
      });
    }
  }

  function resetRun() {
    score = 0;
    runAcorns = 0;
    squirrel = { y: H * 0.45, vy: 0, rot: 0 };
    planets = [];
    acorns = [];
    powerups = [];
    particles = [];
    speed = BASE_SPEED;
    distance = 0;
    lastSpawnX = W * 0.7;
    powerLeft = 0;
    flapBoost = 0;
    deadTimer = 0;
    hitCooldown = 0;
    for (let i = 0; i < 3; i++) spawnPair(W + 80 + i * gapSpacing());
  }

  function gapSpacing() {
    return 240 + Math.min(50, distance * 0.005);
  }

  function difficulty() {
    const t = Math.min(1, distance / 12000);
    return {
      speed: BASE_SPEED + (MAX_SPEED - BASE_SPEED) * t,
      gap: GAP_BASE - (GAP_BASE - GAP_MIN) * t,
    };
  }

  // Obstacle types for around-path seals (not planets)
  const OB_TYPES = ['asteroid','debris','satellite','ufo','crystal','rock','junk'];

  function makeObstacle(y, xOff) {
    const type = OB_TYPES[Math.floor(Math.random() * OB_TYPES.length)];
    // Larger hit/visual size so the flight lane is actually blocked
    const r = type === 'ufo' ? 24 + Math.random() * 5
            : type === 'satellite' ? 22 + Math.random() * 5
            : type === 'crystal' ? 20 + Math.random() * 5
            : type === 'debris' || type === 'junk' ? 19 + Math.random() * 5
            : 22 + Math.random() * 6;
    return {
      y, r, type,
      xOff: xOff,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.8,
      seed: Math.floor(Math.random() * 1000),
    };
  }

  function spawnPair(x) {
    const d = difficulty();
    // Main gap UNCHANGED — only seal the around-path above/below
    const gap = d.gap;
    const margin = 70;
    const gapCenter = margin + gap / 2 + Math.random() * (H - 2 * margin - gap);
    const kindA = Math.floor(Math.random() * 9);
    const kindB = Math.floor(Math.random() * 9);
    const topY = gapCenter - gap / 2 - PLANET_R;
    const botY = gapCenter + gap / 2 + PLANET_R;
    // Fully seal the corridor ABOVE the top gate and BELOW the bottom gate.
    // Tight vertical packing in the flight lane so you cannot slip around.
    const blockers = [];
    const topEdge = topY - PLANET_R;
    const botEdge = botY + PLANET_R;
    // Step small enough that obstacle radii overlap the flight path
    const step = 30;

    // From just above top planet → screen top
    {
      let y = topEdge - 26;
      let n = 0;
      while (y > 20) {
        // tiny lateral jitter only — stay in the lane
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y -= step;
        n++;
        if (n > 12) break; // safety
      }
    }
    // From just below bottom planet → screen bottom
    {
      let y = botEdge + 26;
      let n = 0;
      while (y < H - 20) {
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y += step;
        n++;
        if (n > 12) break;
      }
    }
    planets.push({
      x, gapY: gapCenter, gap, r: PLANET_R,
      topKind: kindA, botKind: kindB, scored: false,
      blockers,
    });
    if (Math.random() < 0.55) {
      acorns.push({
        x: x + 8,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.35),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // rarer power-up acorn
    if (Math.random() < 0.05) {
      powerups.push({
        x: x + 40,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.25),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    lastSpawnX = x;
  }

  function flap() {
    if (mode === 'ready') {
      mode = 'play';
    }
    if (mode !== 'play') return;
    squirrel.vy = FLAP;
    flapBoost = 0.22;
    // rocket particles from butt
    const sx = W * SQUIRREL_X - 10;
    const sy = squirrel.y + 6;
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: sx, y: sy,
        vx: -80 - Math.random() * 120,
        vy: (Math.random() - 0.5) * 90,
        life: 0.25 + Math.random() * 0.2,
        max: 0.45,
        r: 2 + Math.random() * 3,
        kind: 'flame',
      });
    }
  }

  // —— input ——
  function onPointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const x = (t.clientX - rect.left) * (W / rect.width);
    const y = (t.clientY - rect.top) * (H / rect.height);
    handleTap(x, y);
  }
  function handleTap(x, y) {
    if (mode === 'title') {
      const flyBtn = { x: W / 2, y: H * 0.58, w: 160, h: 44 };
      const hangBtn = { x: W / 2, y: H * 0.58 + 50, w: 160, h: 38 };
      const suitsBtn = { x: W / 2, y: H * 0.58 + 94, w: 160, h: 38 };
      if (hit(x, y, flyBtn)) { resetRun(); mode = 'ready'; return; }
      if (hit(x, y, hangBtn)) { mode = 'hangar'; return; }
      if (hit(x, y, suitsBtn)) { mode = 'suits'; return; }
      return;
    }
    if (mode === 'hangar' || mode === 'suits') {
      const back = { x: 56, y: 44, w: 80, h: 36 };
      if (hit(x, y, back)) { mode = 'title'; return; }
      const list = mode === 'hangar' ? HELMETS : SUITS;
      const cols = 3;
      const cellW = (W - 48) / cols;
      const startY = 100;
      list.forEach((item, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = 24 + col * cellW + cellW / 2;
        const cy = startY + row * 118 + 44;
        if (Math.hypot(x - cx, y - cy) < 46) {
          if (mode === 'hangar') {
            if (save.unlocked.includes(item.id)) {
              save.equipped = item.id;
              writeSave(save);
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save.unlocked.push(item.id);
              save.equipped = item.id;
              writeSave(save);
            }
          } else {
            const owned = save.unlockedSuits.includes(item.id);
            if (owned) {
              save.equippedSuit = item.id;
              writeSave(save);
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save.unlockedSuits.push(item.id);
              save.equippedSuit = item.id;
              writeSave(save);
            }
          }
        }
      });
      return;
    }
    if (mode === 'ready' || mode === 'play') {
      flap();
      return;
    }
    if (mode === 'dead') {
      if (deadTimer > 0.6) {
        // bank acorns
        save.acorns += runAcorns;
        if (score > save.highScore) save.highScore = score;
        writeSave(save);
        mode = 'title';
      }
    }
  }
  function hit(x, y, b) {
    return x > b.x - b.w / 2 && x < b.x + b.w / 2 && y > b.y - b.h / 2 && y < b.y + b.h / 2;
  }

  canvas.addEventListener('pointerdown', onPointer, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (mode === 'title') { resetRun(); mode = 'ready'; }
      else if (mode === 'ready' || mode === 'play') flap();
      else if (mode === 'dead' && deadTimer > 0.6) {
        save.acorns += runAcorns;
        if (score > save.highScore) save.highScore = score;
        writeSave(save);
        mode = 'title';
      }
    }
  });

  // —— update ——
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    titlePulse += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // ambient stars
    for (const s of stars) s.tw += dt * 2;

    if (mode === 'play') {
      const slow = powerLeft > 0 ? SLOW_FACTOR : 1;
      const simDt = dt * slow;

      if (powerLeft > 0) {
        powerLeft = Math.max(0, powerLeft - dt);
      }

      const d = difficulty();
      speed = d.speed;

      squirrel.vy += GRAVITY * simDt;
      squirrel.y += squirrel.vy * simDt;
      squirrel.rot = Math.max(-0.55, Math.min(0.9, squirrel.vy / 700));

      if (flapBoost > 0) flapBoost = Math.max(0, flapBoost - dt);

      const move = speed * simDt;
      distance += move;

      for (const p of planets) p.x -= move;
      for (const a of acorns) { a.x -= move; a.bob += dt * 4; }
      for (const a of powerups) { a.x -= move; a.bob += dt * 5; }

      // spawn — scroll tracker, keep at least one planet ahead
      lastSpawnX -= move;
      while (lastSpawnX < W + 80) {
        spawnPair(lastSpawnX + gapSpacing());
      }

      // cull
      planets = planets.filter(p => p.x > -80);
      acorns = acorns.filter(a => a.x > -40 && !a.got);
      powerups = powerups.filter(a => a.x > -40 && !a.got);

      // score
      const sx = W * SQUIRREL_X;
      for (const p of planets) {
        if (!p.scored && p.x + p.r < sx - 12) {
          p.scored = true;
          score += 1;
        }
      }

      // collisions — circle approx on squirrel
      const sr = 16;
      const sy = squirrel.y;
      // off screen
      if (hitCooldown > 0) hitCooldown = Math.max(0, hitCooldown - simDt);

      if (sy < -30 || sy > H + 30) {
        die(); return;
      }

      if (hitCooldown <= 0) {
        for (const p of planets) {
          const topY = p.gapY - p.gap / 2 - p.r;
          const botY = p.gapY + p.gap / 2 + p.r;
          // Main planets: recoverable bounce
          if (circleHit(sx, sy, sr, p.x, topY, p.r * 0.92)) { bounceOff(p.x, topY); break; }
          if (circleHit(sx, sy, sr, p.x, botY, p.r * 0.92)) { bounceOff(p.x, botY); break; }
          // Debris / obstacles: instant crash
          for (const b of (p.blockers || [])) {
            const bx = p.x + (b.xOff || 0);
            if (circleHit(sx, sy, sr, bx, b.y, b.r * 0.92)) { die(); return; }
          }
        }
      }

      // acorn collect
      for (const a of acorns) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 28) {
          a.got = true;
          runAcorns += 1;
          spark(a.x, a.y, 'gold');
        }
      }
      for (const a of powerups) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 5)) < 30) {
          a.got = true;
          powerLeft = POWER_DURATION;
          spark(a.x, a.y, 'cyan');
        }
      }
    }

    if (mode === 'dead') {
      deadTimer += dt;
      squirrel.vy += GRAVITY * dt * 0.6;
      squirrel.y += squirrel.vy * dt;
      squirrel.rot = Math.min(1.2, squirrel.rot + dt * 2);
    }

    // particles
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === 'flame') p.vy -= 40 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function circleHit(x1, y1, r1, x2, y2, r2) {
    return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
  }

  function bounceOff(px, py) {
    // severe destabilize — recoverable, not instant death
    const sx = W * SQUIRREL_X;
    const sy = squirrel.y;
    let dx = sx - px, dy = sy - py;
    const dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;
    // hard knockback; mostly vertical so recovery is possible but shaky
    squirrel.vy = dy * 680 + (dy >= 0 ? 260 : -460);
    squirrel.y += dy * 18;
    squirrel.rot = dy >= 0 ? 1.05 : -0.7;
    hitCooldown = 0.55;
    spark(sx, sy, 'poof');
  }

  function die() {
    mode = 'dead';
    deadTimer = 0;
    spark(W * SQUIRREL_X, squirrel.y, 'poof');
  }

  function spark(x, y, kind) {
    const n = kind === 'poof' ? 18 : 10;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.35 + Math.random() * 0.3,
        max: 0.6,
        r: 2 + Math.random() * 3,
        kind: kind === 'cyan' ? 'cyan' : kind === 'gold' ? 'gold' : 'poof',
      });
    }
  }

  // —— draw ——
  function draw() {
    // space bg
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070b18');
    g.addColorStop(1, '#0c1228');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // nebula wash
    ctx.fillStyle = 'rgba(40,60,110,0.12)';
    ctx.beginPath();
    ctx.ellipse(W * 0.7, H * 0.3, W * 0.5, H * 0.25, 0.3, 0, Math.PI * 2);
    ctx.fill();

    for (const s of stars) {
      const pulse = 0.55 + 0.45 * Math.sin(s.tw);
      ctx.globalAlpha = s.a * pulse;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.bright) {
        ctx.globalAlpha = s.a * pulse * 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 2.5, s.y);
        ctx.lineTo(s.x + s.r * 2.5, s.y);
        ctx.moveTo(s.x, s.y - s.r * 2.5);
        ctx.lineTo(s.x, s.y + s.r * 2.5);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (mode === 'title') drawTitle();
    else if (mode === 'hangar') drawHangar();
    else if (mode === 'suits') drawSuits();
    else {
      drawWorld();
      drawHUD();
      if (mode === 'ready') drawReady();
      if (mode === 'dead') drawDead();
    }
  }

  function drawWorld() {
    for (const p of planets) {
      drawPlanet(p.x, p.gapY - p.gap / 2 - p.r, p.r, p.topKind);
      drawPlanet(p.x, p.gapY + p.gap / 2 + p.r, p.r, p.botKind);
      for (const b of (p.blockers || [])) {
        drawObstacle(p.x + (b.xOff || 0), b.y, b);
      }
    }
    for (const a of acorns) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, false);
    }
    for (const a of powerups) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 5, true);
    }
    for (const p of particles) drawParticle(p);
    drawSquirrel(W * SQUIRREL_X, squirrel.y, squirrel.rot);
  }


  function drawObstacle(x, y, b) {
    const r = b.r;
    const type = b.type || 'asteroid';
    const seed = b.seed || 0;
    const rot = (b.rot || 0) + (b.spin || 0) * (performance.now() / 1000);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // soft contact shadow under every obstacle
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(2, r * 0.55, r * 0.7, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'asteroid') {
      // irregular body
      const pts = 8;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const jitter = 0.72 + ((seed * (i + 3)) % 9) / 22;
        const px = Math.cos(a) * r * jitter;
        const py = Math.sin(a) * r * jitter;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const grd = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
      grd.addColorStop(0, '#c8b8a0');
      grd.addColorStop(0.45, '#8a7a64');
      grd.addColorStop(1, '#3a3028');
      ctx.fillStyle = grd;
      ctx.fill();
      // rim
      ctx.strokeStyle = 'rgba(255,230,200,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // craters with rims
      for (let i = 0; i < 4; i++) {
        const a = (seed * 0.7 + i * 1.7) % (Math.PI * 2);
        const d = r * (0.2 + (i % 3) * 0.15);
        const cr = r * (0.1 + (i % 3) * 0.05);
        const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
        ctx.fillStyle = 'rgba(25,20,15,0.5)';
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(180,160,130,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (type === 'debris') {
      // main plate
      const grd = ctx.createLinearGradient(-r, -r, r, r);
      grd.addColorStop(0, '#9aa2aa');
      grd.addColorStop(0.5, '#5a626c');
      grd.addColorStop(1, '#2a3038');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.lineTo(r * 0.95, r * 0.15);
      ctx.lineTo(-r * 0.35, r * 0.8);
      ctx.closePath();
      ctx.fill();
      // secondary shard
      ctx.fillStyle = '#4a525c';
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, r * 0.05);
      ctx.lineTo(r * 0.25, -r * 0.3);
      ctx.lineTo(r * 0.1, r * 0.6);
      ctx.closePath();
      ctx.fill();
      // heat edge
      ctx.strokeStyle = 'rgba(255,100,30,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.stroke();
      // rivets
      ctx.fillStyle = '#c0c8d0';
      [[-0.4,-0.1],[0.2,-0.4],[0.4,0.05],[-0.15,0.4]].forEach(([dx,dy]) => {
        ctx.beginPath(); ctx.arc(dx * r, dy * r, 1.6, 0, Math.PI * 2); ctx.fill();
      });
    } else if (type === 'satellite') {
      // body
      const bg = ctx.createLinearGradient(-r * 0.4, -r * 0.5, r * 0.4, r * 0.5);
      bg.addColorStop(0, '#e8eef4');
      bg.addColorStop(1, '#687480');
      ctx.fillStyle = bg;
      ctx.fillRect(-r * 0.38, -r * 0.45, r * 0.76, r * 0.9);
      // window
      ctx.fillStyle = 'rgba(80,180,255,0.55)';
      ctx.fillRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      // solar panels
      const panel = (x0) => {
        const pg = ctx.createLinearGradient(x0, 0, x0 + r * 0.55, 0);
        pg.addColorStop(0, '#1a4a7a');
        pg.addColorStop(0.5, '#3a8ad0');
        pg.addColorStop(1, '#1a4a7a');
        ctx.fillStyle = pg;
        ctx.fillRect(x0, -r * 0.3, r * 0.55, r * 0.6);
        ctx.strokeStyle = 'rgba(120,200,255,0.45)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const py = -r * 0.3 + i * r * 0.15;
          ctx.beginPath(); ctx.moveTo(x0 + 2, py); ctx.lineTo(x0 + r * 0.53, py); ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          const px = x0 + i * r * 0.18;
          ctx.beginPath(); ctx.moveTo(px, -r * 0.28); ctx.lineTo(px, r * 0.28); ctx.stroke();
        }
      };
      panel(-r * 1.1);
      panel(r * 0.55);
      // dish / antenna
      ctx.strokeStyle = '#d0d8e0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(0, -r * 0.95); ctx.stroke();
      ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(0, -r * 1.0, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.22, -2.2, -0.6); ctx.stroke();
    } else if (type === 'ufo') {
      // hull
      const hull = ctx.createRadialGradient(0, -r * 0.15, r * 0.1, 0, 0, r * 1.1);
      hull.addColorStop(0, '#f0f4f8');
      hull.addColorStop(0.4, '#90a0b8');
      hull.addColorStop(1, '#303848');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // rim ring
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.05, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      // dome
      const dome = ctx.createRadialGradient(-r * 0.1, -r * 0.35, r * 0.05, 0, -r * 0.15, r * 0.5);
      dome.addColorStop(0, 'rgba(180,240,255,0.85)');
      dome.addColorStop(0.6, 'rgba(60,160,220,0.55)');
      dome.addColorStop(1, 'rgba(20,60,100,0.35)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.18, r * 0.5, r * 0.4, 0, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // underglow lights
      for (let i = 0; i < 6; i++) {
        const a = -1.0 + i * 0.4;
        ctx.fillStyle = i % 2 ? '#ffd040' : '#40f0ff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.22 + r * 0.05, r * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    } else if (type === 'crystal') {
      // outer crystal
      const cg = ctx.createLinearGradient(0, -r, 0, r);
      cg.addColorStop(0, 'rgba(220,180,255,0.95)');
      cg.addColorStop(0.45, 'rgba(140,70,230,0.9)');
      cg.addColorStop(1, 'rgba(60,20,120,0.85)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.lineTo(r * 0.35, r * 0.9);
      ctx.lineTo(-r * 0.4, r * 0.75);
      ctx.lineTo(-r * 0.65, -r * 0.15);
      ctx.closePath();
      ctx.fill();
      // inner highlight facet
      ctx.fillStyle = 'rgba(255,240,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.75);
      ctx.lineTo(r * 0.28, -r * 0.05);
      ctx.lineTo(0, r * 0.35);
      ctx.lineTo(-r * 0.28, -r * 0.05);
      ctx.closePath();
      ctx.fill();
      // edge shine
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -r * 0.55);
      ctx.lineTo(r * 0.15, r * 0.25);
      ctx.stroke();
      // glow
      ctx.strokeStyle = 'rgba(180,100,255,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.stroke();
    } else if (type === 'rock') {
      const rg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      rg.addColorStop(0, '#9a9080');
      rg.addColorStop(0.5, '#5a5048');
      rg.addColorStop(1, '#2a2420');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.98, r * 0.82, 0.35, 0, Math.PI * 2);
      ctx.fill();
      // lumps
      ctx.fillStyle = '#7a7060';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.28, r * 0.4, r * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(20,16,12,0.45)';
      ctx.beginPath(); ctx.arc(r * 0.3, r * 0.2, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.28, r * 0.14, 0, Math.PI * 2); ctx.fill();
      // highlight
      ctx.strokeStyle = 'rgba(220,200,170,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-r * 0.15, -r * 0.35, r * 0.35, r * 0.2, -0.4, 0, Math.PI * 2);
      ctx.stroke();
    } else { // junk
      // barrel body
      const jg = ctx.createLinearGradient(-r * 0.7, 0, r * 0.7, 0);
      jg.addColorStop(0, '#5a3a20');
      jg.addColorStop(0.4, '#c08040');
      jg.addColorStop(1, '#4a3018');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.72, r * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      // bands
      ctx.strokeStyle = '#e0a860';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      // rust spots
      ctx.fillStyle = 'rgba(80,40,10,0.4)';
      ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.1, r * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
      // metal strut
      ctx.strokeStyle = '#b0b8c0';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r * 0.45, -r * 0.7);
      ctx.lineTo(r * 1.15, r * 0.35);
      ctx.stroke();
      // joint ball
      const bg2 = ctx.createRadialGradient(r * 1.1, r * 0.3, 1, r * 1.15, r * 0.35, r * 0.2);
      bg2.addColorStop(0, '#e0e8f0');
      bg2.addColorStop(1, '#505860');
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.arc(r * 1.15, r * 0.35, r * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPlanet(x, y, r, kind) {
    const palettes = [
      // 0 ocean earth
      ['#2a6aa8', '#1a4068', '#6eb8e8', '#3a9a5a', '#1a5a38'],
      // 1 golden ringed
      ['#d4a84a', '#a07828', '#f0d88a', '#c9a04a', '#8a6020'],
      // 2 icy moon
      ['#b0c0d0', '#788898', '#e8f0f8', '#a0b0c0', '#606878'],
      // 3 lava / mars
      ['#c04020', '#701808', '#e87040', '#a03018', '#ff9040'],
      // 4 teal gas
      ['#1a9080', '#0c5848', '#5ad0b8', '#2a8070', '#0a4038'],
      // 5 rock grey
      ['#6a6e78', '#3c4048', '#a0a4ac', '#5a5e66', '#2a2c30'],
      // 6 desert
      ['#b07030', '#704018', '#e0a060', '#986028', '#503010'],
      // 7 deep blue gas
      ['#142850', '#081830', '#3a68a0', '#1e4070', '#0a1830'],
      // 8 pink alien
      ['#c06078', '#782840', '#e8a0b0', '#a04858', '#501828'],
    ];
    const [c1, c2, c3, c4, c5] = palettes[kind % palettes.length];

    // soft outer atmosphere glow
    const atmo = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.25);
    atmo.addColorStop(0, 'rgba(0,0,0,0)');
    atmo.addColorStop(0.7, 'rgba(160,200,255,0.04)');
    atmo.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.fillStyle = atmo;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // base sphere with richer lighting
    const grd = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.04, x + r * 0.15, y + r * 0.2, r * 1.05);
    grd.addColorStop(0, c3);
    grd.addColorStop(0.35, c1);
    grd.addColorStop(0.75, c2);
    grd.addColorStop(1, c5 || c2);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // surface detail (clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    if (kind === 0) { // earth continents + clouds
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.65;
      [[-0.2,-0.15,0.5,0.32,-0.5],[0.28,0.18,0.35,0.22,0.4],[-0.05,0.35,0.28,0.18,0.1]].forEach(([dx,dy,rx,ry,rot]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, rot, 0, Math.PI*2);
        ctx.fill();
      });
      // cloud wisps
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.22;
      [[0.1,-0.3,0.3,0.1],[ -0.3,0.1,0.25,0.08],[0.25,0.3,0.2,0.07]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 1 || kind === 7) { // gas bands
      for (let i = -3; i <= 3; i++) {
        ctx.strokeStyle = i % 2 === 0 ? c4 : c5;
        ctx.globalAlpha = 0.28 + (i % 2) * 0.1;
        ctx.lineWidth = r * (0.1 + Math.abs(i) * 0.02);
        ctx.beginPath();
        ctx.ellipse(x, y + i * r * 0.18, r * 0.96, r * 0.16, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // storm oval
      ctx.fillStyle = c3;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(x + r * 0.25, y + r * 0.1, r * 0.22, r * 0.14, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (kind === 2 || kind === 5) { // craters + maria
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.35;
      [[-0.3,-0.25,0.22],[0.25,0.1,0.18],[-0.05,0.35,0.15],[0.35,-0.3,0.12],[-0.35,0.15,0.1],[0.1,-0.05,0.08]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
        // rim highlight
        ctx.strokeStyle = c3;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = c5;
      });
      ctx.globalAlpha = 1;
    } else if (kind === 3) { // lava + cracks
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.55;
      [[-0.15,-0.2,0.2],[0.2,0.15,0.18],[-0.25,0.25,0.12]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#ff9040';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.2;
      [[-0.45,-0.2,0.1,0.15,0.4,-0.1],[-0.2,0.3,0.15,0.05,0.45,0.2],[0.1,-0.35,0.0,-0.1,0.3,0.05]].forEach(([x1,y1,cx,cy,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x + x1 * r, y + y1 * r);
        ctx.quadraticCurveTo(x + cx * r, y + cy * r, x + x2 * r, y + y2 * r);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 4 || kind === 8) { // soft spots + haze
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.3;
      [[0.15,-0.2,0.4,0.28],[ -0.25,0.15,0.3,0.22]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x + dx * r, y + dy * r, r * rx, r * ry, 0.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 6) { // desert dunes
      ctx.strokeStyle = c5;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.8, y + i * r * 0.22);
        ctx.quadraticCurveTo(x, y + i * r * 0.22 - r * 0.08, x + r * 0.8, y + i * r * 0.22);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // terminator / night side soft shadow
    const night = ctx.createLinearGradient(x - r, y, x + r, y);
    night.addColorStop(0, 'rgba(0,0,0,0)');
    night.addColorStop(0.55, 'rgba(0,0,0,0)');
    night.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = night;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // rings (drawn outside clip)
    if (kind === 1) {
      ctx.strokeStyle = 'rgba(212,175,55,0.8)';
      ctx.lineWidth = Math.max(2.5, r * 0.08);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.45, r * 0.28, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(212,175,55,0.35)';
      ctx.lineWidth = Math.max(1.2, r * 0.04);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.62, r * 0.32, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      // ring shadow on planet
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.95, r * 0.2, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (kind === 4) {
      ctx.strokeStyle = 'rgba(100,220,200,0.5)';
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.22, 0.18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 7) {
      ctx.strokeStyle = 'rgba(100,140,220,0.45)';
      ctx.lineWidth = Math.max(1.8, r * 0.05);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.3, r * 0.2, -0.12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(100,140,220,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.42, r * 0.24, -0.12, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 2) {
      // thin icy ring
      ctx.strokeStyle = 'rgba(200,220,240,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.25, r * 0.15, 0.1, 0, Math.PI * 2);
      ctx.stroke();
    }

    // crisp limb highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAcorn(x, y, power) {
    ctx.save();
    ctx.translate(x, y);
    if (power) {
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
      glow.addColorStop(0, 'rgba(100,230,255,0.45)');
      glow.addColorStop(0.5, 'rgba(60,180,255,0.18)');
      glow.addColorStop(1, 'rgba(60,180,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
    }
    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(1, 12, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // nut body with gradient
    const nut = ctx.createRadialGradient(-3, 0, 2, 0, 4, 12);
    if (power) {
      nut.addColorStop(0, '#c0f0ff');
      nut.addColorStop(0.5, '#5ad0f0');
      nut.addColorStop(1, '#1a70a0');
    } else {
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(0.5, '#c47a28');
      nut.addColorStop(1, '#6a3a10');
    }
    ctx.fillStyle = nut;
    ctx.beginPath();
    ctx.ellipse(0, 3, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // stem notch line
    ctx.strokeStyle = power ? 'rgba(20,80,120,0.35)' : 'rgba(60,30,10,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(0, 10);
    ctx.stroke();
    // cap
    const cap = ctx.createRadialGradient(0, -6, 1, 0, -4, 12);
    if (power) {
      cap.addColorStop(0, '#6ec8e8');
      cap.addColorStop(1, '#1a6088');
    } else {
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
    }
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(0, -5, 11.5, 7.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-11, -6, 22, 4);
    // cap texture ridges
    ctx.strokeStyle = power ? 'rgba(255,255,255,0.2)' : 'rgba(255,200,120,0.2)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 4, -8); ctx.lineTo(i * 3.2, -3);
      ctx.stroke();
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-3.5, 1, 2.8, 4.5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticle(p) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    if (p.kind === 'flame') {
      ctx.fillStyle = t > 0.5 ? '#ffe080' : t > 0.25 ? '#ff8030' : '#ff4020';
    } else if (p.kind === 'cyan') {
      ctx.fillStyle = '#6ef0ff';
    } else if (p.kind === 'gold') {
      ctx.fillStyle = '#ffd060';
    } else {
      ctx.fillStyle = '#e8dcc8';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * t, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function equippedHelmet() {
    return HELMETS.find(h => h.id === save.equipped) || HELMETS[0];
  }

  function equippedSuit() {
    return SUITS.find(s => s.id === save.equippedSuit) || SUITS[0];
  }

  function drawSquirrel(x, y, rot) {
    const helm = equippedHelmet();
    const suit = equippedSuit();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // rocket boost flame on flap
    if (flapBoost > 0 && (mode === 'play' || mode === 'ready')) {
      const f = flapBoost / 0.22;
      ctx.fillStyle = `rgba(255,160,40,${0.85 * f})`;
      ctx.beginPath();
      ctx.moveTo(-14, 8);
      ctx.quadraticCurveTo(-28 - 10 * f, 10, -16, 16);
      ctx.quadraticCurveTo(-22, 12, -14, 10);
      ctx.fill();
      ctx.fillStyle = `rgba(255,240,120,${0.9 * f})`;
      ctx.beginPath();
      ctx.moveTo(-14, 9);
      ctx.quadraticCurveTo(-22 - 6 * f, 11, -15, 13);
      ctx.fill();
    }

    // tail with volume
    const tailG = ctx.createLinearGradient(-6, 4, -24, -18);
    tailG.addColorStop(0, suit.fur);
    tailG.addColorStop(0.5, suit.tail);
    tailG.addColorStop(1, suit.fur);
    ctx.fillStyle = tailG;
    ctx.beginPath();
    ctx.moveTo(-6, 4);
    ctx.quadraticCurveTo(-30, -10, -24, -24);
    ctx.quadraticCurveTo(-12, -12, -4, 0);
    ctx.fill();
    // tail highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.quadraticCurveTo(-22, -8, -18, -18);
    ctx.stroke();

    // body
    const bodyG = ctx.createRadialGradient(-4, 0, 2, 0, 4, 16);
    bodyG.addColorStop(0, suit.belly);
    bodyG.addColorStop(0.35, suit.fur);
    bodyG.addColorStop(1, suit.tail);
    ctx.fillStyle = bodyG;
    ctx.beginPath();
    ctx.ellipse(0, 4, 14, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // belly patch
    ctx.fillStyle = suit.belly;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.ellipse(2, 6, 8, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // optional suit accent stripe
    if (suit.accent) {
      ctx.strokeStyle = suit.accent;
      ctx.lineWidth = 2.2;
      ctx.shadowColor = suit.accent;
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(-8, 2);
      ctx.lineTo(6, 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // head
    const headG = ctx.createRadialGradient(5, -9, 2, 8, -6, 12);
    headG.addColorStop(0, suit.belly);
    headG.addColorStop(0.5, suit.fur);
    headG.addColorStop(1, suit.tail);
    ctx.fillStyle = headG;
    ctx.beginPath();
    ctx.ellipse(8, -6, 11, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // ear
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(4, -16, 4, 5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0c090';
    ctx.beginPath();
    ctx.ellipse(4, -16, 2, 2.5, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // eye with depth
    ctx.fillStyle = '#1a1208';
    ctx.beginPath();
    ctx.arc(12, -7, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(12.8, -7.7, 1.0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(11.4, -6.5, 0.5, 0, Math.PI * 2);
    ctx.fill();

    // helmet dome — glass volume
    const visorG = ctx.createRadialGradient(4, -12, 2, 8, -6, 16);
    // parse visor color into a fill with depth via overlay
    ctx.fillStyle = helm.visor;
    ctx.beginPath();
    ctx.arc(8, -6, 15, 0, Math.PI * 2);
    ctx.fill();
    // glass specular overlay
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.arc(5, -10, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.arc(8, -6, 15, 0, Math.PI * 2);
    ctx.stroke();
    // rim highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(8, -6, 14.2, -2.2, -0.6);
    ctx.stroke();
    // neck ring / seal
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(8, 4, 11, 3.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    // inner neck dark
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(8, 3.2, 9, 2.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    // visor shine
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(4, -10, 8, -1.25, -0.15);
    ctx.stroke();
    // secondary smaller shine
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(11, -9, 4, -0.8, 0.3);
    ctx.stroke();

    // —— per-helmet unique details ——
    if (helm.id === 'ion') {
      // twin antenna
      ctx.strokeStyle = '#4ad8ff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(5, -20); ctx.lineTo(3, -29);
      ctx.moveTo(11, -20); ctx.lineTo(13, -29);
      ctx.stroke();
      ctx.fillStyle = '#4ad8ff';
      ctx.beginPath(); ctx.arc(3, -30, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(13, -30, 2.2, 0, Math.PI*2); ctx.fill();
    } else if (helm.id === 'solar') {
      // sun-ray fins
      ctx.fillStyle = '#ffb040';
      for (const ang of [-0.7, -0.35, 0.35, 0.7]) {
        ctx.save();
        ctx.translate(8, -6);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(3, -22);
        ctx.lineTo(-3, -22);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    } else if (helm.id === 'nebula') {
      // swirl mark on visor
      ctx.strokeStyle = 'rgba(255,150,255,0.55)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(8, -6, 7, 0.2, 2.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(8, -6, 4, 1.0, 2.8);
      ctx.stroke();
    } else if (helm.id === 'lunar') {
      // crater pockmarks on rim
      ctx.fillStyle = 'rgba(80,90,110,0.45)';
      [[2,-18,2.2],[12,-16,1.8],[6,-20,1.5]].forEach(([px,py,pr]) => {
        ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
      });
    } else if (helm.id === 'void') {
      // dark matte + thin gold ring
      ctx.strokeStyle = 'rgba(212,175,55,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(8, -6, 12.5, 0, Math.PI*2);
      ctx.stroke();
    } else if (helm.id === 'comet') {
      // flame crest
      ctx.fillStyle = '#ff6a28';
      ctx.beginPath();
      ctx.moveTo(5, -20);
      ctx.quadraticCurveTo(8, -30, 11, -20);
      ctx.quadraticCurveTo(8, -24, 5, -20);
      ctx.fill();
      ctx.fillStyle = '#ffd060';
      ctx.beginPath();
      ctx.moveTo(6.5, -21);
      ctx.quadraticCurveTo(8, -27, 9.5, -21);
      ctx.fill();
    } else if (helm.id === 'cherry') {
      // crystal facets
      ctx.strokeStyle = 'rgba(255,180,200,0.5)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(8, -18); ctx.lineTo(14, -8); ctx.lineTo(8, 2); ctx.lineTo(2, -8);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, -18); ctx.lineTo(8, 2);
      ctx.stroke();
    } else if (helm.id === 'royal') {
      // crown
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(1, -19);
      ctx.lineTo(4, -27);
      ctx.lineTo(8, -21);
      ctx.lineTo(12, -27);
      ctx.lineTo(15, -19);
      ctx.closePath();
      ctx.fill();
      // jewels
      ctx.fillStyle = '#ff6080';
      ctx.beginPath(); ctx.arc(4, -24, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -24, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#60c0ff';
      ctx.beginPath(); ctx.arc(8, -23, 1.5, 0, Math.PI*2); ctx.fill();
    }

    ctx.restore();
  }

  function drawHUD() {
    // score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), W / 2, 48);

    // high score
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + save.highScore, W / 2, 68);

    // run acorns
    ctx.textAlign = 'left';
    ctx.font = '600 14px system-ui';
    ctx.fillStyle = '#ffd080';
    ctx.fillText('🌰 ' + runAcorns, 16, 28);

    // power-up timer
    if (powerLeft > 0) {
      const secs = Math.ceil(powerLeft);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui';
      ctx.fillStyle = '#6ef0ff';
      ctx.fillText('⏱ SLOW  ' + secs + 's', W / 2, 92);
      // bar
      const bw = 120;
      const pct = powerLeft / POWER_DURATION;
      ctx.fillStyle = 'rgba(110,240,255,0.2)';
      ctx.fillRect(W / 2 - bw / 2, 100, bw, 5);
      ctx.fillStyle = '#6ef0ff';
      ctx.fillRect(W / 2 - bw / 2, 100, bw * pct, 5);
    }
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 18px system-ui';
    ctx.textAlign = 'center';
    const pulse = 0.85 + 0.15 * Math.sin(titlePulse * 4);
    ctx.globalAlpha = pulse;
    ctx.fillText('TAP TO FLY', W / 2, H * 0.38);
    ctx.globalAlpha = 1;
  }

  function drawDead() {
    ctx.fillStyle = 'rgba(5,8,16,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('CRASHED', W / 2, H * 0.36);
    ctx.font = '600 18px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Score  ' + score, W / 2, H * 0.36 + 36);
    ctx.fillStyle = '#ffd080';
    ctx.fillText('+' + runAcorns + ' acorns', W / 2, H * 0.36 + 62);
    if (score >= save.highScore && score > 0) {
      ctx.fillStyle = '#6ef0ff';
      ctx.font = '600 14px system-ui';
      ctx.fillText('NEW BEST', W / 2, H * 0.36 + 88);
    }
    if (deadTimer > 0.6) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 15px system-ui';
      ctx.fillText('tap to continue', W / 2, H * 0.62);
    }
  }

    // decorative planets
    drawPlanet(W * 0.15, H * 0.22, 28, 0);
    drawPlanet(W * 0.88, H * 0.18, 22, 4);
    drawPlanet(W * 0.78, H * 0.78, 36, 1);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px system-ui';

    ctx.fillStyle = 'rgba(255,255,255,0.55)';

    ctx.fillStyle = '#ffb040';
    ctx.font = 'bold 12px system-ui';

    ctx.font = '600 15px system-ui';

    drawBtn(W / 2, H * 0.58 + 94, 160, 38, 'SUITS', 'rgba(255,255,255,0.12)', false);

  function drawBtn(x, y, w, h, label, fill, primary) {
    ctx.fillStyle = fill;
    roundRect(x - w / 2, y - h / 2, w, h, 14);
    ctx.fill();
    if (primary) {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.fillStyle = primary ? '#fff' : 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 16px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y + 1);
    ctx.textBaseline = 'alphabetic';
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawShopHeader(title) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRect(16, 26, 80, 36, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '600 13px system-ui';
    ctx.fillText('← BACK', 28, 49);
    ctx.font = 'bold 22px system-ui';
    ctx.fillText(title, 110, 50);
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = '#ffd080';
    ctx.fillText('🌰 ' + save.acorns, 24, 78);
  }

  function drawMiniSquirrel(cx, cy, scale, helm, suit) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    // tail — keep it clearly outside the helmet
    ctx.fillStyle = suit.tail;
    ctx.beginPath();
    ctx.moveTo(-8, 6);
    ctx.quadraticCurveTo(-28, -4, -22, -20);
    ctx.quadraticCurveTo(-12, -6, -5, 2);
    ctx.fill();
    // body lower so it sticks out under helmet
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(0, 8, 12, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.belly;
    ctx.beginPath();
    ctx.ellipse(2, 10, 6.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    if (suit.accent) {
      ctx.strokeStyle = suit.accent;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-6, 6);
      ctx.lineTo(5, 6);
      ctx.stroke();
    }
    // head
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(6, -4, 9, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // ear
    ctx.beginPath();
    ctx.ellipse(2, -12, 3.5, 4.5, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0c090';
    ctx.beginPath();
    ctx.ellipse(2, -12, 1.8, 2.2, -0.25, 0, Math.PI * 2);
    ctx.fill();
    // eye
    ctx.fillStyle = '#1a1208';
    ctx.beginPath();
    ctx.arc(10, -5, 1.8, 0, Math.PI * 2);
    ctx.fill();
    // helmet — smaller radius so body + tail remain visible
    ctx.fillStyle = helm.visor;
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(6, -4, 10.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // visor shine
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(3, -7, 5.5, -1.3, -0.2);
    ctx.stroke();
    // simple neck ring
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.ellipse(6, 3.5, 8, 2.8, 0, 0, Math.PI * 2);
    ctx.stroke();
    // per-helmet mini details
    if (helm.id === 'ion') {
      ctx.strokeStyle = '#4ad8ff';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(4, -14); ctx.lineTo(2.5, -19);
      ctx.moveTo(8, -14); ctx.lineTo(9.5, -19);
      ctx.stroke();
      ctx.fillStyle = '#4ad8ff';
      ctx.beginPath(); ctx.arc(2.5, -19.5, 1.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(9.5, -19.5, 1.3, 0, Math.PI*2); ctx.fill();
    } else if (helm.id === 'solar') {
      ctx.fillStyle = '#ffb040';
      for (const a of [-0.5, 0.5]) {
        ctx.save(); ctx.translate(6, -4); ctx.rotate(a);
        ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(2,-15); ctx.lineTo(-2,-15); ctx.fill();
        ctx.restore();
      }
    } else if (helm.id === 'comet') {
      ctx.fillStyle = '#ff6a28';
      ctx.beginPath();
      ctx.moveTo(4, -14); ctx.quadraticCurveTo(6, -20, 8, -14); ctx.fill();
    } else if (helm.id === 'royal') {
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(2, -13); ctx.lineTo(4, -18); ctx.lineTo(6, -14);
      ctx.lineTo(8, -18); ctx.lineTo(10, -13); ctx.fill();
    } else if (helm.id === 'void') {
      ctx.strokeStyle = 'rgba(212,175,55,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(6, -4, 8, 0, Math.PI*2); ctx.stroke();
    } else if (helm.id === 'cherry') {
      ctx.strokeStyle = 'rgba(255,180,200,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(6, -12); ctx.lineTo(10, -5); ctx.lineTo(6, 2); ctx.lineTo(2, -5);
      ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  function drawHangar() {
    drawShopHeader('HANGAR');
    const cols = 3;
    const cellW = (W - 48) / cols;
    const startY = 96;
    const suit = equippedSuit();
    HELMETS.forEach((h, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = 24 + col * cellW + cellW / 2;
      const cy = startY + row * 118 + 44;
      const unlocked = save.unlocked.includes(h.id);
      const eq = save.equipped === h.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(cx - 50, cy - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(cx - 50, cy - 48, 100, 100, 14);
        ctx.stroke();
      }

      drawMiniSquirrel(cx, cy - 10, 1.05, h, suit);

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(h.name, cx, cy + 36);
      if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        ctx.fillText(h.cost + ' 🌰', cx, cy + 50);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', cx, cy + 50);
      }
    });
  }

  function drawSuits() {
    drawShopHeader('SUITS');
    const cols = 3;
    const cellW = (W - 48) / cols;
    const startY = 96;
    const helm = equippedHelmet();
    SUITS.forEach((s, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = 24 + col * cellW + cellW / 2;
      const cy = startY + row * 118 + 44;
      const unlocked = save.unlockedSuits.includes(s.id);
      const eq = save.equippedSuit === s.id;

      ctx.fillStyle = eq ? 'rgba(58,156,255,0.25)' : 'rgba(255,255,255,0.06)';
      roundRect(cx - 50, cy - 48, 100, 100, 14);
      ctx.fill();
      if (eq) {
        ctx.strokeStyle = '#3a9cff';
        ctx.lineWidth = 2;
        roundRect(cx - 50, cy - 48, 100, 100, 14);
        ctx.stroke();
      }

      drawMiniSquirrel(cx, cy - 10, 1.05, helm, s);

      ctx.textAlign = 'center';
      ctx.font = '600 11px system-ui';
      ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.45)';
      ctx.fillText(s.name, cx, cy + 36);
      if (!unlocked) {
        ctx.fillStyle = '#ffd080';
        ctx.fillText(s.cost + ' 🌰', cx, cy + 50);
      } else if (eq) {
        ctx.fillStyle = '#3a9cff';
        ctx.fillText('EQUIPPED', cx, cy + 50);
      }
    });
  }


  window.addEventListener('resize', resize);
  resize();
  initStars();
  requestAnimationFrame(frame);
})();
</script>
