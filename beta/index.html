<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acornaut BETA</title>
<meta name="description" content="Acornaut BETA — test build. The stable game lives one folder up." />
<meta name="theme-color" content="#05070f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Acornaut BETA" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="../icon.svg" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070f;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f2efe6;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    max-width: 480px;
    background: #05070f;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // —— persistence ——
  // Beta uses its own save slot so testing never touches the live game's progress
  const SAVE_KEY = 'acornaut_beta';
  const BETA_ACORNS = 10000;
  const HELMET_IDS = ['clear','ion','solar','nebula','lunar','void','comet','cherry','royal'];
  const SUIT_IDS = ['flight','iontrim','copper','frost','voidsuit'];
  const defaultSave = () => ({
    highScore: 0,
    acorns: BETA_ACORNS,
    unlocked: ['clear'], // only Clear free — rest cost acorns
    equipped: 'clear',
    unlockedSuits: ['flight'],
    equippedSuit: 'flight',
  });
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return defaultSave();
      const s = { ...defaultSave(), ...JSON.parse(raw) };
      // Ensure defaults; do not wipe purchased unlocks
      if (!Array.isArray(s.unlocked) || !s.unlocked.length) s.unlocked = ['clear'];
      if (!s.unlocked.includes('clear')) s.unlocked.unshift('clear');
      if (!Array.isArray(s.unlockedSuits) || !s.unlockedSuits.length) s.unlockedSuits = ['flight'];
      if (!s.unlockedSuits.includes('flight')) s.unlockedSuits.unshift('flight');
      if (!SUIT_IDS.includes(s.equippedSuit)) s.equippedSuit = 'flight';
      if (!HELMET_IDS.includes(s.equipped)) s.equipped = 'clear';
      if (s.equipped !== 'clear' && !s.unlocked.includes(s.equipped)) s.equipped = 'clear';
      // BETA ONLY: keep the balance topped up so every helmet and suit
      // can be bought and inspected while testing art changes.
      if (s.acorns < BETA_ACORNS) s.acorns = BETA_ACORNS;
      return s;
    } catch { return defaultSave(); }
  }
  function writeSave(s) {
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  }
  let save = loadSave();

  // —— helmets ——
  const HELMETS = [
    { id: 'clear',  name: 'Clear',  cost: 0,   visor: '#bcd8f4', tint: 0.16, rim: '#cfd8e4', trim: '#8fa0b4', glow: null },
    { id: 'ion',    name: 'Ion',    cost: 15,  visor: '#4ad8ff', tint: 0.20, rim: '#4ad8ff', trim: '#1b6f92', glow: '#4ad8ff' },
    { id: 'solar',  name: 'Solar',  cost: 30,  visor: '#ffc46b', tint: 0.20, rim: '#ffb040', trim: '#a86a18', glow: '#ffa32e' },
    { id: 'nebula', name: 'Nebula', cost: 50,  visor: '#c86bff', tint: 0.22, rim: '#e070ff', trim: '#6a2a9a', glow: '#c060ff' },
    { id: 'lunar',  name: 'Lunar',  cost: 70,  visor: '#d8e2f0', tint: 0.18, rim: '#b6c2d4', trim: '#6f7c8e', glow: '#cfe0ff' },
    { id: 'void',   name: 'Void',   cost: 90,  visor: '#2a2438', tint: 0.30, rim: '#d4af37', trim: '#1a1622', glow: '#a855f7' },
    { id: 'comet',  name: 'Comet',  cost: 120, visor: '#ff8a4a', tint: 0.20, rim: '#ff6a28', trim: '#8a2f0c', glow: '#ff7a30' },
    { id: 'cherry', name: 'Cherry', cost: 150, visor: '#ff9ec4', tint: 0.20, rim: '#ff8ab0', trim: '#a83a68', glow: '#ff7ab0' },
    { id: 'royal',  name: 'Royal',  cost: 200, visor: '#7fe0cf', tint: 0.18, rim: '#d4af37', trim: '#8a6a12', glow: '#ffd76a' },
  ];

  // —— body / suit variants (separate from helmets) ——
  const SUITS = [
    { id: 'flight',   name: 'Flight', cost: 0,
      fur: '#d98f3d', furDark: '#a8641f', belly: '#f7e0bb',
      suit: '#c8762c', suitLite: '#eda85a', suitDark: '#8a4c14',
      trim: '#f6cf8a', glow: null, dust: null },
    { id: 'iontrim',  name: 'Ion', cost: 22,
      fur: '#d98f3d', furDark: '#a8641f', belly: '#f7e0bb',
      suit: '#1b3f5c', suitLite: '#3d7fa8', suitDark: '#0e2436',
      trim: '#4ad8ff', glow: '#4ad8ff', dust: '#8fe9ff' },
    { id: 'copper',   name: 'Copper', cost: 48,
      fur: '#a85f28', furDark: '#663409', belly: '#e6bd83',
      suit: '#8c4718', suitLite: '#f2ab62', suitDark: '#421f06',
      trim: '#ffdda8', glow: '#ff8a2a', dust: '#ffb45c' },
    { id: 'frost',    name: 'Frost', cost: 80,
      fur: '#e2ecf6', furDark: '#a9bccf', belly: '#ffffff',
      suit: '#6f9dc4', suitLite: '#a9d4ef', suitDark: '#40688a',
      trim: '#eaf7ff', glow: '#9fe4ff', dust: '#dff5ff' },
    { id: 'voidsuit', name: 'Void', cost: 180,
      fur: '#544a63', furDark: '#312a3d', belly: '#8d7fa0',
      suit: '#241d33', suitLite: '#4f4270', suitDark: '#100c18',
      trim: '#d4af37', glow: '#b45cff', dust: '#e7b6ff' },
  ];

  // —— tunable physics (dev sliders mutate these) ——
  // Defaults: Tap 450, Gravity 1300, X 0.18
  let GRAVITY = 1300;
  let FLAP = -450;
  let SQUIRREL_X = 0.18;
  const BASE_SPEED = 165;
  const MAX_SPEED = 320;
  const GAP_BASE = 168;
  const GAP_MIN = 118;
  const PLANET_R = 42;
  const POWER_DURATION = 6;
  const SLOW_FACTOR = 0.42;
  const DEF_GRAVITY = 1300, DEF_FLAP = -450, DEF_X = 0.18;

  // —— state ——
  let W = 0, H = 0, dpr = 1;
  let mode = 'title'; // title | hangar | suits | ready | play | dead
  let score = 0;
  let runAcorns = 0;
  let squirrel = { y: 0, vy: 0, rot: 0 };
  let planets = [];
  let acorns = [];
  let powerups = [];
  let shields = [];          // rare shield-acorn pickups
  let hasShield = false;     // carrying a shield this run
  let shieldFreeze = 0;      // world frozen just after a shield absorbs a hit
  let shieldSlow = 0;        // slow-motion recovery window after the freeze
  let particles = [];
  let stars = [];
  let speed = BASE_SPEED;
  let distance = 0;
  let lastSpawnX = 0;
  let powerLeft = 0;
  let flapBoost = 0;
  let deadTimer = 0;
  let titlePulse = 0;
  let hitCooldown = 0;
  let hangarScroll = 0;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.min(rect.width, 480);
    H = rect.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (mode === 'title' || mode === 'hangar' || mode === 'suits') initStars();
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.6 + 0.25,
        a: Math.random() * 0.75 + 0.2,
        tw: Math.random() * Math.PI * 2,
        bright: Math.random() < 0.12,
      });
    }
  }

  function resetRun() {
    score = 0;
    runAcorns = 0;
    squirrel = { y: H * 0.45, vy: 0, rot: 0 };
    planets = [];
    acorns = [];
    powerups = [];
    shields = [];
    hasShield = false;
    shieldFreeze = 0;
    shieldSlow = 0;
    particles = [];
    speed = BASE_SPEED;
    distance = 0;
    lastSpawnX = W * 0.7;
    powerLeft = 0;
    flapBoost = 0;
    deadTimer = 0;
    hitCooldown = 0;
    for (let i = 0; i < 3; i++) spawnPair(W + 80 + i * gapSpacing());
  }

  function gapSpacing() {
    return 240 + Math.min(50, distance * 0.005);
  }

  function difficulty() {
    const t = Math.min(1, distance / 12000);
    return {
      speed: BASE_SPEED + (MAX_SPEED - BASE_SPEED) * t,
      gap: GAP_BASE - (GAP_BASE - GAP_MIN) * t,
    };
  }

  // Obstacle types for around-path seals (not planets)
  const OB_TYPES = ['asteroid','debris','satellite','ufo','crystal','rock','junk'];

  function makeObstacle(y, xOff) {
    const type = OB_TYPES[Math.floor(Math.random() * OB_TYPES.length)];
    // Larger hit/visual size so the flight lane is actually blocked
    const r = type === 'ufo' ? 24 + Math.random() * 5
            : type === 'satellite' ? 22 + Math.random() * 5
            : type === 'crystal' ? 20 + Math.random() * 5
            : type === 'debris' || type === 'junk' ? 19 + Math.random() * 5
            : 22 + Math.random() * 6;
    return {
      y, r, type,
      xOff: xOff,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.8,
      seed: Math.floor(Math.random() * 1000),
    };
  }

  function spawnPair(x) {
    const d = difficulty();
    // Main gap UNCHANGED — only seal the around-path above/below
    const gap = d.gap;
    const margin = 70;
    const gapCenter = margin + gap / 2 + Math.random() * (H - 2 * margin - gap);
    const kindA = Math.floor(Math.random() * 9);
    const kindB = Math.floor(Math.random() * 9);
    const topY = gapCenter - gap / 2 - PLANET_R;
    const botY = gapCenter + gap / 2 + PLANET_R;
    // Fully seal the corridor ABOVE the top gate and BELOW the bottom gate.
    // Tight vertical packing in the flight lane so you cannot slip around.
    const blockers = [];
    const topEdge = topY - PLANET_R;
    const botEdge = botY + PLANET_R;
    // Step small enough that obstacle radii overlap the flight path
    const step = 30;

    // From just above top planet → screen top
    {
      let y = topEdge - 26;
      let n = 0;
      while (y > 20) {
        // tiny lateral jitter only — stay in the lane
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y -= step;
        n++;
        if (n > 12) break; // safety
      }
    }
    // From just below bottom planet → screen bottom
    {
      let y = botEdge + 26;
      let n = 0;
      while (y < H - 20) {
        const xOff = ((n % 2) * 2 - 1) * (2 + Math.random() * 5);
        blockers.push(makeObstacle(y, xOff));
        y += step;
        n++;
        if (n > 12) break;
      }
    }
    planets.push({
      x, gapY: gapCenter, gap, r: PLANET_R,
      topKind: kindA, botKind: kindB, scored: false,
      blockers,
    });
    if (Math.random() < 0.55) {
      acorns.push({
        x: x + 8,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.35),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // rarer power-up acorn
    if (Math.random() < 0.05) {
      powerups.push({
        x: x + 40,
        y: gapCenter + (Math.random() - 0.5) * (gap * 0.25),
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    // shield acorn — very rare, on average one per 100 gates
    if (Math.random() < 0.01) {
      shields.push({
        x: x + 20,
        y: gapCenter,
        got: false,
        bob: Math.random() * Math.PI * 2,
      });
    }
    lastSpawnX = x;
  }

  function flap() {
    if (mode === 'ready') {
      mode = 'play';
    }
    if (mode !== 'play') return;
    squirrel.vy = FLAP;
    flapBoost = 0.22;
    // rocket particles from butt
    const sx = W * SQUIRREL_X - 10;
    const sy = squirrel.y + 6;
    for (let i = 0; i < 10; i++) {
      particles.push({
        x: sx, y: sy,
        vx: -80 - Math.random() * 120,
        vy: (Math.random() - 0.5) * 90,
        life: 0.25 + Math.random() * 0.2,
        max: 0.45,
        r: 2 + Math.random() * 3,
        kind: 'flame',
      });
    }
  }

  // —— input ——
  function onPointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const x = (t.clientX - rect.left) * (W / rect.width);
    const y = (t.clientY - rect.top) * (H / rect.height);
    handleTap(x, y);
  }
  function handleTap(x, y) {
    if (mode === 'title') {
      for (const b of titleButtons()) {
        if (hit(x, y, b)) {
          if (b.id === 'fly') { resetRun(); mode = 'ready'; }
          else if (b.id === 'hangar') mode = 'hangar';
          else mode = 'suits';
          return;
        }
      }
      return;
    }
    if (mode === 'hangar' || mode === 'suits') {
      const back = { x: 56, y: 44, w: 80, h: 36 };
      if (hit(x, y, back)) { mode = 'title'; return; }
      const list = mode === 'hangar' ? HELMETS : SUITS;
      const cols = 3;
      const cellW = (W - 48) / cols;
      const startY = 96; // must match the value used when drawing the grid
      list.forEach((item, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = 24 + col * cellW + cellW / 2;
        const cy = startY + row * 118 + 44;
        if (Math.hypot(x - cx, y - cy) < 46) {
          if (mode === 'hangar') {
            if (save.unlocked.includes(item.id)) {
              save.equipped = item.id;
              writeSave(save);
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save.unlocked.push(item.id);
              save.equipped = item.id;
              writeSave(save);
            }
          } else {
            const owned = save.unlockedSuits.includes(item.id);
            if (owned) {
              save.equippedSuit = item.id;
              writeSave(save);
            } else if (save.acorns >= item.cost) {
              save.acorns -= item.cost;
              save.unlockedSuits.push(item.id);
              save.equippedSuit = item.id;
              writeSave(save);
            }
          }
        }
      });
      return;
    }
    if (mode === 'ready' || mode === 'play') {
      flap();
      return;
    }
    if (mode === 'dead') {
      if (deadTimer > 0.6) {
        // bank acorns
        save.acorns += runAcorns;
        if (score > save.highScore) save.highScore = score;
        writeSave(save);
        mode = 'title';
      }
    }
  }
  function hit(x, y, b) {
    return x > b.x - b.w / 2 && x < b.x + b.w / 2 && y > b.y - b.h / 2 && y < b.y + b.h / 2;
  }

  canvas.addEventListener('pointerdown', onPointer, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (mode === 'title') { resetRun(); mode = 'ready'; }
      else if (mode === 'ready' || mode === 'play') flap();
      else if (mode === 'dead' && deadTimer > 0.6) {
        save.acorns += runAcorns;
        if (score > save.highScore) save.highScore = score;
        writeSave(save);
        mode = 'title';
      }
    }
  });

  // —— update ——
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    titlePulse += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function update(dt) {
    // ambient stars
    for (const s of stars) s.tw += dt * 2;

    if (mode === 'play') {
      const slow = (powerLeft > 0 || shieldSlow > 0) ? SLOW_FACTOR : 1;
      let simDt = dt * slow;

      // Shield aftermath: a short full freeze, then a slow-motion window.
      // The freeze runs on real time; the slow timer starts once it ends.
      if (shieldFreeze > 0) {
        shieldFreeze = Math.max(0, shieldFreeze - dt);
        simDt = 0;
      } else if (shieldSlow > 0) {
        shieldSlow = Math.max(0, shieldSlow - dt);
      }

      if (powerLeft > 0) {
        powerLeft = Math.max(0, powerLeft - dt);
      }

      const d = difficulty();
      speed = d.speed;

      squirrel.vy += GRAVITY * simDt;
      squirrel.y += squirrel.vy * simDt;
      squirrel.rot = Math.max(-0.55, Math.min(0.9, squirrel.vy / 700));

      if (flapBoost > 0) flapBoost = Math.max(0, flapBoost - dt);

      const move = speed * simDt;
      distance += move;

      for (const p of planets) p.x -= move;
      for (const a of acorns) { a.x -= move; a.bob += dt * 4; }
      for (const a of powerups) { a.x -= move; a.bob += dt * 5; }
      for (const a of shields) { a.x -= move; a.bob += dt * 3; }

      // spawn — scroll tracker, keep at least one planet ahead
      lastSpawnX -= move;
      while (lastSpawnX < W + 80) {
        spawnPair(lastSpawnX + gapSpacing());
      }

      // cull
      planets = planets.filter(p => p.x > -80);
      acorns = acorns.filter(a => a.x > -40 && !a.got);
      powerups = powerups.filter(a => a.x > -40 && !a.got);
      shields = shields.filter(a => a.x > -40 && !a.got);

      // score
      const sx = W * SQUIRREL_X;
      for (const p of planets) {
        if (!p.scored && p.x + p.r < sx - 12) {
          p.scored = true;
          score += 1;
        }
      }

      // collisions — circle approx on squirrel
      const sr = 16;
      const sy = squirrel.y;
      // off screen
      if (hitCooldown > 0) hitCooldown = Math.max(0, hitCooldown - simDt);

      // Ceiling bounces you back down — only debris is lethal up there.
      // Falling off the bottom of the screen still ends the run.
      if (sy < sr && squirrel.vy < 0) {
        squirrel.y = sr;
        squirrel.vy = Math.abs(squirrel.vy) * 0.45 + 90;
        squirrel.rot = 0.5;
        spark(sx, 4, 'poof');
      }
      if (sy > H + 30) {
        die(); return;
      }

      // Debris ALWAYS kills — checked first, every frame, no cooldown.
      // (The bounce cooldown below only stops planet bounces re-triggering;
      // it must never grant safe passage through obstacles.)
      // The one exception is a carried shield acorn, which absorbs exactly
      // one debris hit and is consumed doing it.
      for (const p of planets) {
        for (const b of (p.blockers || [])) {
          const bx = p.x + (b.xOff || 0);
          if (circleHit(sx, sy, sr, bx, b.y, b.r * 0.92)) {
            if (hasShield) { absorbShield(bx, b.y); return; }
            die(); return;
          }
        }
      }

      // Main planets: recoverable bounce
      if (hitCooldown <= 0) {
        for (const p of planets) {
          const topY = p.gapY - p.gap / 2 - p.r;
          const botY = p.gapY + p.gap / 2 + p.r;
          if (circleHit(sx, sy, sr, p.x, topY, p.r * 0.92)) { bounceOff(p.x, topY); break; }
          if (circleHit(sx, sy, sr, p.x, botY, p.r * 0.92)) { bounceOff(p.x, botY); break; }
        }
      }

      // acorn collect
      for (const a of acorns) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 28) {
          a.got = true;
          runAcorns += 1;
          spark(a.x, a.y, 'gold');
        }
      }
      for (const a of powerups) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 5)) < 30) {
          a.got = true;
          powerLeft = POWER_DURATION;
          spark(a.x, a.y, 'cyan');
        }
      }
      for (const a of shields) {
        if (!a.got && Math.hypot(sx - a.x, sy - (a.y + Math.sin(a.bob) * 4)) < 30) {
          a.got = true;
          hasShield = true;
          spark(a.x, a.y, 'shield');
        }
      }
    }

    if (mode === 'dead') {
      deadTimer += dt;
      squirrel.vy += GRAVITY * dt * 0.6;
      squirrel.y += squirrel.vy * dt;
      squirrel.rot = Math.min(1.2, squirrel.rot + dt * 2);
    }

    // particles
    for (const p of particles) {
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === 'flame') p.vy -= 40 * dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function circleHit(x1, y1, r1, x2, y2, r2) {
    return Math.hypot(x1 - x2, y1 - y2) < r1 + r2;
  }

  function bounceOff(px, py) {
    // severe destabilize — recoverable, not instant death
    const sx = W * SQUIRREL_X;
    const sy = squirrel.y;
    let dx = sx - px, dy = sy - py;
    const dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;
    // hard knockback; mostly vertical so recovery is possible but shaky
    // (impulse reduced 20% — the old values launched you across the screen
    // even on a graze)
    squirrel.vy = dy * 545 + (dy >= 0 ? 210 : -370);
    squirrel.y += dy * 18;
    squirrel.rot = dy >= 0 ? 1.05 : -0.7;
    hitCooldown = 0.55;
    spark(sx, sy, 'poof');
  }

  function die() {
    mode = 'dead';
    deadTimer = 0;
    spark(W * SQUIRREL_X, squirrel.y, 'poof');
  }

  // A carried shield absorbs one debris hit: burst at the impact point,
  // vaporise nearby debris so the respawn spot is fair, snap the squirrel
  // back to centre, freeze briefly, then give a slow-motion recovery window.
  function absorbShield(bx, by) {
    hasShield = false;
    const sx = W * SQUIRREL_X;
    const cy = H * 0.45;
    spark(bx, by, 'shield');
    spark(bx, by, 'poof');
    for (const p of planets) {
      p.blockers = (p.blockers || []).filter(b => {
        const ax = p.x + (b.xOff || 0);
        return Math.hypot(ax - bx, b.y - by) > 110 &&
               Math.hypot(ax - sx, b.y - cy) > 150;
      });
    }
    squirrel.y = cy;
    squirrel.vy = 0;
    squirrel.rot = 0;
    hitCooldown = 0;
    shieldFreeze = 0.7;
    shieldSlow = 3;
    spark(sx, cy, 'shield');
  }

  function spark(x, y, kind) {
    const n = kind === 'poof' ? 18 : kind === 'shield' ? 16 : 10;
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 0.35 + Math.random() * 0.3,
        max: 0.6,
        r: 2 + Math.random() * 3,
        kind: kind === 'cyan' ? 'cyan' : kind === 'gold' ? 'gold'
            : kind === 'shield' ? 'shield' : 'poof',
      });
    }
  }

  // —— draw ——
  function draw() {
    // space bg
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070b18');
    g.addColorStop(1, '#0c1228');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // nebula wash
    ctx.fillStyle = 'rgba(40,60,110,0.12)';
    ctx.beginPath();
    ctx.ellipse(W * 0.7, H * 0.3, W * 0.5, H * 0.25, 0.3, 0, Math.PI * 2);
    ctx.fill();

    for (const s of stars) {
      const pulse = 0.55 + 0.45 * Math.sin(s.tw);
      ctx.globalAlpha = s.a * pulse;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.bright) {
        ctx.globalAlpha = s.a * pulse * 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - s.r * 2.5, s.y);
        ctx.lineTo(s.x + s.r * 2.5, s.y);
        ctx.moveTo(s.x, s.y - s.r * 2.5);
        ctx.lineTo(s.x, s.y + s.r * 2.5);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (mode === 'title') drawTitle();
    else if (mode === 'hangar') drawHangar();
    else if (mode === 'suits') drawSuits();
    else {
      drawWorld();
      drawHUD();
      if (mode === 'ready') drawReady();
      if (mode === 'dead') drawDead();
    }
  }

  function drawWorld() {
    for (const p of planets) {
      drawPlanet(p.x, p.gapY - p.gap / 2 - p.r, p.r, p.topKind);
      drawPlanet(p.x, p.gapY + p.gap / 2 + p.r, p.r, p.botKind);
      for (const b of (p.blockers || [])) {
        drawObstacle(p.x + (b.xOff || 0), b.y, b);
      }
    }
    for (const a of acorns) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, false);
    }
    for (const a of powerups) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 5, true);
    }
    for (const a of shields) {
      if (a.got) continue;
      drawAcorn(a.x, a.y + Math.sin(a.bob) * 4, 'shield');
    }
    for (const p of particles) drawParticle(p);
    drawSquirrel(W * SQUIRREL_X, squirrel.y, squirrel.rot);
  }


  function drawObstacle(x, y, b) {
    const r = b.r;
    const type = b.type || 'asteroid';
    const seed = b.seed || 0;
    const rot = (b.rot || 0) + (b.spin || 0) * (performance.now() / 1000);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    // soft contact shadow under every obstacle
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(2, r * 0.55, r * 0.7, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    if (type === 'asteroid') {
      // irregular body
      const pts = 8;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const jitter = 0.72 + ((seed * (i + 3)) % 9) / 22;
        const px = Math.cos(a) * r * jitter;
        const py = Math.sin(a) * r * jitter;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      const grd = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.08, 0, 0, r);
      grd.addColorStop(0, '#c8b8a0');
      grd.addColorStop(0.45, '#8a7a64');
      grd.addColorStop(1, '#3a3028');
      ctx.fillStyle = grd;
      ctx.fill();
      // rim
      ctx.strokeStyle = 'rgba(255,230,200,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // craters with rims
      for (let i = 0; i < 4; i++) {
        const a = (seed * 0.7 + i * 1.7) % (Math.PI * 2);
        const d = r * (0.2 + (i % 3) * 0.15);
        const cr = r * (0.1 + (i % 3) * 0.05);
        const cx = Math.cos(a) * d, cy = Math.sin(a) * d;
        ctx.fillStyle = 'rgba(25,20,15,0.5)';
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(180,160,130,0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (type === 'debris') {
      // main plate
      const grd = ctx.createLinearGradient(-r, -r, r, r);
      grd.addColorStop(0, '#9aa2aa');
      grd.addColorStop(0.5, '#5a626c');
      grd.addColorStop(1, '#2a3038');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.lineTo(r * 0.95, r * 0.15);
      ctx.lineTo(-r * 0.35, r * 0.8);
      ctx.closePath();
      ctx.fill();
      // secondary shard
      ctx.fillStyle = '#4a525c';
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, r * 0.05);
      ctx.lineTo(r * 0.25, -r * 0.3);
      ctx.lineTo(r * 0.1, r * 0.6);
      ctx.closePath();
      ctx.fill();
      // heat edge
      ctx.strokeStyle = 'rgba(255,100,30,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.95, -r * 0.25);
      ctx.lineTo(r * 0.55, -r * 0.85);
      ctx.stroke();
      // rivets
      ctx.fillStyle = '#c0c8d0';
      [[-0.4,-0.1],[0.2,-0.4],[0.4,0.05],[-0.15,0.4]].forEach(([dx,dy]) => {
        ctx.beginPath(); ctx.arc(dx * r, dy * r, 1.6, 0, Math.PI * 2); ctx.fill();
      });
    } else if (type === 'satellite') {
      // body
      const bg = ctx.createLinearGradient(-r * 0.4, -r * 0.5, r * 0.4, r * 0.5);
      bg.addColorStop(0, '#e8eef4');
      bg.addColorStop(1, '#687480');
      ctx.fillStyle = bg;
      ctx.fillRect(-r * 0.38, -r * 0.45, r * 0.76, r * 0.9);
      // window
      ctx.fillStyle = 'rgba(80,180,255,0.55)';
      ctx.fillRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-r * 0.18, -r * 0.25, r * 0.36, r * 0.28);
      // solar panels
      const panel = (x0) => {
        const pg = ctx.createLinearGradient(x0, 0, x0 + r * 0.55, 0);
        pg.addColorStop(0, '#1a4a7a');
        pg.addColorStop(0.5, '#3a8ad0');
        pg.addColorStop(1, '#1a4a7a');
        ctx.fillStyle = pg;
        ctx.fillRect(x0, -r * 0.3, r * 0.55, r * 0.6);
        ctx.strokeStyle = 'rgba(120,200,255,0.45)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          const py = -r * 0.3 + i * r * 0.15;
          ctx.beginPath(); ctx.moveTo(x0 + 2, py); ctx.lineTo(x0 + r * 0.53, py); ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          const px = x0 + i * r * 0.18;
          ctx.beginPath(); ctx.moveTo(px, -r * 0.28); ctx.lineTo(px, r * 0.28); ctx.stroke();
        }
      };
      panel(-r * 1.1);
      panel(r * 0.55);
      // dish / antenna
      ctx.strokeStyle = '#d0d8e0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(0, -r * 0.95); ctx.stroke();
      ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(0, -r * 1.0, r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -r * 0.7, r * 0.22, -2.2, -0.6); ctx.stroke();
    } else if (type === 'ufo') {
      // hull
      const hull = ctx.createRadialGradient(0, -r * 0.15, r * 0.1, 0, 0, r * 1.1);
      hull.addColorStop(0, '#f0f4f8');
      hull.addColorStop(0.4, '#90a0b8');
      hull.addColorStop(1, '#303848');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // rim ring
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.05, r * 0.32, 0, 0, Math.PI * 2);
      ctx.stroke();
      // dome
      const dome = ctx.createRadialGradient(-r * 0.1, -r * 0.35, r * 0.05, 0, -r * 0.15, r * 0.5);
      dome.addColorStop(0, 'rgba(180,240,255,0.85)');
      dome.addColorStop(0.6, 'rgba(60,160,220,0.55)');
      dome.addColorStop(1, 'rgba(20,60,100,0.35)');
      ctx.fillStyle = dome;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.18, r * 0.5, r * 0.4, 0, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(200,240,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // underglow lights
      for (let i = 0; i < 6; i++) {
        const a = -1.0 + i * 0.4;
        ctx.fillStyle = i % 2 ? '#ffd040' : '#40f0ff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.75, Math.sin(a) * r * 0.22 + r * 0.05, r * 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    } else if (type === 'crystal') {
      // outer crystal
      const cg = ctx.createLinearGradient(0, -r, 0, r);
      cg.addColorStop(0, 'rgba(220,180,255,0.95)');
      cg.addColorStop(0.45, 'rgba(140,70,230,0.9)');
      cg.addColorStop(1, 'rgba(60,20,120,0.85)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.lineTo(r * 0.35, r * 0.9);
      ctx.lineTo(-r * 0.4, r * 0.75);
      ctx.lineTo(-r * 0.65, -r * 0.15);
      ctx.closePath();
      ctx.fill();
      // inner highlight facet
      ctx.fillStyle = 'rgba(255,240,255,0.45)';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.75);
      ctx.lineTo(r * 0.28, -r * 0.05);
      ctx.lineTo(0, r * 0.35);
      ctx.lineTo(-r * 0.28, -r * 0.05);
      ctx.closePath();
      ctx.fill();
      // edge shine
      ctx.strokeStyle = 'rgba(255,255,255,0.65)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-r * 0.2, -r * 0.55);
      ctx.lineTo(r * 0.15, r * 0.25);
      ctx.stroke();
      // glow
      ctx.strokeStyle = 'rgba(180,100,255,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.05);
      ctx.lineTo(r * 0.6, -r * 0.1);
      ctx.stroke();
    } else if (type === 'rock') {
      const rg = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      rg.addColorStop(0, '#9a9080');
      rg.addColorStop(0.5, '#5a5048');
      rg.addColorStop(1, '#2a2420');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.98, r * 0.82, 0.35, 0, Math.PI * 2);
      ctx.fill();
      // lumps
      ctx.fillStyle = '#7a7060';
      ctx.beginPath();
      ctx.ellipse(-r * 0.25, -r * 0.28, r * 0.4, r * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(20,16,12,0.45)';
      ctx.beginPath(); ctx.arc(r * 0.3, r * 0.2, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-r * 0.35, r * 0.28, r * 0.14, 0, Math.PI * 2); ctx.fill();
      // highlight
      ctx.strokeStyle = 'rgba(220,200,170,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-r * 0.15, -r * 0.35, r * 0.35, r * 0.2, -0.4, 0, Math.PI * 2);
      ctx.stroke();
    } else { // junk
      // barrel body
      const jg = ctx.createLinearGradient(-r * 0.7, 0, r * 0.7, 0);
      jg.addColorStop(0, '#5a3a20');
      jg.addColorStop(0.4, '#c08040');
      jg.addColorStop(1, '#4a3018');
      ctx.fillStyle = jg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.72, r * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      // bands
      ctx.strokeStyle = '#e0a860';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, -r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.72, r * 0.22, 0, 0, Math.PI * 2); ctx.stroke();
      // rust spots
      ctx.fillStyle = 'rgba(80,40,10,0.4)';
      ctx.beginPath(); ctx.arc(-r * 0.25, r * 0.1, r * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
      // metal strut
      ctx.strokeStyle = '#b0b8c0';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(r * 0.45, -r * 0.7);
      ctx.lineTo(r * 1.15, r * 0.35);
      ctx.stroke();
      // joint ball
      const bg2 = ctx.createRadialGradient(r * 1.1, r * 0.3, 1, r * 1.15, r * 0.35, r * 0.2);
      bg2.addColorStop(0, '#e0e8f0');
      bg2.addColorStop(1, '#505860');
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.arc(r * 1.15, r * 0.35, r * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPlanet(x, y, r, kind) {
    const palettes = [
      // 0 ocean earth
      ['#2a6aa8', '#1a4068', '#6eb8e8', '#3a9a5a', '#1a5a38'],
      // 1 golden ringed
      ['#d4a84a', '#a07828', '#f0d88a', '#c9a04a', '#8a6020'],
      // 2 icy moon
      ['#b0c0d0', '#788898', '#e8f0f8', '#a0b0c0', '#606878'],
      // 3 lava / mars
      ['#c04020', '#701808', '#e87040', '#a03018', '#ff9040'],
      // 4 teal gas
      ['#1a9080', '#0c5848', '#5ad0b8', '#2a8070', '#0a4038'],
      // 5 rock grey
      ['#6a6e78', '#3c4048', '#a0a4ac', '#5a5e66', '#2a2c30'],
      // 6 desert
      ['#b07030', '#704018', '#e0a060', '#986028', '#503010'],
      // 7 deep blue gas
      ['#142850', '#081830', '#3a68a0', '#1e4070', '#0a1830'],
      // 8 pink alien
      ['#c06078', '#782840', '#e8a0b0', '#a04858', '#501828'],
    ];
    const [c1, c2, c3, c4, c5] = palettes[kind % palettes.length];

    // soft outer atmosphere glow
    const atmo = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.25);
    atmo.addColorStop(0, 'rgba(0,0,0,0)');
    atmo.addColorStop(0.7, 'rgba(160,200,255,0.04)');
    atmo.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.fillStyle = atmo;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // base sphere with richer lighting
    const grd = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.04, x + r * 0.15, y + r * 0.2, r * 1.05);
    grd.addColorStop(0, c3);
    grd.addColorStop(0.35, c1);
    grd.addColorStop(0.75, c2);
    grd.addColorStop(1, c5 || c2);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // surface detail (clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    if (kind === 0) { // earth continents + clouds
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.65;
      [[-0.2,-0.15,0.5,0.32,-0.5],[0.28,0.18,0.35,0.22,0.4],[-0.05,0.35,0.28,0.18,0.1]].forEach(([dx,dy,rx,ry,rot]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, rot, 0, Math.PI*2);
        ctx.fill();
      });
      // cloud wisps
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = 0.22;
      [[0.1,-0.3,0.3,0.1],[ -0.3,0.1,0.25,0.08],[0.25,0.3,0.2,0.07]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x+dx*r, y+dy*r, r*rx, r*ry, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 1 || kind === 7) { // gas bands
      for (let i = -3; i <= 3; i++) {
        ctx.strokeStyle = i % 2 === 0 ? c4 : c5;
        ctx.globalAlpha = 0.28 + (i % 2) * 0.1;
        ctx.lineWidth = r * (0.1 + Math.abs(i) * 0.02);
        ctx.beginPath();
        ctx.ellipse(x, y + i * r * 0.18, r * 0.96, r * 0.16, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // storm oval
      ctx.fillStyle = c3;
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.ellipse(x + r * 0.25, y + r * 0.1, r * 0.22, r * 0.14, 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (kind === 2 || kind === 5) { // craters + maria
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.35;
      [[-0.3,-0.25,0.22],[0.25,0.1,0.18],[-0.05,0.35,0.15],[0.35,-0.3,0.12],[-0.35,0.15,0.1],[0.1,-0.05,0.08]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
        // rim highlight
        ctx.strokeStyle = c3;
        ctx.globalAlpha = 0.25;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = c5;
      });
      ctx.globalAlpha = 1;
    } else if (kind === 3) { // lava + cracks
      ctx.fillStyle = c5;
      ctx.globalAlpha = 0.55;
      [[-0.15,-0.2,0.2],[0.2,0.15,0.18],[-0.25,0.25,0.12]].forEach(([dx,dy,s]) => {
        ctx.beginPath();
        ctx.arc(x + dx * r, y + dy * r, r * s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.strokeStyle = '#ff9040';
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 2.2;
      [[-0.45,-0.2,0.1,0.15,0.4,-0.1],[-0.2,0.3,0.15,0.05,0.45,0.2],[0.1,-0.35,0.0,-0.1,0.3,0.05]].forEach(([x1,y1,cx,cy,x2,y2]) => {
        ctx.beginPath();
        ctx.moveTo(x + x1 * r, y + y1 * r);
        ctx.quadraticCurveTo(x + cx * r, y + cy * r, x + x2 * r, y + y2 * r);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 4 || kind === 8) { // soft spots + haze
      ctx.fillStyle = c4;
      ctx.globalAlpha = 0.3;
      [[0.15,-0.2,0.4,0.28],[ -0.25,0.15,0.3,0.22]].forEach(([dx,dy,rx,ry]) => {
        ctx.beginPath();
        ctx.ellipse(x + dx * r, y + dy * r, r * rx, r * ry, 0.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    } else if (kind === 6) { // desert dunes
      ctx.strokeStyle = c5;
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.8, y + i * r * 0.22);
        ctx.quadraticCurveTo(x, y + i * r * 0.22 - r * 0.08, x + r * 0.8, y + i * r * 0.22);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // terminator / night side soft shadow
    const night = ctx.createLinearGradient(x - r, y, x + r, y);
    night.addColorStop(0, 'rgba(0,0,0,0)');
    night.addColorStop(0.55, 'rgba(0,0,0,0)');
    night.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = night;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // rings (drawn outside clip)
    if (kind === 1) {
      ctx.strokeStyle = 'rgba(212,175,55,0.8)';
      ctx.lineWidth = Math.max(2.5, r * 0.08);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.45, r * 0.28, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(212,175,55,0.35)';
      ctx.lineWidth = Math.max(1.2, r * 0.04);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.62, r * 0.32, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      // ring shadow on planet
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.95, r * 0.2, -0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (kind === 4) {
      ctx.strokeStyle = 'rgba(100,220,200,0.5)';
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.35, r * 0.22, 0.18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 7) {
      ctx.strokeStyle = 'rgba(100,140,220,0.45)';
      ctx.lineWidth = Math.max(1.8, r * 0.05);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.3, r * 0.2, -0.12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(100,140,220,0.25)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.42, r * 0.24, -0.12, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 2) {
      // thin icy ring
      ctx.strokeStyle = 'rgba(200,220,240,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.25, r * 0.15, 0.1, 0, Math.PI * 2);
      ctx.stroke();
    }

    // crisp limb highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawAcorn(x, y, power) {
    const shield = power === 'shield';
    ctx.save();
    ctx.translate(x, y);
    if (shield) {
      // protective bubble around the nut
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
      glow.addColorStop(0, 'rgba(110,255,170,0.4)');
      glow.addColorStop(0.55, 'rgba(60,220,130,0.16)');
      glow.addColorStop(1, 'rgba(60,220,130,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.85)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 17, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 17, -2.3, -1.2);
      ctx.stroke();
    } else if (power) {
      const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
      glow.addColorStop(0, 'rgba(100,230,255,0.45)');
      glow.addColorStop(0.5, 'rgba(60,180,255,0.18)');
      glow.addColorStop(1, 'rgba(60,180,255,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
    }
    // soft shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(1, 12, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // nut body with gradient
    const nut = ctx.createRadialGradient(-3, 0, 2, 0, 4, 12);
    if (shield) {
      nut.addColorStop(0, '#c8ffde');
      nut.addColorStop(0.5, '#4ade80');
      nut.addColorStop(1, '#14683a');
    } else if (power) {
      nut.addColorStop(0, '#c0f0ff');
      nut.addColorStop(0.5, '#5ad0f0');
      nut.addColorStop(1, '#1a70a0');
    } else {
      nut.addColorStop(0, '#e8b060');
      nut.addColorStop(0.5, '#c47a28');
      nut.addColorStop(1, '#6a3a10');
    }
    ctx.fillStyle = nut;
    ctx.beginPath();
    ctx.ellipse(0, 3, 9, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // stem notch line
    ctx.strokeStyle = power ? 'rgba(20,80,120,0.35)' : 'rgba(60,30,10,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -2); ctx.lineTo(0, 10);
    ctx.stroke();
    // cap
    const cap = ctx.createRadialGradient(0, -6, 1, 0, -4, 12);
    if (shield) {
      cap.addColorStop(0, '#3fbf74');
      cap.addColorStop(1, '#0c4a28');
    } else if (power) {
      cap.addColorStop(0, '#6ec8e8');
      cap.addColorStop(1, '#1a6088');
    } else {
      cap.addColorStop(0, '#8a5a28');
      cap.addColorStop(1, '#3a2010');
    }
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(0, -5, 11.5, 7.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-11, -6, 22, 4);
    // cap texture ridges
    ctx.strokeStyle = power ? 'rgba(255,255,255,0.2)' : 'rgba(255,200,120,0.2)';
    ctx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 4, -8); ctx.lineTo(i * 3.2, -3);
      ctx.stroke();
    }
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-3.5, 1, 2.8, 4.5, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticle(p) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.max(0, t);
    if (p.kind === 'flame') {
      ctx.fillStyle = t > 0.5 ? '#ffe080' : t > 0.25 ? '#ff8030' : '#ff4020';
    } else if (p.kind === 'cyan') {
      ctx.fillStyle = '#6ef0ff';
    } else if (p.kind === 'gold') {
      ctx.fillStyle = '#ffd060';
    } else if (p.kind === 'shield') {
      ctx.fillStyle = '#5dff9e';
    } else {
      ctx.fillStyle = '#e8dcc8';
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * t, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function equippedHelmet() {
    return HELMETS.find(h => h.id === save.equipped) || HELMETS[0];
  }

  function equippedSuit() {
    return SUITS.find(s => s.id === save.equippedSuit) || SUITS[0];
  }

  // ——————————————————————————————————————————————————————————
  //  CHARACTER RENDERING
  //  One renderer drives gameplay, the title screen and both shop grids,
  //  so the squirrel is identical everywhere it appears.
  //  Local space: origin at the chest, facing right.
  //  Art extents before scaling: x -37..27, y -34..20
  // ——————————————————————————————————————————————————————————

  const _rgba = {};
  function withAlpha(hex, a) {
    const key = hex + '|' + a;
    let v = _rgba[key];
    if (v) return v;
    const h = hex.replace('#', '');
    const full = h.length === 3 ? h[0] + h[0] + h[1] + h[1] + h[2] + h[2] : h;
    const n = parseInt(full, 16);
    v = 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    _rgba[key] = v;
    return v;
  }

  // —— tail ——————————————————————————————————————————————————
  // A tapered plume swept along a spline: thin at the hip, broad through the
  // middle, drawn to a point at the tip. The width modulation on the edges is
  // what makes it read as fur rather than as a wing.
  // Width stays nearly constant along the plume and the tip is left broad —
  // the discs give it a soft rounded cap. A thin→bulge→point profile reads
  // as a snake that swallowed an egg, not fur.
  // Proportions follow a real squirrel: slim at the hip, a gentle swell
  // through the middle, and a soft taper at the tip — not an even sausage.
  const TAIL_PTS = [
    [-2, 13], [-12, 12], [-20, 4.5], [-23, -7], [-19.5, -18], [-11.5, -25], [-4.5, -29],
  ];
  const TAIL_W = [3.2, 5.4, 6.6, 7.0, 6.6, 5.2, 2.8];
  // Sample count only needs to be dense enough that the discs overlap; the
  // spline is ~60px long, so 26 samples still leaves heavy overlap.
  const TAIL_N = 26;

  function splinePoint(pts, u) {
    const n = pts.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
    const f2 = f * f, f3 = f2 * f;
    const comp = (a, b, c, d) =>
      0.5 * (2 * b + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);
    return [comp(p0[0], p1[0], p2[0], p3[0]), comp(p0[1], p1[1], p2[1], p3[1])];
  }

  function tailWidth(u) {
    const n = TAIL_W.length - 1;
    const i = Math.max(0, Math.min(Math.floor(u), n - 1));
    const f = u - i;
    return TAIL_W[i] * (1 - f) + TAIL_W[i + 1] * f;
  }

  // The spline never changes, so it is sampled once at load instead of every
  // frame — the hangar draws nine of these characters per frame.
  const TAIL_SAMPLES = (function () {
    const seg = TAIL_PTS.length - 1;
    const out = [];
    for (let k = 0; k <= TAIL_N; k++) {
      const u = (k / TAIL_N) * seg;
      const p = splinePoint(TAIL_PTS, u);
      const q = splinePoint(TAIL_PTS, Math.min(u + 0.05, seg));
      let dx = q[0] - p[0], dy = q[1] - p[1];
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      out.push({
        x: p[0], y: p[1], w: tailWidth(u),
        nx: -dy, ny: dx,
        // phase normalised so the lobe count does not change with TAIL_N;
        // kept subtle — a hint of fur without looking like a cloud
        lobe: 1 + 0.05 * Math.sin((k / TAIL_N) * 26 - 0.6)
                + 0.025 * Math.sin((k / TAIL_N) * 47 + 1.7),
      });
    }
    return out;
  })();

  // The tail is swept as a union of tapered discs rather than a pair of
  // offset curves: offsetting folds in on itself where the tail bends hardest
  // and puts a notch in the silhouette, whereas overlapping discs cannot.
  function tailPath(wMul, shift, lobes) {
    const mul = wMul || 1;
    ctx.beginPath();
    for (let k = 0; k < TAIL_SAMPLES.length; k++) {
      const s = TAIL_SAMPLES[k];
      let r = s.w * mul;
      if (lobes) r *= s.lobe;
      const cx = shift ? s.x + s.nx * s.w * shift : s.x;
      const cy = shift ? s.y + s.ny * s.w * shift : s.y;
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
  }

  function drawTail(suit) {
    // emissive edge, drawn as a slightly larger silhouette behind the tail
    if (suit.glow) {
      tailPath(1.16, 0, true);
      ctx.fillStyle = withAlpha(suit.glow, 0.26);
      ctx.fill();
    }

    // dark keyline, same trick — a larger silhouette behind the fill
    tailPath(1.07, 0, true);
    ctx.fillStyle = suit.furDark;
    ctx.fill();

    tailPath(1, 0, true);
    const g = ctx.createLinearGradient(-30, 14, -4, -26);
    g.addColorStop(0, suit.furDark);
    g.addColorStop(0.35, suit.fur);
    g.addColorStop(0.82, suit.fur);
    g.addColorStop(1, suit.belly);
    ctx.fillStyle = g;
    ctx.fill();

    // lighter inner streak — the two-tone underside real squirrels have
    ctx.save();
    ctx.clip();
    ctx.globalAlpha = 0.36;
    ctx.fillStyle = suit.belly;
    tailPath(0.46, -0.38, false);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // a few fur strands for texture
    ctx.strokeStyle = withAlpha(suit.furDark, 0.32);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    for (let i = 1; i <= 6; i++) {
      const s = TAIL_SAMPLES[Math.round((i / 7.2) * (TAIL_SAMPLES.length - 1))];
      // strands lean back along the plume like brushed fur
      const lean = 0.35;
      ctx.beginPath();
      ctx.moveTo(s.x + s.nx * s.w * 0.2, s.y + s.ny * s.w * 0.2);
      ctx.lineTo(s.x + s.nx * s.w * 0.88 - s.ny * s.w * lean,
                 s.y + s.ny * s.w * 0.88 + s.nx * s.w * lean);
      ctx.stroke();
    }
  }

  // —— body ——————————————————————————————————————————————————
  function drawSuitBody(suit) {
    // hind haunch
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(-6, 10, 8.4, 8.0, 0.18, 0, Math.PI * 2);
    ctx.fill();

    // hind foot
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(0.5, 17.2, 5.8, 3.0, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.suitDark, 0.75);
    ctx.lineWidth = 0.8;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(3.4 + i * 1.5, 16.1);
      ctx.lineTo(4.6 + i * 1.5, 18.3);
      ctx.stroke();
    }

    // torso
    const g = ctx.createRadialGradient(-4, 2, 2, 1, 9, 18);
    g.addColorStop(0, suit.suitLite);
    g.addColorStop(0.5, suit.suit);
    g.addColorStop(1, suit.suitDark);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // chest panel
    ctx.fillStyle = withAlpha(suit.trim, 0.2);
    ctx.beginPath();
    ctx.ellipse(2.5, 9, 6.8, 7.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // shoulder trim stripe
    ctx.strokeStyle = suit.trim;
    ctx.lineWidth = 2.1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9.5, 4.5);
    ctx.quadraticCurveTo(-2, 0.6, 6, 3.4);
    ctx.stroke();

    // control panel on the belly
    ctx.fillStyle = suit.suitDark;
    roundRect(1.5, 9.5, 6.5, 5.5, 1.8);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.trim, 0.7);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.fillStyle = suit.trim;
    ctx.beginPath();
    ctx.arc(3.4, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.glow || suit.trim;
    ctx.beginPath();
    ctx.arc(6.2, 12.2, 0.95, 0, Math.PI * 2);
    ctx.fill();

    // front paws, held forward the way a squirrel holds a nut
    ctx.fillStyle = suit.suitDark;
    ctx.beginPath();
    ctx.ellipse(9.5, 10.5, 4.2, 3.3, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(12.4, 9.0, 3.0, 2.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.suitDark, 0.85);
    ctx.lineWidth = 0.7;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(13.6 + i * 1.3, 7.8 + i * 0.9);
      ctx.lineTo(14.9 + i * 1.2, 9.1 + i * 0.9);
      ctx.stroke();
    }

    // rim light so the silhouette separates from the starfield
    ctx.strokeStyle = suit.glow ? withAlpha(suit.glow, 0.8) : 'rgba(255,236,200,0.32)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(0, 7, 13.0, 11.8, 0, 0.35, 2.6);
    ctx.stroke();
  }

  // —— head ——————————————————————————————————————————————————
  function drawHead(suit) {
    // far ear (behind the head)
    ctx.fillStyle = suit.furDark;
    ctx.beginPath();
    ctx.ellipse(6.0, -20.6, 3.2, 5.2, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // head
    const hg = ctx.createRadialGradient(7.5, -15, 2, 11, -9, 15);
    hg.addColorStop(0, suit.fur);
    hg.addColorStop(0.62, suit.fur);
    hg.addColorStop(1, suit.furDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(10, -11, 9.6, 9.0, 0, 0, Math.PI * 2);
    ctx.fill();

    // cheek fluff
    ctx.fillStyle = withAlpha(suit.belly, 0.5);
    ctx.beginPath();
    ctx.ellipse(11.4, -6.8, 5.0, 3.3, 0.25, 0, Math.PI * 2);
    ctx.fill();

    // near ear, with inner pink and a tuft
    ctx.fillStyle = suit.fur;
    ctx.beginPath();
    ctx.ellipse(11.4, -19.8, 3.8, 5.6, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eeae94';
    ctx.beginPath();
    ctx.ellipse(11.6, -19.4, 1.8, 3.2, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = suit.furDark;
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(10.4, -24.2); ctx.lineTo(9.5, -26.6);
    ctx.moveTo(12.8, -24.0); ctx.lineTo(13.6, -26.4);
    ctx.stroke();

    // muzzle
    ctx.fillStyle = suit.belly;
    ctx.beginPath();
    ctx.ellipse(16.4, -8.6, 5.2, 4.2, 0.16, 0, Math.PI * 2);
    ctx.fill();

    // buck teeth — the strongest "this is a rodent" cue
    ctx.fillStyle = '#fffaf0';
    roundRect(17.2, -6.3, 3.8, 4.3, 1.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,110,70,0.55)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(19.1, -6.1); ctx.lineTo(19.1, -2.2);
    ctx.stroke();

    // nose
    ctx.fillStyle = '#3a2418';
    ctx.beginPath();
    ctx.ellipse(20.2, -10.0, 2.0, 1.6, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(19.7, -10.6, 0.7, 0.5, 0.35, 0, Math.PI * 2);
    ctx.fill();

    // whiskers
    ctx.strokeStyle = withAlpha(suit.belly, 0.5);
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(19.2, -8.4); ctx.lineTo(23.6, -9.6);
    ctx.moveTo(19.2, -7.6); ctx.lineTo(23.4, -6.7);
    ctx.stroke();

    // eye
    ctx.fillStyle = '#181008';
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 2.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(14.3, -13.9, 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(12.5, -11.9, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = withAlpha(suit.furDark, 0.85);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(13.4, -13.0, 4.6, -2.5, -1.15);
    ctx.stroke();
  }

  // —— atmosphere ————————————————————————————————————————————
  function drawAura(color, t, seed) {
    const pulse = 0.88 + 0.12 * Math.sin(t * 1.7 + seed);
    const r = 42 * pulse;
    const g = ctx.createRadialGradient(0, -4, 8, 0, -4, r);
    g.addColorStop(0, withAlpha(color, 0.2));
    g.addColorStop(0.45, withAlpha(color, 0.08));
    g.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, -4, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Cosmic dust drifting around the character. Positions come from the clock
  // so no per-instance state is needed and every shop cell can differ.
  function drawDust(color, t, seed, front) {
    const n = front ? 3 : 7;
    const off = (front ? 31 : 0) + seed * 3.7;
    for (let i = 0; i < n; i++) {
      const k = i * 1.9 + off;
      const a = t * 0.5 + k;
      const rad = 26 + 11 * Math.sin(t * 0.65 + k);
      const mx = Math.cos(a) * rad * 1.1;
      const my = -5 + Math.sin(a) * rad * 0.78;
      const tw = 0.5 + 0.5 * Math.sin(t * 2.1 + k * 2.2);
      ctx.globalAlpha = (front ? 0.55 : 0.8) * (0.2 + 0.6 * tw);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(mx, my, 0.7 + 1.5 * tw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawThruster(f, suit) {
    const len = 10 + 16 * f;
    const g = ctx.createLinearGradient(-9, 15, -9 - len, 15);
    g.addColorStop(0, withAlpha(suit.trim, 0.95 * f));
    g.addColorStop(0.35, 'rgba(255,190,70,' + (0.85 * f) + ')');
    g.addColorStop(1, 'rgba(255,70,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-8, 12.5);
    ctx.quadraticCurveTo(-9 - len, 15.5, -8, 18.5);
    ctx.quadraticCurveTo(-5, 15.5, -8, 12.5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,248,190,' + (0.9 * f) + ')';
    ctx.beginPath();
    ctx.moveTo(-8, 13.8);
    ctx.quadraticCurveTo(-10 - len * 0.45, 15.5, -8, 17.2);
    ctx.quadraticCurveTo(-6, 15.5, -8, 13.8);
    ctx.fill();
  }

  // —— helmet ————————————————————————————————————————————————
  const HELM_C = { x: 11, y: -11, r: 15.2 };

  function drawHelmet(helm, suit, t, seed) {
    const c = HELM_C;

    if (helm.glow) {
      const pulse = 0.9 + 0.1 * Math.sin(t * 2 + seed);
      const g = ctx.createRadialGradient(c.x, c.y, c.r * 0.85, c.x, c.y, c.r * 1.5 * pulse);
      g.addColorStop(0, withAlpha(helm.glow, 0.34));
      g.addColorStop(0.5, withAlpha(helm.glow, 0.12));
      g.addColorStop(1, withAlpha(helm.glow, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r * 1.5 * pulse, 0, Math.PI * 2);
      ctx.fill();
    }

    // glass tint — kept light so the squirrel's face stays readable
    ctx.fillStyle = withAlpha(helm.visor, helm.tint);
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    // curved-glass depth toward the lower right
    const dg = ctx.createRadialGradient(c.x - 5, c.y - 6, 2, c.x + 2, c.y + 3, c.r);
    dg.addColorStop(0, 'rgba(255,255,255,0.1)');
    dg.addColorStop(0.55, 'rgba(255,255,255,0)');
    dg.addColorStop(1, withAlpha(helm.trim, 0.28));
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.clip();
    drawVisorArt(helm, t, seed);
    ctx.restore();

    // specular highlights
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.ellipse(c.x - 5.5, c.y - 6.5, 6.4, 4.8, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -2.35, -1.15);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 2.6, -0.75, -0.15);
    ctx.stroke();

    // rim
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = withAlpha(helm.trim, 0.85);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r - 1.9, 0, Math.PI * 2);
    ctx.stroke();

    drawHelmetOrnament(helm, t, seed);

    // neck seal — opaque, so the dome reads as sitting on the suit
    ctx.fillStyle = suit.suitDark;
    roundRect(2.5, 0.5, 17, 7, 3.2);
    ctx.fill();
    ctx.strokeStyle = helm.rim;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = withAlpha(helm.rim, 0.45);
    ctx.beginPath();
    ctx.ellipse(11, 2.4, 7.2, 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === 1 ? (helm.glow || helm.rim) : withAlpha(suit.trim, 0.9);
      ctx.beginPath();
      ctx.arc(6.5 + i * 4.5, 5.6, 1.0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawVisorArt(helm, t, seed) {
    const c = HELM_C;
    if (helm.id === 'ion') {
      ctx.strokeStyle = 'rgba(120,230,255,0.4)';
      ctx.lineWidth = 0.8;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(c.x - 14, c.y + i * 6 + 2);
        ctx.lineTo(c.x + 14, c.y + i * 6 - 2);
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(140,240,255,0.6)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(c.x + 5, c.y - 5, 4.5, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'nebula') {
      // Additive so it reads as a galaxy reflected in the glass rather than
      // paint covering the squirrel's face, and offset up-left off the face.
      ctx.globalCompositeOperation = 'lighter';
      const gx = c.x - 6, gy = c.y - 6;
      const g = ctx.createRadialGradient(gx, gy, 1, gx, gy, 13);
      g.addColorStop(0, 'rgba(150,80,170,0.5)');
      g.addColorStop(0.45, 'rgba(90,30,130,0.3)');
      g.addColorStop(1, 'rgba(40,10,70,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(190,130,220,0.5)';
      ctx.lineWidth = 1.2;
      for (let a = 0; a < 2; a++) {
        ctx.beginPath();
        for (let i = 0; i < 18; i++) {
          const th = i * 0.3 + a * Math.PI + t * 0.35;
          const rr = i * 0.44;
          const px = gx + Math.cos(th) * rr;
          const py = gy + Math.sin(th) * rr * 0.75;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    } else if (helm.id === 'lunar') {
      ctx.fillStyle = 'rgba(120,135,160,0.32)';
      const craters = [[-7, -10, 2.5], [1, -13, 1.9], [8, -10.5, 2.8], [-2, -7, 1.5], [12, -5, 2.1]];
      for (let i = 0; i < craters.length; i++) {
        ctx.beginPath();
        ctx.arc(c.x + craters[i][0], c.y + craters[i][1], craters[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (helm.id === 'void') {
      // additive rings high on the dome, clear of the face
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(150,80,220,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 10, 2.8, -0.3 + Math.sin(t * 0.4) * 0.06, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,130,60,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y - 8, 6.4, 1.8, -0.3, 0, Math.PI * 2);
      ctx.stroke();
    } else if (helm.id === 'cherry') {
      ctx.strokeStyle = 'rgba(255,200,220,0.45)';
      ctx.lineWidth = 1.1;
      const pts = [[0, -12.5], [10, -4.5], [6, 8], [-6, 8], [-10, -4.5]];
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        if (i === 0) ctx.moveTo(c.x + pts[i][0], c.y + pts[i][1]);
        else ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        ctx.moveTo(c.x, c.y);
        ctx.lineTo(c.x + pts[i][0], c.y + pts[i][1]);
      }
      ctx.stroke();
    } else if (helm.id === 'solar') {
      ctx.strokeStyle = 'rgba(255,210,130,0.35)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(c.x + 2, c.y + 2, 4 + i * 4, -2.6, -0.6);
        ctx.stroke();
      }
    } else if (helm.id === 'royal') {
      ctx.strokeStyle = 'rgba(255,220,140,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 10.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawHelmetOrnament(helm, t, seed) {
    const c = HELM_C;
    const id = helm.id;

    if (id === 'clear') {
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x - 12.2, c.y + 6.4, 2.0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x - 13.8, c.y - 1, 1.6, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'ion') {
      const flick = 0.75 + 0.25 * Math.sin(t * 7 + seed);
      ctx.strokeStyle = helm.rim;
      ctx.lineWidth = 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.x - 6, c.y - 13.5); ctx.lineTo(c.x - 8.5, c.y - 21);
      ctx.moveTo(c.x + 6, c.y - 13.5); ctx.lineTo(c.x + 8.5, c.y - 21);
      ctx.stroke();
      ctx.fillStyle = helm.glow;
      ctx.beginPath(); ctx.arc(c.x - 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(c.x + 8.5, c.y - 22, 2.3 * flick, 0, Math.PI * 2); ctx.fill();
      // crackling arc between the tips, not a smooth handle
      ctx.strokeStyle = withAlpha(helm.glow, 0.85 * flick);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(c.x - 8.5, c.y - 22);
      const steps = 5;
      for (let i = 1; i <= steps; i++) {
        const px = c.x - 8.5 + (17 * i) / steps;
        const wob = (i % 2 ? -1 : 1) * (1.6 + 1.4 * Math.sin(t * 9 + i + seed));
        ctx.lineTo(px, c.y - 24.5 + wob);
      }
      ctx.stroke();

    } else if (id === 'solar') {
      ctx.fillStyle = helm.rim;
      const angles = [-1.15, -0.72, -0.29, 0.14, 0.57];
      for (let i = 0; i < angles.length; i++) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(angles[i]);
        ctx.beginPath();
        ctx.moveTo(-3.2, -c.r + 1.5);
        ctx.lineTo(0, -c.r - 7);
        ctx.lineTo(3.2, -c.r + 1.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = withAlpha('#ffe9a8', 0.9);
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.5, 2.0, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'nebula') {
      for (let i = 0; i < 3; i++) {
        const a = t * 0.9 + i * 2.1 + seed;
        const mx = c.x + Math.cos(a) * (c.r + 5);
        const my = c.y + Math.sin(a) * (c.r + 5) * 0.55;
        ctx.fillStyle = withAlpha('#ffd7ff', 0.85);
        ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = withAlpha('#ffd7ff', 0.4);
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(mx - 3.2, my); ctx.lineTo(mx + 3.2, my);
        ctx.moveTo(mx, my - 3.2); ctx.lineTo(mx, my + 3.2);
        ctx.stroke();
      }

    } else if (id === 'lunar') {
      ctx.fillStyle = helm.rim;
      roundRect(c.x - 6.5, c.y - c.r - 5, 13, 4.6, 2);
      ctx.fill();
      ctx.fillStyle = '#f2f6ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 2.7, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = helm.trim;
      ctx.beginPath(); ctx.arc(c.x + 1.5, c.y - c.r - 3.3, 2.8, 0, Math.PI * 2); ctx.fill();

    } else if (id === 'void') {
      // orbital rings ride high on the dome so they never cross the face
      const ry = c.y - 7;
      ctx.strokeStyle = withAlpha('#d4af37', 0.9);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 4, (c.r + 4) * 0.3, -0.34 + Math.sin(t * 0.5) * 0.05, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = withAlpha('#b45cff', 0.5);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(c.x, ry, c.r + 7, (c.r + 7) * 0.27, -0.34, 0, Math.PI * 2);
      ctx.stroke();

    } else if (id === 'comet') {
      const f = 0.85 + 0.15 * Math.sin(t * 6 + seed);
      ctx.fillStyle = helm.rim;
      ctx.beginPath();
      ctx.moveTo(c.x - 5, c.y - c.r + 1);
      ctx.quadraticCurveTo(c.x - 3, c.y - c.r - 11 * f, c.x + 3, c.y - c.r - 4.5);
      ctx.quadraticCurveTo(c.x + 5, c.y - c.r - 9 * f, c.x + 8, c.y - c.r + 2);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 5, c.y - c.r + 1);
      ctx.fill();
      ctx.fillStyle = '#ffd77a';
      ctx.beginPath();
      ctx.moveTo(c.x - 2, c.y - c.r);
      ctx.quadraticCurveTo(c.x, c.y - c.r - 7 * f, c.x + 3, c.y - c.r - 1);
      ctx.quadraticCurveTo(c.x + 1, c.y - c.r - 3, c.x - 2, c.y - c.r);
      ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = (t * 1.4 + i * 0.7 + seed) % 1;
        ctx.fillStyle = withAlpha('#ff9a3c', 0.8 * (1 - k));
        ctx.beginPath();
        ctx.arc(c.x - 14 - k * 12, c.y - 8 + Math.sin(i * 2 + t * 3) * 3, 1.8 * (1 - k) + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'cherry') {
      for (let i = 0; i < 4; i++) {
        const a = t * 0.7 + i * 1.6 + seed;
        const px = c.x + Math.cos(a) * (c.r + 6);
        const py = c.y + Math.sin(a * 1.1) * (c.r + 3) * 0.6;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        ctx.fillStyle = withAlpha('#ffc2da', 0.9);
        ctx.beginPath();
        ctx.ellipse(0, 0, 2.5, 1.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = helm.rim;
      for (let i = 0; i < 5; i++) {
        const a = -1.9 + i * 0.42;
        ctx.beginPath();
        ctx.ellipse(c.x + Math.cos(a) * c.r, c.y + Math.sin(a) * c.r, 2.2, 1.4, a, 0, Math.PI * 2);
        ctx.fill();
      }

    } else if (id === 'royal') {
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(c.x - 9.5, c.y - c.r + 2);
      ctx.lineTo(c.x - 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x - 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x, c.y - c.r - 10);
      ctx.lineTo(c.x + 2.8, c.y - c.r - 2);
      ctx.lineTo(c.x + 7, c.y - c.r - 7.5);
      ctx.lineTo(c.x + 9.5, c.y - c.r + 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fff0b8';
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.fillStyle = '#ff6080';
      ctx.beginPath(); ctx.arc(c.x - 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#60c0ff';
      ctx.beginPath(); ctx.arc(c.x, c.y - c.r - 10.6, 1.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7dffb0';
      ctx.beginPath(); ctx.arc(c.x + 7, c.y - c.r - 8, 1.5, 0, Math.PI * 2); ctx.fill();
      for (let i = 0; i < 3; i++) {
        const k = 0.5 + 0.5 * Math.sin(t * 3 + i * 2.1 + seed);
        const sx = c.x - 11 + i * 11;
        const sy = c.y - c.r - 13 - i * 1.5;
        ctx.strokeStyle = withAlpha('#ffe9a8', k);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx - 2.4 * k, sy); ctx.lineTo(sx + 2.4 * k, sy);
        ctx.moveTo(sx, sy - 2.4 * k); ctx.lineTo(sx, sy + 2.4 * k);
        ctx.stroke();
      }
    }
  }

  // The one entry point. Everything in the game draws the character through
  // this, which is what keeps the hangar and gameplay identical.
  function drawAstronaut(x, y, rot, scale, helm, suit, opts) {
    opts = opts || {};
    const flame = opts.flame || 0;
    const seed = opts.seed || 0;
    const t = performance.now() / 1000;

    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (scale !== 1) ctx.scale(scale, scale);

    if (suit.glow) drawAura(suit.glow, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, false);
    if (flame > 0) drawThruster(flame, suit);
    drawTail(suit);
    drawSuitBody(suit);
    drawHead(suit);
    drawHelmet(helm, suit, t, seed);
    if (suit.dust) drawDust(suit.dust, t, seed, true);

    // protective bubble while carrying a shield acorn
    if (opts.shield) {
      const pu = 0.94 + 0.06 * Math.sin(t * 3.2 + seed);
      const r = 37 * pu;
      const g = ctx.createRadialGradient(0, -5, r * 0.6, 0, -5, r);
      g.addColorStop(0, 'rgba(93,255,158,0)');
      g.addColorStop(1, 'rgba(93,255,158,0.16)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,255,190,0.75)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, -5, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, -5, r - 2.5, -2.3, -1.3);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSquirrel(x, y, rot) {
    const flame = (flapBoost > 0 && (mode === 'play' || mode === 'ready')) ? flapBoost / 0.22 : 0;
    drawAstronaut(x, y, rot, 1, equippedHelmet(), equippedSuit(),
                  { flame: flame, seed: 0, shield: hasShield && (mode === 'play' || mode === 'ready') });
  }

  // Small acorn glyph for the HUD and shop headers — drawn rather than an
  // emoji, which renders differently on every platform.
  function drawAcornIcon(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#c47a28';
    ctx.beginPath();
    ctx.ellipse(0, 2.5, 4.6, 5.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e8b060';
    ctx.beginPath();
    ctx.ellipse(-1.4, 1.4, 1.9, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6a3a10';
    ctx.beginPath();
    ctx.ellipse(0, -2.6, 5.8, 3.6, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(-5.8, -3.2, 11.6, 1.8);
    ctx.strokeStyle = '#8a5a28';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -5.6);
    ctx.lineTo(0, -7.4);
    ctx.stroke();
    ctx.restore();
  }

  function drawHUD() {
    // score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(score), W / 2, 48);

    // high score
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('BEST ' + save.highScore, W / 2, 68);

    // run acorns
    ctx.textAlign = 'left';
    ctx.font = '600 14px system-ui';
    ctx.fillStyle = '#ffd080';
    drawAcornIcon(22, 23, 1);
    ctx.fillText(String(runAcorns), 32, 28);

    // carried shield indicator
    if (hasShield) {
      ctx.strokeStyle = 'rgba(140,255,190,0.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(22, 47, 9, 0, Math.PI * 2);
      ctx.stroke();
      drawAcornIcon(22, 46, 0.65);
      ctx.fillStyle = '#8cffbe';
      ctx.font = '600 12px system-ui';
      ctx.fillText('SHIELD', 36, 51);
    }

    // shield-break banner during the freeze and early recovery
    if (shieldFreeze > 0 || shieldSlow > 2.2) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#5dff9e';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('SHIELD ABSORBED!', W / 2, H * 0.3);
      ctx.font = '600 13px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('get ready…', W / 2, H * 0.3 + 22);
      ctx.textAlign = 'left';
    }

    // power-up timer
    if (powerLeft > 0) {
      const secs = Math.ceil(powerLeft);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui';
      ctx.fillStyle = '#6ef0ff';
      ctx.fillText('⏱ SLOW  ' + secs + 's', W / 2, 92);
      // bar
      const bw = 120;
      const pct = powerLeft / POWER_DURATION;
      ctx.fillStyle = 'rgba(110,240,255,0.2)';
      ctx.fillRect(W / 2 - bw / 2, 100, bw, 5);
      ctx.fillStyle = '#6ef0ff';
      ctx.fillRect(W / 2 - bw / 2, 100, bw * pct, 5);
    }
  }

  function drawReady() {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '600 18px system-ui';
    ctx.textAlign = 'center';
    const pulse = 0.85 + 0.15 * Math.sin(titlePulse * 4);
    ctx.globalAlpha = pulse;
    ctx.fillText('TAP TO FLY', W / 2, H * 0.38);
    ctx.globalAlpha = 1;
  }

  function drawDead() {
    ctx.fillStyle = 'rgba(5,8,16,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('CRASHED', W / 2, H * 0.36);
    ctx.font = '600 18px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('Score  ' + score, W / 2, H * 0.36 + 36);
    ctx.fillStyle = '#ffd080';
    ctx.fillText('+' + runAcorns + ' acorns', W / 2, H * 0.36 + 62);
    if (score >= save.highScore && score > 0) {
      ctx.fillStyle = '#6ef0ff';
      ctx.font = '600 14px system-ui';
      ctx.fillText('NEW BEST', W / 2, H * 0.36 + 88);
    }
    if (deadTimer > 0.6) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 15px system-ui';
      ctx.fillText('tap to continue', W / 2, H * 0.62);
    }
  }

  // Single source of truth for the title menu geometry — drawTitle renders
  // these rects and handleTap hit-tests the same ones, so the buttons and
  // their tap targets can never drift apart.
  function titleButtons() {
    const bw = Math.min(204, W * 0.52), bh = 56;
    const bx = 22 + bw / 2;
    const y0 = H * 0.56;
    return [
      { id: 'fly',    x: bx, y: y0,       w: bw, h: bh, label: 'FLY' },
      { id: 'hangar', x: bx, y: y0 + 68,  w: bw, h: bh, label: 'HANGAR' },
      { id: 'suits',  x: bx, y: y0 + 136, w: bw, h: bh, label: 'SUITS' },
    ];
  }

  function drawTitle() {
    // decorative planets
    drawPlanet(W * 0.15, H * 0.16, 28, 0);
    drawPlanet(W * 0.88, H * 0.12, 22, 4);
    drawPlanet(W * 0.82, H * 0.34, 36, 1);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 44px system-ui';
    ctx.fillText('ACORNAUT', W / 2, H * 0.2);
    ctx.font = '600 13px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('SOAR THE COSMOS · GATHER THE ACORNS', W / 2, H * 0.2 + 26);
    ctx.fillStyle = '#ffb040';
    ctx.font = 'bold 12px system-ui';
    ctx.fillText('BETA TEST BUILD', W / 2, H * 0.2 + 44);

    // high score + acorns
    ctx.font = '600 15px system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText('BEST  ' + save.highScore, W / 2, H * 0.31);
    ctx.fillStyle = '#ffd080';
    const acTxt = save.acorns + ' acorns';
    const acW = ctx.measureText(acTxt).width;
    const acLeft = W / 2 - (acW + 18) / 2;
    drawAcornIcon(acLeft + 6, H * 0.31 + 19, 1);
    ctx.fillText(acTxt, acLeft + 18 + acW / 2, H * 0.31 + 24);

    // hero squirrel on the right, menu column on the left
    drawAstronaut(W * 0.72, H * 0.66, Math.sin(titlePulse * 2) * 0.06, 2.05,
                  equippedHelmet(), equippedSuit(), { seed: 3 });

    const btns = titleButtons();
    drawMenuBtn(btns[0], true, iconRocket);
    drawMenuBtn(btns[1], false, iconHangar);
    drawMenuBtn(btns[2], false, iconSuit);
  }

  function drawMenuBtn(b, primary, icon) {
    ctx.fillStyle = primary ? 'rgba(58,140,255,0.92)' : 'rgba(140,170,220,0.13)';
    roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 17);
    ctx.fill();
    ctx.strokeStyle = primary ? 'rgba(255,255,255,0.4)' : 'rgba(160,190,230,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    icon(b.x - b.w / 2 + 29, b.y);
    ctx.fillStyle = primary ? '#fff' : 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 19px system-ui';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x - b.w / 2 + 52, b.y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
  }

  function iconRocket(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.quadraticCurveTo(6, -4, 4.5, 4);
