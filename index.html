<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Acornaut</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070f;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #f2efe6;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    max-width: 480px;
    background: #05070f;
  }
  #devPanel {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    padding: 10px 14px 16px;
    background: rgba(8,12,24,0.92);
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 12px;
    max-width: 480px;
    margin: 0 auto;
    touch-action: manipulation;
    user-select: none;
  }
  #devPanel.show { display: block; }
  #devPanel label {
    display: flex; align-items: center; gap: 8px;
    margin: 6px 0; color: rgba(255,255,255,0.85);
  }
  #devPanel label span { width: 72px; flex-shrink: 0; }
  #devPanel label b { width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: #6ef0ff; }
  #devPanel input[type=range] { flex: 1; accent-color: #3a9cff; }
  #devPanel .row { display: flex; gap: 8px; margin-top: 8px; }
  #devPanel button {
    flex: 1; padding: 8px; border: 0; border-radius: 10px;
    background: rgba(255,255,255,0.1); color: #fff; font-weight: 600; font-size: 12px;
  }
  #devBadge {
    display: none;
    position: fixed; top: 8px; right: 8px; z-index: 15;
    background: #ff6a28; color: #fff; font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px;
  }
  #devBadge.show { display: block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="devBadge">DEV</div>
<div id="devPanel">
  <label><span>Tap</span><input id="slFlap" type="range" min="200" max="1000" step="10" value="580"><b id="vFlap">580</b></label>
  <label><span>Gravity</span><input id="slGrav" type="range" min="600" max="2500" step="25" value="1450"><b id="vGrav">1450</b></label>
  <label><span>X pos</span><input id="slX" type="range" min="10" max="50" step="1" value="28"><b id="vX">0.28</b></label>
  <div class="row">
    <button id="btnResetPhys" type="button">Reset physics</button>
    <button id="btnExitDev" type="button">Exit DEV</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/gh/j6sistek-ui/acornaut@main/game.js"></script>
<p style="color:#fff;text-align:center;padding:2rem;font-family:system-ui">If blank, download from Drive: search Acornaut folder for acornaut.html</p>
</body>
</html>
